name: Install pnpm dependencies
description: Set up pnpm and Node.js, restore the pnpm cache, and install from the lockfile

# Callers must check out the repository before invoking this action. Keeping the
# package-manager bootstrap here gives every dependency-installing workflow one
# cache implementation and one frozen-lockfile policy.
inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: "22"
  registry-url:
    description: Optional package registry URL for publishing workflows
    required: false
    default: ""
  cache:
    description: Whether actions/setup-node should cache the pnpm store
    required: false
    default: "true"
  working-directory:
    description: Repository directory containing package.json and pnpm-lock.yaml
    required: false
    default: .
  ignore-scripts:
    description: Whether to disable package lifecycle scripts and pnpmfile hooks during installation
    required: false
    default: "false"
  filter:
    description: Optional pnpm workspace filter restricting the install to one workspace project; empty installs every workspace project
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4

    - name: Set up Node.js with pnpm cache
      if: inputs.cache == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
        registry-url: ${{ inputs.registry-url }}

    - name: Set up Node.js without package-manager cache
      if: inputs.cache != 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies without lifecycle scripts or pnpmfile hooks
      if: inputs.ignore-scripts == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INSTALL_FILTER: ${{ inputs.filter }}
      run: |
        set --
        if [ -n "$INSTALL_FILTER" ]; then
          set -- --filter "$INSTALL_FILTER"
        fi
        env -u GITHUB_ENV -u GITHUB_OUTPUT -u GITHUB_PATH -u GITHUB_STATE \
          -u GITHUB_STEP_SUMMARY pnpm "$@" install --frozen-lockfile --ignore-scripts --ignore-pnpmfile

    - name: Install dependencies
      if: inputs.ignore-scripts != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INSTALL_FILTER: ${{ inputs.filter }}
      run: |
        set --
        if [ -n "$INSTALL_FILTER" ]; then
          set -- --filter "$INSTALL_FILTER"
        fi
        env -u GITHUB_ENV -u GITHUB_OUTPUT -u GITHUB_PATH -u GITHUB_STATE \
          -u GITHUB_STEP_SUMMARY pnpm "$@" install --frozen-lockfile
