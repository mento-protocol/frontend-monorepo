version: 2
updates:
  # npm / pnpm workspace dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "06:00" # trunk-ignore(yamllint/quoted-strings)
      timezone: UTC

    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      # Patch cooldown matches minor: with processor-prepared one-click
      # merges, the cooldown window is the main compensating control against
      # a malicious release that gets yanked days after publication.
      semver-patch-days: 7

    open-pull-requests-limit: 5

    labels:
      - dependencies

    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

    groups:
      frontend-core:
        applies-to: version-updates
        patterns:
          - next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - "@t3-oss/env-nextjs"
          - "@vercel/*"
        update-types:
          - minor
          - patch

      # Wallet, transaction, signing, and bridge packages: the highest-value
      # supply-chain target in a DeFi frontend. Isolating them here keeps
      # them out of the routine grouped batches, so their updates always
      # arrive as a focused PR that gets undivided human review.
      web3-stack:
        applies-to: version-updates
        patterns:
          - wagmi
          - viem
          - viem-*
          - "@wagmi/*"
          - "@rainbow-me/*"
          - "@metamask/*"
          - ethers
          - ethers-*
          - "@mento-protocol/*"
          - "@wormhole-foundation/*"
          - "@solana/*"
          - "@walletconnect/*"
          - "@reown/*"
          - "@celo/*"
          - "@ledgerhq/*"
          - "@trezor/*"
          - "@safe-global/*"
          - "@noble/*"
          - "@scure/*"
          - "*wallet*"
          - "*web3*"
        update-types:
          - minor
          - patch

      ui-styling:
        applies-to: version-updates
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
          - "@radix-ui/*"
          - postcss
          - lucide-react
          - next-themes
          - react-hook-form
          - sonner
          - jotai
          - zod
        update-types:
          - minor
          - patch

      # Catch-all so ungrouped production stragglers arrive as one monthly PR
      # instead of one PR each. Excludes every pattern already owned by a
      # group above so each dependency has exactly one home.
      production-misc:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
        exclude-patterns:
          - next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - "@t3-oss/env-nextjs"
          - "@vercel/*"
          - wagmi
          - viem
          - viem-*
          - "@wagmi/*"
          - "@rainbow-me/*"
          - "@metamask/*"
          - ethers
          - ethers-*
          - "@mento-protocol/*"
          - "@wormhole-foundation/*"
          - "@solana/*"
          - "@walletconnect/*"
          - "@reown/*"
          - "@celo/*"
          - "@ledgerhq/*"
          - "@trezor/*"
          - "@safe-global/*"
          - "@noble/*"
          - "@scure/*"
          - "*wallet*"
          - "*web3*"
          - tailwindcss
          - "@tailwindcss/*"
          - "@radix-ui/*"
          - postcss
          - lucide-react
          - next-themes
          - react-hook-form
          - sonner
          - jotai
          - zod
        update-types:
          - minor
          - patch

      tooling:
        applies-to: version-updates
        dependency-type: development

      security-runtime:
        applies-to: security-updates
        dependency-type: production

      security-tooling:
        applies-to: security-updates
        dependency-type: development

    # Handle ALL major upgrades intentionally, as a scheduled maintenance
    # task, not as unsolicited PRs. The previous enumerated list let
    # unlisted majors through (e.g. lucide-react 0.x -> 1.x). Note this also
    # covers devDependency majors, and that Dependabot security updates
    # respect this ignore — a security fix shipped only in a new major
    # surfaces through the required osv-scanner gate instead, which is the
    # authoritative vulnerability signal in this repository.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00" # trunk-ignore(yamllint/quoted-strings)
      timezone: UTC

    cooldown:
      default-days: 7

    open-pull-requests-limit: 3

    labels:
      - dependencies

    commit-message:
      prefix: chore(ci)

    groups:
      github-actions-routine:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          # These actions participate in dependency review, code scanning, or
          # the processor's own trust boundary. Keep their updates isolated so
          # one sensitive pin cannot lend authority to an otherwise routine
          # grouped update.
          - actions/create-github-app-token
          - actions/dependency-review-action
          - anthropics/*
          - dependabot/*
          - github/codeql-action*
          - google/osv-scanner-action*
          - ossf/scorecard-action
        update-types:
          - minor
          - patch

      github-actions-manual:
        applies-to: version-updates
        patterns:
          - actions/create-github-app-token
          - actions/dependency-review-action
          - anthropics/*
          - dependabot/*
          - github/codeql-action*
          - google/osv-scanner-action*
          - ossf/scorecard-action

      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
