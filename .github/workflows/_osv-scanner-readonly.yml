name: Read-only OSV Scanner

# Pull-request adapter for OSV-Scanner's PR mode: scan the base branch, scan
# this branch, and fail only on vulnerabilities the pull request introduces.
# Advisories already present on `main` are the daily scheduled scan's problem,
# not every open pull request's.
#
# This reproduces the steps of the upstream
# `google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml`
# (base scan, head scan, `osv-reporter --old/--new`) against the same pinned
# action revision. It is not called directly because that upstream workflow
# declares `security-events: write` at job scope, checks out with persisted
# credentials, and always runs `actions/upload-artifact`. GitHub rejects a
# read-only caller before it evaluates the false `upload-sarif` input, so a
# pull-request scan that used it would have to be granted SARIF write access to
# untrusted head code. SARIF publication stays in the separate scheduled and
# manual jobs, which run a full scan.

on:
  workflow_call:
    inputs:
      scan-args:
        description: Exact config and lockfile arguments for this OSV scan
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  osv-scan:
    name: osv-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      # fetch-depth: 0 fetches every branch into refs/remotes/origin/*, so the
      # base checkout below is a local operation and needs no credentials.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the base branch
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git checkout --detach "origin/${BASE_REF}"

      - name: Scan the selected lockfile on the base branch
        id: scan-base
        uses: google/osv-scanner-action/osv-scanner-action@8e5cf47b818121e8b405931c82126c2630b0b20d # v2.5.1
        with:
          scan-args: |-
            --output=old-results.json
            --format=json
            ${{ inputs.scan-args }}
        continue-on-error: true

      # A base scan produces no results when the lockfile or config this job
      # scans does not exist on the base branch yet, and when the scan itself
      # fails. Both cases fall back to an empty baseline, so every finding on
      # this branch counts as new. That is the strict direction: it can only
      # report more than the true diff, never fewer.
      - name: Establish the base vulnerability baseline
        shell: bash
        env:
          BASE_RESULTS: old-results.json
        run: |
          if [ ! -s "${BASE_RESULTS}" ]; then
            echo "::warning::The base-branch OSV scan produced no ${BASE_RESULTS}. Treating the base branch as having no known vulnerabilities, so every finding on this branch is reported as newly introduced."
            printf '{"results":[]}\n' > "${BASE_RESULTS}"
          fi

      - name: Check out this branch
        shell: bash
        env:
          HEAD_SHA: ${{ github.sha }}
        run: git checkout --detach --force "${HEAD_SHA}"

      - name: Scan the selected lockfile
        id: scan
        uses: google/osv-scanner-action/osv-scanner-action@8e5cf47b818121e8b405931c82126c2630b0b20d # v2.5.1
        with:
          scan-args: |-
            --output=results.json
            --format=json
            ${{ inputs.scan-args }}
        continue-on-error: true

      # The scanner also exits non-zero when it finds vulnerabilities. Let the
      # reporter handle that case, but fail if the scanner wrote no results.
      # The reporter reads a missing --new file as "no new vulnerabilities" and
      # exits 0, so a change that stops the scanner from completing would
      # otherwise pass as a clean diff.
      - name: Check that the scan completed
        if: ${{ steps.scan.outcome == 'failure' }}
        shell: bash
        env:
          RESULTS: results.json
        run: |
          if [ ! -s "${RESULTS}" ]; then
            echo '::error::OSV-Scanner failed without writing results.json. Failing instead of reporting a clean scan.'
            exit 1
          fi

      - name: Fail on newly introduced vulnerabilities
        uses: google/osv-scanner-action/osv-reporter-action@8e5cf47b818121e8b405931c82126c2630b0b20d # v2.5.1
        with:
          scan-args: |-
            --output=results.sarif
            --old=old-results.json
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=true
