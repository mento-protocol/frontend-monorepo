name: Read-only OSV Scanner

# The upstream reusable workflow declares `security-events: write` at
# job scope. GitHub rejects a read-only caller before it evaluates the
# false `upload-sarif` input. This adapter keeps PR scans read-only and leaves
# SARIF publication in the separate scheduled/manual jobs.

on:
  workflow_call:
    inputs:
      scan-args:
        description: Exact config and lockfile arguments for this OSV scan
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  osv-scan:
    name: osv-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan the selected lockfile
        id: scan
        uses: google/osv-scanner-action/osv-scanner-action@8e5cf47b818121e8b405931c82126c2630b0b20d # v2.5.1
        with:
          scan-args: |-
            --output=results.json
            --format=json
            ${{ inputs.scan-args }}
        continue-on-error: true

      # The scanner also exits non-zero when it finds vulnerabilities. Let the
      # reporter handle that case, but fail if the scanner wrote no results.
      - name: Check that the scan completed
        if: ${{ steps.scan.outcome == 'failure' }}
        shell: bash
        env:
          RESULTS: results.json
        run: |
          if [ ! -s "${RESULTS}" ]; then
            echo '::error::OSV-Scanner failed without writing results.json. Failing instead of reporting a clean scan.'
            exit 1
          fi

      - name: Fail on detected vulnerabilities
        uses: google/osv-scanner-action/osv-reporter-action@8e5cf47b818121e8b405931c82126c2630b0b20d # v2.5.1
        with:
          scan-args: |-
            --output=results.sarif
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=true
