name: CI Failure Notifier

# workflow_run executes this trusted default-branch workflow after monitored
# workflows complete. Never check out or execute the triggering head SHA here.
on:
  workflow_run:
    workflows:
      - CI/CD
      - E2E (Connected Wallet)
      - Publish UI Package
      - Quality Budgets
      - Scorecard supply-chain security
      - Supply Chain
      - Vercel Main Deployment
      - Visual Regression
    types: [completed]

permissions:
  contents: read

jobs:
  reconcile-issue:
    name: reconcile failure issue
    if: >-
      contains(fromJSON('["push", "schedule", "workflow_dispatch", "workflow_run"]'), github.event.workflow_run.event) &&
      contains(fromJSON('["success", "action_required", "failure", "startup_failure", "timed_out"]'), github.event.workflow_run.conclusion) &&
      (
        github.event.workflow_run.event == 'schedule' ||
        (
          github.event.workflow_run.event == 'push' &&
          (
            github.event.workflow_run.head_branch == github.event.repository.default_branch ||
            github.event.workflow_run.name == 'Publish UI Package'
          )
        ) ||
        (
          github.event.workflow_run.event == 'workflow_dispatch' &&
          github.event.workflow_run.head_branch == github.event.repository.default_branch
        ) ||
        (
          github.event.workflow_run.event == 'workflow_run' &&
          github.event.workflow_run.name == 'Vercel Main Deployment' &&
          github.event.workflow_run.head_branch == github.event.repository.default_branch &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    concurrency:
      group: ci-failure-${{ github.event.workflow_run.workflow_id }}
      cancel-in-progress: false
      queue: max # trunk-ignore(actionlint/syntax-check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out trusted notifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      # The scanner's own structured findings for the failing run, so the managed
      # Supply Chain issue can name the vulnerable package without reading a job
      # log. Downloaded, never parsed here: the notifier script validates the
      # JSON strictly and renders an allowlisted set of fields.
      #
      # `github.token`, not a repository secret — the notifier stays secretless,
      # and `actions: read` above is exactly the artifact-read scope this needs.
      #
      # `runner.temp`, deliberately outside the trusted notifier checkout, so no
      # artifact entry can land on the script that is about to run. The step is
      # `continue-on-error`: a run with no artifact must still get its issue,
      # and the script degrades to a documented note rather than a log excerpt.
      - name: Download the OSV findings artifact
        if: github.event.workflow_run.name == 'Supply Chain'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: osv-findings
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/osv-findings

      - name: Open, update, or close the managed failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Set only for the workflow that uploads a findings artifact, so every
          # other workflow's issue keeps its previous shape. The run id lets the
          # script refuse to attribute these findings to a different run, which
          # reconciliation to a later decisive run would otherwise do.
          OSV_FINDINGS_DIR: ${{ github.event.workflow_run.name == 'Supply Chain' && format('{0}/osv-findings', runner.temp) || '' }}
          OSV_FINDINGS_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const moduleUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/ci-failure-issue.mjs`,
            );
            const { reconcileCiFailureIssue } = await import(moduleUrl.href);
            await reconcileCiFailureIssue({ github, context, core });
