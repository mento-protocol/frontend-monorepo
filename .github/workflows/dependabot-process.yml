name: Dependabot Processor

# A valid intake exposes only bounded repository, PR, head, and event metadata.
# Sweeps share one global target, while receipt=false intake completions remain
# visibly non-targeted so the failure notifier can ignore their skipped runs.
run-name: >-
  ${{ github.event_name == 'workflow_run' && format('Dependabot processor | event=workflow_run | receipt={0}', github.event.workflow_run.display_title) || format('Dependabot processor | event={0} | target=scope=open', github.event_name) }}

on:
  workflow_run:
    workflows:
      - Dependabot Intake
      - Dependabot Prepared Head Intake
      - Dependabot Claude Review
    types: [completed]
  repository_dispatch:
    types: [dependabot-process]
  schedule:
    # Reconcile checks that settle without a dedicated workflow callback.
    # Staggering away from :00 bounds the unattended delay to ten minutes.
    - cron: 3,13,23,33,43,53 * * * *

# Every job replaces this deny-all default with only its required API scopes.
permissions: {}

env:
  # This raw repository setting is normalized by a secretless shell step before
  # it reaches the trusted core. Only exact observe, assist, and prepare values
  # survive; legacy merge, empty, unknown, and case variants become observe.
  DEPENDABOT_PROCESSOR_MODE: ${{ vars.DEPENDABOT_PROCESSOR_MODE }}

# One queue owns all Dependabot decisions. A new intake never cancels an
# in-flight approval or merge-admission revalidation.
concurrency:
  group: dependabot-processor
  cancel-in-progress: false
  queue: max # trunk-ignore(actionlint/syntax-check)

jobs:
  evaluate:
    name: Evaluate current Dependabot state without write authority
    if: >-
      github.repository == 'mento-protocol/frontend-monorepo' &&
      (
        github.event_name == 'schedule' ||
        (
          github.event_name == 'repository_dispatch' &&
          github.event.action == 'dependabot-process'
        ) ||
        (
          github.event_name == 'workflow_run' &&
          (
            (
              (github.event.workflow_run.path == '.github/workflows/dependabot-intake.yml' ||
               github.event.workflow_run.path == '.github/workflows/dependabot-intake.yml@main') &&
              endsWith(github.event.workflow_run.display_title, 'receipt=true')
            ) ||
            (
              (github.event.workflow_run.path == '.github/workflows/dependabot-prepared-head-intake.yml' ||
               github.event.workflow_run.path == '.github/workflows/dependabot-prepared-head-intake.yml@main') &&
              startsWith(github.event.workflow_run.display_title, 'dependabot-prepared-head:v1|') &&
              endsWith(github.event.workflow_run.display_title, '|ok=true')
            ) ||
            (
              (github.event.workflow_run.path == '.github/workflows/dependabot-claude-review.yml' ||
               github.event.workflow_run.path == '.github/workflows/dependabot-claude-review.yml@main') &&
              startsWith(github.event.workflow_run.display_title, 'dependabot-claude-review:v1 | source=')
            )
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    outputs:
      actions_companion_base_sha: ${{ steps.evaluation.outputs.actions_companion_base_sha }}
      actions_companion_candidate: ${{ steps.evaluation.outputs.actions_companion_candidate }}
      actions_companion_head_sha: ${{ steps.evaluation.outputs.actions_companion_head_sha }}
      actions_companion_pr_number: ${{ steps.evaluation.outputs.actions_companion_pr_number }}
      claude_retry_candidate: ${{ steps.target.outputs.claude_retry_candidate }}
      claude_run_attempt: ${{ steps.target.outputs.claude_run_attempt }}
      claude_run_id: ${{ steps.target.outputs.claude_run_id }}
      claude_run_title: ${{ steps.target.outputs.claude_run_title }}
      expected_head_sha: ${{ steps.target.outputs.expected_head_sha }}
      pr_numbers: ${{ steps.target.outputs.pr_numbers }}
      processor_mode: ${{ steps.mode.outputs.processor_mode }}
      prepare: ${{ steps.mode.outputs.prepare }}
      refresh_pending: ${{ steps.evaluation.outputs.refresh_pending }}
      refresh_required: ${{ steps.evaluation.outputs.refresh_required }}
    steps:
      - name: Validate trigger and select a bounded target
        id: target
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_NAME: ${{ github.event_name }}
          INTAKE_ACTOR_LOGIN: ${{ github.event.workflow_run.actor.login }}
          INTAKE_ACTOR_ID: ${{ github.event.workflow_run.actor.id }}
          INTAKE_ACTOR_TYPE: ${{ github.event.workflow_run.actor.type }}
          INTAKE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          INTAKE_EVENT: ${{ github.event.workflow_run.event }}
          INTAKE_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INTAKE_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          INTAKE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INTAKE_PATH: ${{ github.event.workflow_run.path }}
          INTAKE_PULL_REQUESTS_JSON: ${{ toJson(github.event.workflow_run.pull_requests) }}
          INTAKE_TITLE: ${{ github.event.workflow_run.display_title }}
          INTAKE_TRIGGERING_ACTOR_LOGIN: ${{ github.event.workflow_run.triggering_actor.login }}
          INTAKE_TRIGGERING_ACTOR_TYPE: ${{ github.event.workflow_run.triggering_actor.type }}
          INTAKE_STATUS: ${{ github.event.workflow_run.status }}
          INTAKE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          INTAKE_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_PREPARE_BOT_ID: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_BOT_ID }}
          EXPECTED_PREPARE_BOT_LOGIN: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_BOT_LOGIN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = "mento-protocol/frontend-monorepo"
          test "$DEFAULT_BRANCH" = "main"

          case "$EVENT_NAME" in
            workflow_run)
              claude_retry_candidate=false
              claude_run_attempt=
              claude_run_id=
              claude_run_title=
              test "$INTAKE_STATUS" = "completed"
              test "$INTAKE_HEAD_REPOSITORY" = "$REPOSITORY"
              [[ "$INTAKE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
              [[ "$INTAKE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              [[ "$INTAKE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]

              case "$INTAKE_PATH" in
                .github/workflows/dependabot-intake.yml|.github/workflows/dependabot-intake.yml@main)
                  test "$INTAKE_CONCLUSION" = "success"
                  test "$INTAKE_EVENT" = "pull_request_target"
                  test "$INTAKE_ACTOR_LOGIN" = "dependabot[bot]"
                  test "$INTAKE_ACTOR_TYPE" = "Bot"
                  if test -n "$INTAKE_TRIGGERING_ACTOR_LOGIN" || \
                    test -n "$INTAKE_TRIGGERING_ACTOR_TYPE"; then
                    test "$INTAKE_TRIGGERING_ACTOR_LOGIN" = "dependabot[bot]"
                    test "$INTAKE_TRIGGERING_ACTOR_TYPE" = "Bot"
                  fi
                  [[ "$INTAKE_HEAD_BRANCH" == dependabot/* ]]
                  receipt_pattern='^dependabot-intake:v1 \| repository=mento-protocol/frontend-monorepo \| pr=([1-9][0-9]{0,9}) \| sha=([0-9a-f]{40}) \| action=(opened|synchronize|reopened) \| receipt=true$'
                  [[ "$INTAKE_TITLE" =~ $receipt_pattern ]]
                  receipt_pr_number="${BASH_REMATCH[1]}"
                  receipt_head_sha="${BASH_REMATCH[2]}"
                  test "$INTAKE_HEAD_SHA" = "$receipt_head_sha"
                  RECEIPT_HEAD_SHA="$receipt_head_sha" \
                    RECEIPT_PR_NUMBER="$receipt_pr_number" \
                    node --input-type=module --eval '
                      const linked = JSON.parse(
                        process.env.INTAKE_PULL_REQUESTS_JSON,
                      );
                      if (!Array.isArray(linked) || linked.length > 1) {
                        throw new Error("Invalid intake linked-PR cardinality");
                      }
                      if (linked.length === 1) {
                        const [pullRequest] = linked;
                        if (
                          pullRequest?.number !==
                            Number(process.env.RECEIPT_PR_NUMBER) ||
                          pullRequest?.head?.ref !==
                            process.env.INTAKE_HEAD_BRANCH ||
                          pullRequest?.head?.sha !==
                            process.env.RECEIPT_HEAD_SHA ||
                          pullRequest?.base?.ref !== "main"
                        ) {
                          throw new Error("Intake linked PR does not match receipt");
                        }
                      }
                    '
                  followup_kind="native-intake"
                  ;;
                .github/workflows/dependabot-prepared-head-intake.yml|.github/workflows/dependabot-prepared-head-intake.yml@main)
                  test "$INTAKE_CONCLUSION" = "success"
                  test "$INTAKE_EVENT" = "repository_dispatch"
                  test "$INTAKE_HEAD_BRANCH" = "main"
                  test "$INTAKE_ACTOR_ID" = "$EXPECTED_PREPARE_BOT_ID"
                  test "$INTAKE_ACTOR_LOGIN" = "$EXPECTED_PREPARE_BOT_LOGIN"
                  test "$INTAKE_ACTOR_TYPE" = "Bot"
                  prepared_pattern='^dependabot-prepared-head:v1\|p=([1-9][0-9]{0,9})\|h=([0-9a-f]{40})\|o=([rp])\|c=([1-9][0-9]*)\|d=([0-9a-f]{64})\|ok=true$'
                  [[ "$INTAKE_TITLE" =~ $prepared_pattern ]]
                  receipt_pr_number="${BASH_REMATCH[1]}"
                  receipt_head_sha="${BASH_REMATCH[2]}"
                  operation_code="${BASH_REMATCH[3]}"
                  operation_check_id="${BASH_REMATCH[4]}"
                  operation_digest="${BASH_REMATCH[5]}"
                  followup_kind="prepared-intake"
                  ;;
                .github/workflows/dependabot-claude-review.yml|.github/workflows/dependabot-claude-review.yml@main)
                  [[ "$CURRENT_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
                  test "$INTAKE_HEAD_SHA" = "$CURRENT_WORKFLOW_SHA"
                  case "$INTAKE_CONCLUSION" in
                    success|failure) ;;
                    *) exit 1 ;;
                  esac
                  test "$INTAKE_EVENT" = "workflow_run"
                  test "$INTAKE_HEAD_BRANCH" = "main"
                  native_review_pattern='^dependabot-claude-review:v1 \| source=dependabot-intake:v1 \| repository=mento-protocol/frontend-monorepo \| pr=([1-9][0-9]{0,9}) \| sha=([0-9a-f]{40}) \| action=(opened|synchronize|reopened) \| receipt=true$'
                  prepared_review_pattern='^dependabot-claude-review:v1 \| source=dependabot-prepared-head:v1\|p=([1-9][0-9]{0,9})\|h=([0-9a-f]{40})\|o=([rp])\|c=([1-9][0-9]*)\|d=([0-9a-f]{64})\|ok=true$'
                  if [[ "$INTAKE_TITLE" =~ $native_review_pattern ]]; then
                    receipt_pr_number="${BASH_REMATCH[1]}"
                    receipt_head_sha="${BASH_REMATCH[2]}"
                    test "$INTAKE_ACTOR_LOGIN" = "dependabot[bot]"
                    test "$INTAKE_ACTOR_TYPE" = "Bot"
                  elif [[ "$INTAKE_TITLE" =~ $prepared_review_pattern ]]; then
                    receipt_pr_number="${BASH_REMATCH[1]}"
                    receipt_head_sha="${BASH_REMATCH[2]}"
                    operation_code="${BASH_REMATCH[3]}"
                    operation_check_id="${BASH_REMATCH[4]}"
                    operation_digest="${BASH_REMATCH[5]}"
                    test "$INTAKE_ACTOR_ID" = "$EXPECTED_PREPARE_BOT_ID"
                    test "$INTAKE_ACTOR_LOGIN" = "$EXPECTED_PREPARE_BOT_LOGIN"
                    test "$INTAKE_ACTOR_TYPE" = "Bot"
                  else
                    exit 1
                  fi
                  followup_kind="claude-review"
                  claude_run_attempt="$INTAKE_RUN_ATTEMPT"
                  claude_run_id="$INTAKE_RUN_ID"
                  claude_run_title="$INTAKE_TITLE"
                  if test "$INTAKE_CONCLUSION" = "failure" && \
                    (( INTAKE_RUN_ATTEMPT <= 2 )); then
                    claude_retry_candidate=true
                  fi
                  ;;
                *) exit 1 ;;
              esac
              echo "pr_numbers=$receipt_pr_number" >> "$GITHUB_OUTPUT"
              echo "expected_head_sha=$receipt_head_sha" >> "$GITHUB_OUTPUT"
              echo "followup_kind=$followup_kind" >> "$GITHUB_OUTPUT"
              echo "operation_code=${operation_code:-}" >> "$GITHUB_OUTPUT"
              echo "operation_check_id=${operation_check_id:-}" >> "$GITHUB_OUTPUT"
              echo "operation_digest=${operation_digest:-}" >> "$GITHUB_OUTPUT"
              echo "claude_retry_candidate=$claude_retry_candidate" >> "$GITHUB_OUTPUT"
              echo "claude_run_attempt=$claude_run_attempt" >> "$GITHUB_OUTPUT"
              echo "claude_run_id=$claude_run_id" >> "$GITHUB_OUTPUT"
              echo "claude_run_title=$claude_run_title" >> "$GITHUB_OUTPUT"
              ;;
            repository_dispatch)
              node --input-type=module --eval '
                import { readFileSync } from "node:fs";

                const payload = JSON.parse(
                  readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"),
                );
                const clientPayload = payload.client_payload;
                if (
                  payload.action !== "dependabot-process" ||
                  clientPayload === null ||
                  typeof clientPayload !== "object" ||
                  Array.isArray(clientPayload) ||
                  JSON.stringify(Object.keys(clientPayload).sort()) !==
                    JSON.stringify(["scope"]) ||
                  clientPayload.scope !== "open"
                ) {
                  throw new Error("Invalid dependabot-process dispatch envelope");
                }
              '
              echo "pr_numbers=all" >> "$GITHUB_OUTPUT"
              echo "expected_head_sha=" >> "$GITHUB_OUTPUT"
              echo "claude_retry_candidate=false" >> "$GITHUB_OUTPUT"
              ;;
            schedule)
              echo "pr_numbers=all" >> "$GITHUB_OUTPUT"
              echo "expected_head_sha=" >> "$GITHUB_OUTPUT"
              echo "claude_retry_candidate=false" >> "$GITHUB_OUTPUT"
              ;;
            *) exit 1 ;;
          esac

      - name: Normalize the exact processor mode without credentials
        id: mode
        shell: bash
        env:
          RAW_PROCESSOR_MODE: ${{ env.DEPENDABOT_PROCESSOR_MODE }}
        run: |
          set -euo pipefail
          case "$RAW_PROCESSOR_MODE" in
            observe|assist|prepare)
              processor_mode="$RAW_PROCESSOR_MODE"
              ;;
            *)
              processor_mode="observe"
              ;;
          esac
          echo "processor_mode=$processor_mode" >> "$GITHUB_OUTPUT"
          if test "$processor_mode" = "prepare"; then
            echo "prepare=true" >> "$GITHUB_OUTPUT"
          else
            echo "prepare=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize the processor from the exact trusted workflow SHA
        id: processor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          trusted_root="$RUNNER_TEMP/dependabot-processor"
          install -d -m 0700 "$trusted_root"
          trusted_processor="$trusted_root/dependabot-processor.mjs"
          trusted_receipts="$trusted_root/dependabot-preparation-receipts.mjs"
          resolved_sha="$(gh api "repos/$REPOSITORY/commits/$WORKFLOW_SHA" --jq .sha)"
          test "$resolved_sha" = "$WORKFLOW_SHA"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPOSITORY/contents/scripts/dependabot-processor.mjs?ref=$WORKFLOW_SHA" \
            > "$trusted_processor"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPOSITORY/contents/scripts/dependabot-preparation-receipts.mjs?ref=$WORKFLOW_SHA" \
            > "$trusted_receipts"
          test -s "$trusted_processor"
          test -s "$trusted_receipts"
          chmod 0500 "$trusted_processor"
          chmod 0400 "$trusted_receipts"
          echo "path=$trusted_processor" >> "$GITHUB_OUTPUT"

      - name: Evaluate live PR, check, baseline, and feedback state
        id: evaluation
        shell: bash
        env:
          DEPENDABOT_PROCESSOR_GITHUB_TOKEN: ${{ github.token }}
          EVALUATION_RESULT_PATH: ${{ runner.temp }}/dependabot-evaluation-result.json
          EXPECTED_HEAD_SHA: ${{ steps.target.outputs.expected_head_sha }}
          PROCESSOR_MODE: ${{ steps.mode.outputs.processor_mode }}
          PROCESSOR_PATH: ${{ steps.processor.outputs.path }}
          PR_NUMBERS: ${{ steps.target.outputs.pr_numbers }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          arguments=(
            evaluate
            --live
            --repo "$REPOSITORY"
            --pr-numbers "$PR_NUMBERS"
            --mode "$PROCESSOR_MODE"
          )
          if test -n "$EXPECTED_HEAD_SHA"; then
            arguments+=(--expected-head-sha "$EXPECTED_HEAD_SHA")
          fi
          node "$PROCESSOR_PATH" "${arguments[@]}" > "$EVALUATION_RESULT_PATH"
          node --input-type=module --eval '
            import { appendFileSync, readFileSync } from "node:fs";

            const result = JSON.parse(
              readFileSync(process.env.EVALUATION_RESULT_PATH, "utf8"),
            );
            const candidate = result?.prepareCandidate;
            const companionCandidate = result?.actionsCompanionCandidate;
            const allowedDispositions = new Set([
              "feedback-remediation-required",
              "prepare-candidate",
              "refresh-pending",
              "refresh-receipt-required",
              "refresh-required",
              "repair-pending",
              "repair-required",
              "waiting-baseline",
              "waiting-checks",
              "waiting-retry",
            ]);
            const validCandidate =
              candidate === null ||
              (candidate !== null &&
                typeof candidate === "object" &&
                !Array.isArray(candidate) &&
                JSON.stringify(Object.keys(candidate).sort()) ===
                  JSON.stringify([
                    "disposition",
                    "headSha",
                    "pullRequestNumber",
                  ]) &&
                allowedDispositions.has(candidate.disposition) &&
                /^[0-9a-f]{40}$/.test(candidate.headSha ?? "") &&
                Number.isSafeInteger(candidate.pullRequestNumber) &&
                candidate.pullRequestNumber >= 1 &&
                candidate.pullRequestNumber <= 9_999_999_999 &&
                Array.isArray(result.evaluations) &&
                result.evaluations.filter(
                  (evaluation) =>
                    evaluation?.pullRequestNumber ===
                      candidate.pullRequestNumber &&
                    evaluation?.headSha === candidate.headSha &&
                    evaluation?.disposition === candidate.disposition,
                ).length === 1);
            const validCompanionCandidate =
              companionCandidate === null ||
              (companionCandidate !== null &&
                typeof companionCandidate === "object" &&
                !Array.isArray(companionCandidate) &&
                JSON.stringify(Object.keys(companionCandidate).sort()) ===
                  JSON.stringify([
                    "baseSha",
                    "headSha",
                    "pullRequestNumber",
                  ]) &&
                /^[0-9a-f]{40}$/.test(companionCandidate.baseSha ?? "") &&
                /^[0-9a-f]{40}$/.test(companionCandidate.headSha ?? "") &&
                Number.isSafeInteger(companionCandidate.pullRequestNumber) &&
                companionCandidate.pullRequestNumber >= 1 &&
                companionCandidate.pullRequestNumber <= 9_999_999_999 &&
                candidate === null &&
                result?.serialization?.ready === true &&
                result.evaluations.filter(
                  (evaluation) =>
                    evaluation?.pullRequestNumber ===
                      companionCandidate.pullRequestNumber &&
                    evaluation?.headSha === companionCandidate.headSha &&
                    evaluation?.base?.currentBaseSha ===
                      companionCandidate.baseSha &&
                    evaluation?.baseSha === companionCandidate.baseSha &&
                    evaluation?.disposition === "manual-review",
                ).length === 1);
            if (
              result?.schema !== "dependabot-processor:v2" ||
              result?.repository !== process.env.REPOSITORY ||
              result?.mode !== process.env.PROCESSOR_MODE ||
              !Array.isArray(result?.evaluations) ||
              !Object.hasOwn(result, "prepareCandidate") ||
              !Object.hasOwn(result, "actionsCompanionCandidate") ||
              !validCandidate ||
              !validCompanionCandidate ||
              (result.mode !== "prepare" &&
                (candidate !== null || companionCandidate !== null))
            ) {
              throw new Error("Invalid Dependabot evaluation result");
            }
            console.log(
              JSON.stringify({
                event: "dependabot-evaluation-summary",
                prepareCandidate: candidate,
                serialization: {
                  ready: result.serialization?.ready,
                  reason: result.serialization?.reason,
                  selectedDisposition:
                    result.serialization?.selectedDisposition,
                  selectedPullRequestNumber:
                    result.serialization?.selectedPullRequestNumber,
                },
                evaluations: result.evaluations.map((evaluation) => ({
                  branchMaintenanceCommentCount:
                    evaluation?.feedback?.branchMaintenanceCommentCount,
                  disposition: evaluation?.disposition,
                  feedbackClear: evaluation?.feedback?.clear,
                  feedbackReasons: evaluation?.feedback?.reasons,
                  forcePushGenerationKind:
                    evaluation?.feedback?.forcePushGenerationKind,
                  forcePushGenerationReasons:
                    evaluation?.feedback?.forcePushGenerationReasons,
                  forcePushEventCount:
                    evaluation?.feedback?.forcePushEventCount,
                  headSha: evaluation?.headSha,
                  prepareAuthority: evaluation?.identity?.prepareAuthority,
                  pullRequestNumber: evaluation?.pullRequestNumber,
                })),
              }),
            );
            appendFileSync(
              process.env.GITHUB_OUTPUT,
              `refresh_pending=${candidate?.disposition === "refresh-pending"}\n` +
                `refresh_required=${candidate?.disposition === "refresh-required"}\n` +
                `actions_companion_base_sha=${companionCandidate?.baseSha ?? ""}\n` +
                `actions_companion_candidate=${Boolean(companionCandidate)}\n` +
                `actions_companion_head_sha=${companionCandidate?.headSha ?? ""}\n` +
                `actions_companion_pr_number=${companionCandidate?.pullRequestNumber ?? ""}\n`,
            );
          '

  actions-companion-stage:
    name: Stage an exact typed OSV companion head
    needs: [evaluate, prepare-finalize]
    if: >-
      always() &&
      needs.evaluate.result == 'success' &&
      needs.prepare-finalize.result == 'success' &&
      needs.evaluate.outputs.prepare == 'true' &&
      needs.evaluate.outputs.actions_companion_candidate == 'true' &&
      needs.prepare-finalize.outputs.actions_companion_candidate == 'true' &&
      needs.prepare-finalize.outputs.actions_companion_base_sha == needs.evaluate.outputs.actions_companion_base_sha &&
      needs.prepare-finalize.outputs.actions_companion_head_sha == needs.evaluate.outputs.actions_companion_head_sha &&
      needs.prepare-finalize.outputs.actions_companion_pr_number == needs.evaluate.outputs.actions_companion_pr_number
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      soak_partial: ${{ steps.stage.outputs.soak_partial }}
      stage_receipt: ${{ steps.stage.outputs.stage_receipt }}
      stage_result: ${{ steps.stage.outputs.stage_result }}
    steps:
      - name: Checkout the exact evaluated current main for inert census
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: refs/heads/main
          repository: mento-protocol/frontend-monorepo

      - name: Bind current main to the exact evaluated base before App authority
        shell: bash
        env:
          EXPECTED_BASE_SHA: ${{ needs.evaluate.outputs.actions_companion_base_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Materialize the companion adapter from the exact trusted workflow SHA
        id: companion-adapter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = "mento-protocol/frontend-monorepo"
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          trusted_root="$RUNNER_TEMP/dependabot-actions-companion"
          install -d -m 0700 "$trusted_root"
          trusted_helper="$trusted_root/dependabot-actions-companion.mjs"
          trusted_adapter="$trusted_root/dependabot-actions-companion-live.mjs"
          trusted_processor="$trusted_root/dependabot-processor.mjs"
          trusted_receipts="$trusted_root/dependabot-preparation-receipts.mjs"
          trusted_soak="$trusted_root/dependabot-production-soak.mjs"
          resolved_sha="$(gh api "repos/$REPOSITORY/commits/$WORKFLOW_SHA" --jq .sha)"
          test "$resolved_sha" = "$WORKFLOW_SHA"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPOSITORY/contents/scripts/dependabot-actions-companion.mjs?ref=$WORKFLOW_SHA" \
            > "$trusted_helper"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPOSITORY/contents/scripts/dependabot-actions-companion-live.mjs?ref=$WORKFLOW_SHA" \
            > "$trusted_adapter"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPOSITORY/contents/scripts/dependabot-processor.mjs?ref=$WORKFLOW_SHA" \
            > "$trusted_processor"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPOSITORY/contents/scripts/dependabot-preparation-receipts.mjs?ref=$WORKFLOW_SHA" \
            > "$trusted_receipts"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPOSITORY/contents/scripts/dependabot-production-soak.mjs?ref=$WORKFLOW_SHA" \
            > "$trusted_soak"
          test -s "$trusted_helper"
          test -s "$trusted_adapter"
          test -s "$trusted_processor"
          test -s "$trusted_receipts"
          test -s "$trusted_soak"
          chmod 0400 "$trusted_helper"
          chmod 0400 "$trusted_processor"
          chmod 0400 "$trusted_receipts"
          chmod 0500 "$trusted_adapter"
          chmod 0500 "$trusted_soak"
          echo "path=$trusted_adapter" >> "$GITHUB_OUTPUT"
          echo "soak_path=$trusted_soak" >> "$GITHUB_OUTPUT"

      - name: Census the inert exact-base checkout without App credentials
        id: census
        shell: bash
        env:
          ADAPTER_PATH: ${{ steps.companion-adapter.outputs.path }}
          BASE_DIRECTORY: ${{ github.workspace }}
          CENSUS_RESULT_PATH: ${{ runner.temp }}/dependabot-actions-companion-census.json
          DEPENDABOT_COMPANION_GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_BASE_SHA: ${{ needs.evaluate.outputs.actions_companion_base_sha }}
          EXPECTED_HEAD_SHA: ${{ needs.evaluate.outputs.actions_companion_head_sha }}
          EXPECTED_PREPARE_APP_SLUG: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_APP_SLUG }}
          EXPECTED_PREPARE_BOT_ID: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_BOT_ID }}
          EXPECTED_PREPARE_BOT_LOGIN: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_BOT_LOGIN }}
          PR_NUMBER: ${{ needs.evaluate.outputs.actions_companion_pr_number }}
          PROCESSOR_RUN_ATTEMPT: ${{ github.run_attempt }}
          PROCESSOR_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = "mento-protocol/frontend-monorepo"
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_PREPARE_APP_SLUG" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          [[ "$EXPECTED_PREPARE_BOT_ID" =~ ^[1-9][0-9]*$ ]]
          test "$EXPECTED_PREPARE_BOT_LOGIN" = "${EXPECTED_PREPARE_APP_SLUG}[bot]"
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]
          [[ "$PROCESSOR_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$PROCESSOR_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C "$BASE_DIRECTORY" rev-parse HEAD)" = "$EXPECTED_BASE_SHA"
          test -z "$(git -C "$BASE_DIRECTORY" status --porcelain=v1 --untracked-files=no)"
          node "$ADAPTER_PATH" \
            census \
            --base "$EXPECTED_BASE_SHA" \
            --base-dir "$BASE_DIRECTORY" \
            --head "$EXPECTED_HEAD_SHA" \
            --output "$CENSUS_RESULT_PATH" \
            --pr "$PR_NUMBER" \
            --prepare-app-slug "$EXPECTED_PREPARE_APP_SLUG" \
            --prepare-bot-id "$EXPECTED_PREPARE_BOT_ID" \
            --prepare-bot-login "$EXPECTED_PREPARE_BOT_LOGIN" \
            --repo "$REPOSITORY" \
            --run-attempt "$PROCESSOR_RUN_ATTEMPT" \
            --run-id "$PROCESSOR_RUN_ID" \
            --workflow-sha "$WORKFLOW_SHA"
          node --input-type=module --eval '
            import { Buffer } from "node:buffer";
            import { appendFileSync, readFileSync } from "node:fs";
            import { dirname, resolve } from "node:path";
            import { pathToFileURL } from "node:url";

            const helper = resolve(
              dirname(process.env.ADAPTER_PATH),
              "dependabot-actions-companion.mjs",
            );
            const { canonicalJson } = await import(pathToFileURL(helper).href);
            const bytes = readFileSync(process.env.CENSUS_RESULT_PATH);
            if (bytes.byteLength > 8 * 1024 * 1024 + 1) {
              throw new Error("Companion census receipt is too large");
            }
            const raw = bytes.toString("utf8");
            const receipt = JSON.parse(raw);
            const bound =
              !Buffer.from(raw, "utf8").equals(bytes) ||
              raw !== `${canonicalJson(receipt)}\n` ||
              receipt.schema !==
                "dependabot-actions-companion-live-census:v1" ||
              receipt.repository !== process.env.REPOSITORY ||
              receipt.sourcePullRequestNumber !== Number(process.env.PR_NUMBER) ||
              receipt.sourceHeadSha !== process.env.EXPECTED_HEAD_SHA ||
              receipt.workflowSha !== process.env.WORKFLOW_SHA ||
              receipt.orchestratorRunId !== Number(process.env.PROCESSOR_RUN_ID) ||
              receipt.orchestratorRunAttempt !==
                Number(process.env.PROCESSOR_RUN_ATTEMPT) ||
              !Number.isSafeInteger(receipt.processorRunId) ||
              receipt.processorRunId < 1 ||
              !Number.isSafeInteger(receipt.processorRunAttempt) ||
              receipt.processorRunAttempt < 1;
            const planned =
              receipt.result === "planned" &&
              receipt.input?.currentBase?.commitSha ===
                process.env.EXPECTED_BASE_SHA;
            const pull = receipt.companionPullRequest;
            const terminal =
              receipt.result === "terminal" &&
              ["merged", "closed-unmerged"].includes(receipt.reason) &&
              Number.isSafeInteger(pull?.number) &&
              pull.number > 0 &&
              pull.state === receipt.reason &&
              pull.url ===
                `https://github.com/${process.env.REPOSITORY}/pull/${pull.number}` &&
              (receipt.reason === "merged"
                ? typeof pull.mergedAt === "string" &&
                  !Number.isNaN(Date.parse(pull.mergedAt))
                : pull.mergedAt === null);
            if (bound || (!planned && !terminal)) {
              throw new Error("Invalid companion census receipt");
            }
            appendFileSync(
              process.env.GITHUB_OUTPUT,
              `stage_token_required=${planned}\n`,
            );
          '

      - name: Create an isolated workflow-staging App token
        id: companion-stage-token
        if: steps.census.outputs.stage_token_required == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_PROCESSOR_PREPARE_APP_PRIVATE_KEY }}
          owner: mento-protocol
          repositories: frontend-monorepo
          permission-contents: write
          permission-workflows: write

      - name: Bind the staging token to the exact Prepare App bot
        if: steps.census.outputs.stage_token_required == 'true'
        shell: bash
        env:
          ACTUAL_APP_SLUG: ${{ steps.companion-stage-token.outputs.app-slug }}
          ACTUAL_INSTALLATION_ID: ${{ steps.companion-stage-token.outputs.installation-id }}
          EXPECTED_APP_CLIENT_ID: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_APP_CLIENT_ID }}
          EXPECTED_APP_SLUG: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_APP_SLUG }}
          EXPECTED_BOT_ID: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_BOT_ID }}
          EXPECTED_BOT_LOGIN: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_BOT_LOGIN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_APP_CLIENT_ID" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "$EXPECTED_APP_SLUG" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          [[ "$EXPECTED_BOT_ID" =~ ^[1-9][0-9]*$ ]]
          test "$ACTUAL_APP_SLUG" = "$EXPECTED_APP_SLUG"
          [[ "$ACTUAL_INSTALLATION_ID" =~ ^[1-9][0-9]*$ ]]
          test "$EXPECTED_BOT_LOGIN" = "${EXPECTED_APP_SLUG}[bot]"
          IFS=$'\t' read -r actual_bot_id actual_bot_login actual_bot_type < <(
            gh api "users/$EXPECTED_BOT_LOGIN" --jq '[.id,.login,.type] | @tsv'
          )
          test "$actual_bot_id" = "$EXPECTED_BOT_ID"
          test "$actual_bot_login" = "$EXPECTED_BOT_LOGIN"
          test "$actual_bot_type" = "Bot"

      - name: Revalidate and stage the exact companion tree
        id: stage
        shell: bash
        env:
          ADAPTER_PATH: ${{ steps.companion-adapter.outputs.path }}
          BASE_DIRECTORY: ${{ github.workspace }}
          CENSUS_RESULT_PATH: ${{ runner.temp }}/dependabot-actions-companion-census.json
          COMPANION_CANDIDATE: ${{ needs.evaluate.outputs.actions_companion_candidate }}
          DEPENDABOT_COMPANION_GITHUB_TOKEN: ${{ github.token }}
          DEPENDABOT_COMPANION_STAGE_APP_TOKEN: ${{ steps.companion-stage-token.outputs.token }}
          EXPECTED_BASE_SHA: ${{ needs.evaluate.outputs.actions_companion_base_sha }}
          EXPECTED_HEAD_SHA: ${{ needs.evaluate.outputs.actions_companion_head_sha }}
          EXPECTED_PREPARE_APP_SLUG: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_APP_SLUG }}
          EXPECTED_PREPARE_BOT_ID: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_BOT_ID }}
          EXPECTED_PREPARE_BOT_LOGIN: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_BOT_LOGIN }}
          PR_NUMBER: ${{ needs.evaluate.outputs.actions_companion_pr_number }}
          PROCESSOR_RUN_ATTEMPT: ${{ github.run_attempt }}
          PROCESSOR_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          SOAK_HELPER_PATH: ${{ steps.companion-adapter.outputs.soak_path }}
          SOAK_PARTIAL_PATH: ${{ runner.temp }}/dependabot-actions-companion-soak-partial.json
          STAGE_RESULT_PATH: ${{ runner.temp }}/dependabot-actions-companion-stage.json
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$COMPANION_CANDIDATE" = "true"
          test "$REPOSITORY" = "mento-protocol/frontend-monorepo"
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_PREPARE_APP_SLUG" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          [[ "$EXPECTED_PREPARE_BOT_ID" =~ ^[1-9][0-9]*$ ]]
          test "$EXPECTED_PREPARE_BOT_LOGIN" = "${EXPECTED_PREPARE_APP_SLUG}[bot]"
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]
          [[ "$PROCESSOR_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$PROCESSOR_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          node "$ADAPTER_PATH" \
            stage \
            --base "$EXPECTED_BASE_SHA" \
            --base-dir "$BASE_DIRECTORY" \
            --census "$CENSUS_RESULT_PATH" \
            --head "$EXPECTED_HEAD_SHA" \
            --output "$STAGE_RESULT_PATH" \
            --pr "$PR_NUMBER" \
            --prepare-app-slug "$EXPECTED_PREPARE_APP_SLUG" \
            --prepare-bot-id "$EXPECTED_PREPARE_BOT_ID" \
            --prepare-bot-login "$EXPECTED_PREPARE_BOT_LOGIN" \
            --repo "$REPOSITORY" \
            --run-attempt "$PROCESSOR_RUN_ATTEMPT" \
            --run-id "$PROCESSOR_RUN_ID" \
            --workflow-sha "$WORKFLOW_SHA"
          stage_result="$(node --input-type=module --eval '
            import { Buffer } from "node:buffer";
            import { appendFileSync, readFileSync } from "node:fs";
            import { dirname, resolve } from "node:path";
            import { pathToFileURL } from "node:url";

            const helper = resolve(
              dirname(process.env.ADAPTER_PATH),
              "dependabot-actions-companion.mjs",
            );
            const { canonicalJson } = await import(pathToFileURL(helper).href);
            const bytes = readFileSync(process.env.STAGE_RESULT_PATH);
            if (bytes.byteLength > 8 * 1024 + 1) {
              throw new Error("Companion stage receipt is too large");
            }
            const raw = bytes.toString("utf8");
            const receipt = JSON.parse(raw);
            const bound =
              !Buffer.from(raw, "utf8").equals(bytes) ||
              raw !== `${canonicalJson(receipt)}\n` ||
              receipt.schema !==
                "dependabot-actions-companion-live-stage:v1" ||
              receipt.repository !== process.env.REPOSITORY ||
              receipt.sourcePullRequestNumber !== Number(process.env.PR_NUMBER) ||
              receipt.sourceHeadSha !== process.env.EXPECTED_HEAD_SHA ||
              receipt.workflowSha !== process.env.WORKFLOW_SHA ||
              receipt.orchestratorRunId !== Number(process.env.PROCESSOR_RUN_ID) ||
              receipt.orchestratorRunAttempt !==
                Number(process.env.PROCESSOR_RUN_ATTEMPT) ||
              !Number.isSafeInteger(receipt.processorRunId) ||
              receipt.processorRunId < 1 ||
              !Number.isSafeInteger(receipt.processorRunAttempt) ||
              receipt.processorRunAttempt < 1;
            const staged =
              receipt.result === "staged" &&
              receipt.parentCommitSha === process.env.EXPECTED_BASE_SHA;
            const pull = receipt.companionPullRequest;
            const terminal =
              receipt.result === "terminal" &&
              ["merged", "closed-unmerged"].includes(receipt.reason) &&
              Number.isSafeInteger(pull?.number) &&
              pull.number > 0 &&
              pull.state === receipt.reason &&
              pull.url ===
                `https://github.com/${process.env.REPOSITORY}/pull/${pull.number}` &&
              (receipt.reason === "merged"
                ? typeof pull.mergedAt === "string" &&
                  !Number.isNaN(Date.parse(pull.mergedAt))
                : pull.mergedAt === null);
            if (bound || (!staged && !terminal)) {
              throw new Error("Invalid companion stage receipt");
            }
            appendFileSync(
              process.env.GITHUB_OUTPUT,
              `stage_receipt=${
                staged ? Buffer.from(raw, "utf8").toString("base64") : ""
              }\n` + `stage_result=${receipt.result}\n`,
            );
            process.stdout.write(receipt.result);
          ')"
          if [ "$stage_result" = "staged" ]; then
            node "$SOAK_HELPER_PATH" companion-stage \
              --census "$CENSUS_RESULT_PATH" \
              --stage "$STAGE_RESULT_PATH" \
              --output "$SOAK_PARTIAL_PATH"
            node --input-type=module --eval '
              import { Buffer } from "node:buffer";
              import { appendFileSync, readFileSync } from "node:fs";
              import { dirname, resolve } from "node:path";
              import { pathToFileURL } from "node:url";

              const bytes = readFileSync(process.env.SOAK_PARTIAL_PATH);
              if (bytes.byteLength < 1 || bytes.byteLength > 16 * 1024) {
                throw new Error("Companion soak partial is too large");
              }
              const raw = bytes.toString("utf8");
              const partial = JSON.parse(raw);
              const helper = resolve(
                dirname(process.env.ADAPTER_PATH),
                "dependabot-actions-companion.mjs",
              );
              const { canonicalJson } = await import(pathToFileURL(helper).href);
              if (
                !Buffer.from(raw, "utf8").equals(bytes) ||
                raw !== `${canonicalJson(partial)}\n` ||
                partial.schema !==
                  "dependabot-actions-companion-soak-partial:v1"
              ) {
                throw new Error("Companion soak partial is invalid");
              }
              appendFileSync(
                process.env.GITHUB_OUTPUT,
                `soak_partial=${bytes.toString("base64")}\n`,
              );
            '
          fi

  actions-companion-open:
    name: Open the staged OSV companion for human review
    needs: [evaluate, actions-companion-stage]
    if: >-
      needs.evaluate.result == 'success' &&
      needs.actions-companion-stage.result == 'success' &&
      needs.actions-companion-stage.outputs.stage_result == 'staged' &&
      needs.evaluate.outputs.prepare == 'true' &&
      needs.evaluate.outputs.actions_companion_candidate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Materialize the companion adapter from the exact trusted workflow SHA
        id: companion-adapter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = "mento-protocol/frontend-monorepo"
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          trusted_root="$RUNNER_TEMP/dependabot-actions-companion"
          install -d -m 0700 "$trusted_root"
          trusted_helper="$trusted_root/dependabot-actions-companion.mjs"
          trusted_adapter="$trusted_root/dependabot-actions-companion-live.mjs"
          trusted_processor="$trusted_root/dependabot-processor.mjs"
          trusted_receipts="$trusted_root/dependabot-preparation-receipts.mjs"
          trusted_soak="$trusted_root/dependabot-production-soak.mjs"
          resolved_sha="$(gh api "repos/$REPOSITORY/commits/$WORKFLOW_SHA" --jq .sha)"
          test "$resolved_sha" = "$WORKFLOW_SHA"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPOSITORY/contents/scripts/dependabot-actions-companion.mjs?ref=$WORKFLOW_SHA" \
            > "$trusted_helper"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPOSITORY/contents/scripts/dependabot-actions-companion-live.mjs?ref=$WORKFLOW_SHA" \
            > "$trusted_adapter"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPOSITORY/contents/scripts/dependabot-processor.mjs?ref=$WORKFLOW_SHA" \
            > "$trusted_processor"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPOSITORY/contents/scripts/dependabot-preparation-receipts.mjs?ref=$WORKFLOW_SHA" \
            > "$trusted_receipts"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPOSITORY/contents/scripts/dependabot-production-soak.mjs?ref=$WORKFLOW_SHA" \
            > "$trusted_soak"
          test -s "$trusted_helper"
          test -s "$trusted_adapter"
          test -s "$trusted_processor"
          test -s "$trusted_receipts"
          test -s "$trusted_soak"
          chmod 0400 "$trusted_helper"
          chmod 0400 "$trusted_processor"
          chmod 0400 "$trusted_receipts"
          chmod 0500 "$trusted_adapter"
          chmod 0500 "$trusted_soak"
          echo "path=$trusted_adapter" >> "$GITHUB_OUTPUT"
          echo "soak_path=$trusted_soak" >> "$GITHUB_OUTPUT"

      - name: Materialize the exact historical base without workflow credentials
        id: historical-base
        shell: bash
        env:
          EXPECTED_BASE_SHA: ${{ needs.evaluate.outputs.actions_companion_base_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = "mento-protocol/frontend-monorepo"
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          object_store="$RUNNER_TEMP/dependabot-actions-companion-base.git"
          archive="$RUNNER_TEMP/dependabot-actions-companion-base.tar"
          base_directory="$RUNNER_TEMP/dependabot-actions-companion-base"
          test ! -e "$object_store"
          test ! -e "$archive"
          test ! -e "$base_directory"
          git init --bare "$object_store"
          git -C "$object_store" remote add origin \
            https://github.com/mento-protocol/frontend-monorepo.git
          git -C "$object_store" -c protocol.version=2 fetch \
            --no-tags --depth=1 origin "$EXPECTED_BASE_SHA"
          test "$(git -C "$object_store" rev-parse --verify 'FETCH_HEAD^{commit}')" = \
            "$EXPECTED_BASE_SHA"
          test "$(git -C "$object_store" cat-file -t "$EXPECTED_BASE_SHA")" = \
            commit
          git -C "$object_store" archive \
            --format=tar --output="$archive" "$EXPECTED_BASE_SHA"
          archive_bytes="$(wc -c < "$archive" | tr -d ' ')"
          [[ "$archive_bytes" =~ ^[1-9][0-9]*$ ]]
          (( archive_bytes <= 67108864 ))
          install -d -m 0700 "$base_directory"
          tar --extract --file "$archive" --directory "$base_directory" \
            --no-same-owner --no-same-permissions
          echo "path=$base_directory" >> "$GITHUB_OUTPUT"

      - name: Audit the historical base before pull-request authority
        shell: bash
        env:
          ADAPTER_PATH: ${{ steps.companion-adapter.outputs.path }}
          BASE_DIRECTORY: ${{ steps.historical-base.outputs.path }}
          BASE_RECEIPT_PATH: ${{ runner.temp }}/dependabot-actions-companion-base.json
          DEPENDABOT_COMPANION_GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_BASE_SHA: ${{ needs.evaluate.outputs.actions_companion_base_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node "$ADAPTER_PATH" \
            verify-base \
            --base "$EXPECTED_BASE_SHA" \
            --base-dir "$BASE_DIRECTORY" \
            --output "$BASE_RECEIPT_PATH" \
            --repo "$REPOSITORY"
          node --input-type=module --eval '
            import { Buffer } from "node:buffer";
            import { readFileSync } from "node:fs";
            import { dirname, resolve } from "node:path";
            import { pathToFileURL } from "node:url";

            const helper = resolve(
              dirname(process.env.ADAPTER_PATH),
              "dependabot-actions-companion.mjs",
            );
            const { canonicalJson } = await import(pathToFileURL(helper).href);
            const bytes = readFileSync(process.env.BASE_RECEIPT_PATH);
            if (bytes.byteLength > 1024 + 1) {
              throw new Error("Historical base receipt is too large");
            }
            const raw = bytes.toString("utf8");
            const receipt = JSON.parse(raw);
            if (
              !Buffer.from(raw, "utf8").equals(bytes) ||
              raw !== `${canonicalJson(receipt)}\n` ||
              receipt.schema !==
                "dependabot-actions-companion-base-verification:v1" ||
              receipt.repository !== process.env.REPOSITORY ||
              receipt.baseSha !== process.env.EXPECTED_BASE_SHA ||
              !/^[0-9a-f]{40}$/.test(receipt.treeSha ?? "") ||
              !/^[0-9a-f]{64}$/.test(receipt.entriesDigest ?? "") ||
              !Number.isSafeInteger(receipt.entryCount) ||
              receipt.entryCount < 1 ||
              !Number.isSafeInteger(receipt.byteCount) ||
              receipt.byteCount < 1
            ) {
              throw new Error("Historical base receipt is invalid");
            }
          '

      - name: Decode and validate the exact stage receipt
        shell: bash
        env:
          ADAPTER_PATH: ${{ steps.companion-adapter.outputs.path }}
          EXPECTED_BASE_SHA: ${{ needs.evaluate.outputs.actions_companion_base_sha }}
          EXPECTED_HEAD_SHA: ${{ needs.evaluate.outputs.actions_companion_head_sha }}
          PR_NUMBER: ${{ needs.evaluate.outputs.actions_companion_pr_number }}
          PROCESSOR_RUN_ATTEMPT: ${{ github.run_attempt }}
          PROCESSOR_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          SOAK_PARTIAL_BASE64: ${{ needs.actions-companion-stage.outputs.soak_partial }}
          SOAK_PARTIAL_PATH: ${{ runner.temp }}/dependabot-actions-companion-soak-partial.json
          STAGE_RECEIPT_BASE64: ${{ needs.actions-companion-stage.outputs.stage_receipt }}
          STAGE_RECEIPT_PATH: ${{ runner.temp }}/dependabot-actions-companion-stage.json
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = "mento-protocol/frontend-monorepo"
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]
          [[ "$PROCESSOR_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$PROCESSOR_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          node --input-type=module --eval '
            import { Buffer } from "node:buffer";
            import { readFileSync, writeFileSync } from "node:fs";
            import { dirname, resolve } from "node:path";
            import { pathToFileURL } from "node:url";

            const encoded = process.env.STAGE_RECEIPT_BASE64;
            if (
              !/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(
                encoded ?? "",
              )
            ) {
              throw new Error("Stage receipt base64 is invalid");
            }
            const bytes = Buffer.from(encoded, "base64");
            if (
              bytes.byteLength > 8 * 1024 + 1 ||
              bytes.toString("base64") !== encoded
            ) {
              throw new Error("Stage receipt base64 is not canonical");
            }
            writeFileSync(process.env.STAGE_RECEIPT_PATH, bytes, {
              flag: "wx",
              mode: 0o600,
            });
            const raw = readFileSync(process.env.STAGE_RECEIPT_PATH, "utf8");
            const receipt = JSON.parse(raw);
            const helper = resolve(
              dirname(process.env.ADAPTER_PATH),
              "dependabot-actions-companion.mjs",
            );
            const { canonicalJson } = await import(pathToFileURL(helper).href);
            if (
              !Buffer.from(raw, "utf8").equals(bytes) ||
              raw !== `${canonicalJson(receipt)}\n` ||
              receipt.schema !==
                "dependabot-actions-companion-live-stage:v1" ||
              receipt.result !== "staged" ||
              receipt.repository !== process.env.REPOSITORY ||
              receipt.sourcePullRequestNumber !== Number(process.env.PR_NUMBER) ||
              receipt.sourceHeadSha !== process.env.EXPECTED_HEAD_SHA ||
              receipt.workflowSha !== process.env.WORKFLOW_SHA ||
              receipt.parentCommitSha !== process.env.EXPECTED_BASE_SHA ||
              receipt.orchestratorRunId !== Number(process.env.PROCESSOR_RUN_ID) ||
              receipt.orchestratorRunAttempt !==
                Number(process.env.PROCESSOR_RUN_ATTEMPT) ||
              !Number.isSafeInteger(receipt.processorRunId) ||
              receipt.processorRunId < 1 ||
              !Number.isSafeInteger(receipt.processorRunAttempt) ||
              receipt.processorRunAttempt < 1
            ) {
              throw new Error("Invalid decoded companion stage receipt");
            }

            const partialEncoded = process.env.SOAK_PARTIAL_BASE64;
            if (
              !/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(
                partialEncoded ?? "",
              )
            ) {
              throw new Error("Companion soak partial base64 is invalid");
            }
            const partialBytes = Buffer.from(partialEncoded, "base64");
            if (
              partialBytes.byteLength < 1 ||
              partialBytes.byteLength > 16 * 1024 ||
              partialBytes.toString("base64") !== partialEncoded
            ) {
              throw new Error("Companion soak partial base64 is not canonical");
            }
            writeFileSync(process.env.SOAK_PARTIAL_PATH, partialBytes, {
              flag: "wx",
              mode: 0o600,
            });
            const partialRaw = readFileSync(
              process.env.SOAK_PARTIAL_PATH,
              "utf8",
            );
            const partial = JSON.parse(partialRaw);
            if (
              !Buffer.from(partialRaw, "utf8").equals(partialBytes) ||
              partialRaw !== `${canonicalJson(partial)}\n` ||
              partial.schema !==
                "dependabot-actions-companion-soak-partial:v1"
            ) {
              throw new Error("Decoded companion soak partial is invalid");
            }
          '

      - name: Create an isolated pull-request App token
        id: companion-open-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_PROCESSOR_PREPARE_APP_PRIVATE_KEY }}
          owner: mento-protocol
          repositories: frontend-monorepo
          permission-pull-requests: write

      - name: Bind the pull-request token to the exact Prepare App bot
        shell: bash
        env:
          ACTUAL_APP_SLUG: ${{ steps.companion-open-token.outputs.app-slug }}
          ACTUAL_INSTALLATION_ID: ${{ steps.companion-open-token.outputs.installation-id }}
          EXPECTED_APP_CLIENT_ID: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_APP_CLIENT_ID }}
          EXPECTED_APP_SLUG: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_APP_SLUG }}
          EXPECTED_BOT_ID: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_BOT_ID }}
          EXPECTED_BOT_LOGIN: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_BOT_LOGIN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_APP_CLIENT_ID" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "$EXPECTED_APP_SLUG" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          [[ "$EXPECTED_BOT_ID" =~ ^[1-9][0-9]*$ ]]
          test "$ACTUAL_APP_SLUG" = "$EXPECTED_APP_SLUG"
          [[ "$ACTUAL_INSTALLATION_ID" =~ ^[1-9][0-9]*$ ]]
          test "$EXPECTED_BOT_LOGIN" = "${EXPECTED_APP_SLUG}[bot]"
          IFS=$'\t' read -r actual_bot_id actual_bot_login actual_bot_type < <(
            gh api "users/$EXPECTED_BOT_LOGIN" --jq '[.id,.login,.type] | @tsv'
          )
          test "$actual_bot_id" = "$EXPECTED_BOT_ID"
          test "$actual_bot_login" = "$EXPECTED_BOT_LOGIN"
          test "$actual_bot_type" = "Bot"

      - name: Revalidate the staged head and open its companion pull request
        id: open
        shell: bash
        env:
          ADAPTER_PATH: ${{ steps.companion-adapter.outputs.path }}
          BASE_DIRECTORY: ${{ steps.historical-base.outputs.path }}
          DEPENDABOT_COMPANION_GITHUB_TOKEN: ${{ github.token }}
          DEPENDABOT_COMPANION_OPEN_APP_TOKEN: ${{ steps.companion-open-token.outputs.token }}
          EXPECTED_HEAD_SHA: ${{ needs.evaluate.outputs.actions_companion_head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.evaluate.outputs.actions_companion_base_sha }}
          EXPECTED_PREPARE_APP_SLUG: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_APP_SLUG }}
          EXPECTED_PREPARE_BOT_ID: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_BOT_ID }}
          EXPECTED_PREPARE_BOT_LOGIN: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_BOT_LOGIN }}
          OPEN_RESULT_PATH: ${{ runner.temp }}/dependabot-actions-companion-open.json
          PR_NUMBER: ${{ needs.evaluate.outputs.actions_companion_pr_number }}
          PROCESSOR_RUN_ATTEMPT: ${{ github.run_attempt }}
          PROCESSOR_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          STAGE_RECEIPT_PATH: ${{ runner.temp }}/dependabot-actions-companion-stage.json
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = "mento-protocol/frontend-monorepo"
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_PREPARE_APP_SLUG" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          [[ "$EXPECTED_PREPARE_BOT_ID" =~ ^[1-9][0-9]*$ ]]
          test "$EXPECTED_PREPARE_BOT_LOGIN" = "${EXPECTED_PREPARE_APP_SLUG}[bot]"
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]
          [[ "$PROCESSOR_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$PROCESSOR_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          node "$ADAPTER_PATH" \
            open \
            --base "$EXPECTED_BASE_SHA" \
            --base-dir "$BASE_DIRECTORY" \
            --head "$EXPECTED_HEAD_SHA" \
            --output "$OPEN_RESULT_PATH" \
            --pr "$PR_NUMBER" \
            --prepare-app-slug "$EXPECTED_PREPARE_APP_SLUG" \
            --prepare-bot-id "$EXPECTED_PREPARE_BOT_ID" \
            --prepare-bot-login "$EXPECTED_PREPARE_BOT_LOGIN" \
            --repo "$REPOSITORY" \
            --run-attempt "$PROCESSOR_RUN_ATTEMPT" \
            --run-id "$PROCESSOR_RUN_ID" \
            --staged "$STAGE_RECEIPT_PATH" \
            --workflow-sha "$WORKFLOW_SHA"
          node --input-type=module --eval '
            import { Buffer } from "node:buffer";
            import { appendFileSync, readFileSync } from "node:fs";
            import { dirname, resolve } from "node:path";
            import { pathToFileURL } from "node:url";

            const bytes = readFileSync(process.env.OPEN_RESULT_PATH);
            if (bytes.byteLength > 8 * 1024 + 1) {
              throw new Error("Companion open receipt is too large");
            }
            const raw = bytes.toString("utf8");
            const receipt = JSON.parse(raw);
            const helper = resolve(
              dirname(process.env.ADAPTER_PATH),
              "dependabot-actions-companion.mjs",
            );
            const { canonicalJson } = await import(pathToFileURL(helper).href);
            const pull = receipt?.companionPullRequest;
            const bound =
              !Buffer.from(raw, "utf8").equals(bytes) ||
              raw !== `${canonicalJson(receipt)}\n` ||
              receipt.schema !== "dependabot-actions-companion-live-open:v1" ||
              receipt.repository !== process.env.REPOSITORY ||
              receipt.sourcePullRequestNumber !== Number(process.env.PR_NUMBER) ||
              receipt.sourceHeadSha !== process.env.EXPECTED_HEAD_SHA ||
              receipt.workflowSha !== process.env.WORKFLOW_SHA ||
              receipt.orchestratorRunId !== Number(process.env.PROCESSOR_RUN_ID) ||
              receipt.orchestratorRunAttempt !==
                Number(process.env.PROCESSOR_RUN_ATTEMPT) ||
              !Number.isSafeInteger(receipt.processorRunId) ||
              receipt.processorRunId < 1 ||
              !Number.isSafeInteger(receipt.processorRunAttempt) ||
              receipt.processorRunAttempt < 1;
            const opened =
              ["opened", "already-open"].includes(receipt.result) &&
              Number.isSafeInteger(pull?.number) &&
              pull.number > 0 &&
              pull.state === "open" &&
              pull.url ===
                `https://github.com/${process.env.REPOSITORY}/pull/${pull.number}`;
            const terminal =
              receipt.result === "terminal" &&
              ["merged", "closed-unmerged"].includes(receipt.reason) &&
              Number.isSafeInteger(pull?.number) &&
              pull.number > 0 &&
              pull.state === receipt.reason &&
              pull.url ===
                `https://github.com/${process.env.REPOSITORY}/pull/${pull.number}`;
            if (bound || (!opened && !terminal)) {
              throw new Error("Invalid opened companion receipt");
            }
            appendFileSync(
              process.env.GITHUB_OUTPUT,
              `companion_pr_number=${opened ? pull.number : ""}\n` +
                `open_result=${receipt.result}\n`,
            );
          '

      - name: Confirm the exact App-authored companion pull request
        if: >-
          steps.open.outputs.open_result == 'opened' ||
          steps.open.outputs.open_result == 'already-open'
        shell: bash
        env:
          EXPECTED_BOT_ID: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_BOT_ID }}
          EXPECTED_BOT_LOGIN: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_BOT_LOGIN }}
          GH_TOKEN: ${{ github.token }}
          OPENED_PR_NUMBER: ${{ steps.open.outputs.companion_pr_number }}
          OPEN_RESULT_PATH: ${{ runner.temp }}/dependabot-actions-companion-open.json
          PR_SNAPSHOT_PATH: ${{ runner.temp }}/dependabot-actions-companion-pull.json
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_BOT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$OPENED_PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]
          gh api "repos/$REPOSITORY/pulls/$OPENED_PR_NUMBER" \
            > "$PR_SNAPSHOT_PATH"
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";

            const receipt = JSON.parse(
              readFileSync(process.env.OPEN_RESULT_PATH, "utf8"),
            );
            const pull = JSON.parse(
              readFileSync(process.env.PR_SNAPSHOT_PATH, "utf8"),
            );
            const expected = receipt.companionPullRequest;
            if (
              pull?.number !== Number(process.env.OPENED_PR_NUMBER) ||
              pull.number !== expected.number ||
              pull.state !== "open" ||
              pull.draft !== false ||
              pull.user?.id !== Number(process.env.EXPECTED_BOT_ID) ||
              pull.user?.login !== process.env.EXPECTED_BOT_LOGIN ||
              pull.user?.type !== "Bot" ||
              pull.head?.ref !== receipt.branchRef ||
              pull.head?.sha !== receipt.commitSha ||
              pull.head?.repo?.full_name !== process.env.REPOSITORY ||
              pull.base?.ref !== "main" ||
              pull.base?.sha !== expected.baseSha ||
              pull.base?.repo?.full_name !== process.env.REPOSITORY ||
              pull.maintainer_can_modify !== false ||
              pull.merged_at !== null ||
              pull.auto_merge !== null ||
              pull.html_url !== expected.url
            ) {
              throw new Error("Opened companion pull request binding changed");
            }
          '

      - name: Build the redacted companion soak evidence
        if: >-
          steps.open.outputs.open_result == 'opened' ||
          steps.open.outputs.open_result == 'already-open'
        shell: bash
        env:
          ADAPTER_PATH: ${{ steps.companion-adapter.outputs.path }}
          OPEN_RESULT_PATH: ${{ runner.temp }}/dependabot-actions-companion-open.json
          PR_SNAPSHOT_PATH: ${{ runner.temp }}/dependabot-actions-companion-pull.json
          SOAK_EVIDENCE_PATH: ${{ runner.temp }}/dependabot-actions-companion-soak.json
          SOAK_HELPER_PATH: ${{ steps.companion-adapter.outputs.soak_path }}
          SOAK_PARTIAL_PATH: ${{ runner.temp }}/dependabot-actions-companion-soak-partial.json
        run: |
          set -euo pipefail
          node "$SOAK_HELPER_PATH" companion-open \
            --partial "$SOAK_PARTIAL_PATH" \
            --open "$OPEN_RESULT_PATH" \
            --pull "$PR_SNAPSHOT_PATH" \
            --output "$SOAK_EVIDENCE_PATH"
          node --input-type=module --eval '
            import { Buffer } from "node:buffer";
            import { readFileSync } from "node:fs";
            import { dirname, resolve } from "node:path";
            import { pathToFileURL } from "node:url";

            const bytes = readFileSync(process.env.SOAK_EVIDENCE_PATH);
            if (bytes.byteLength < 1 || bytes.byteLength > 16 * 1024) {
              throw new Error("Companion soak evidence is too large");
            }
            const raw = bytes.toString("utf8");
            const evidence = JSON.parse(raw);
            const helper = resolve(
              dirname(process.env.ADAPTER_PATH),
              "dependabot-actions-companion.mjs",
            );
            const { canonicalJson } = await import(pathToFileURL(helper).href);
            if (
              !Buffer.from(raw, "utf8").equals(bytes) ||
              raw !== `${canonicalJson(evidence)}\n` ||
              evidence.schema !== "dependabot-actions-companion-soak:v1"
            ) {
              throw new Error("Companion soak evidence is invalid");
            }
          '

      - name: Upload the redacted companion soak evidence
        if: >-
          steps.open.outputs.open_result == 'opened' ||
          steps.open.outputs.open_result == 'already-open'
        id: upload-soak-evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependabot-actions-companion-soak-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.evaluate.outputs.actions_companion_pr_number }}
          path: ${{ runner.temp }}/dependabot-actions-companion-soak.json
          if-no-files-found: error
          retention-days: 90

      - name: Summarize the redacted companion soak evidence
        if: steps.upload-soak-evidence.outcome == 'success'
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ steps.upload-soak-evidence.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.upload-soak-evidence.outputs.artifact-id }}
          ARTIFACT_NAME: dependabot-actions-companion-soak-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.evaluate.outputs.actions_companion_pr_number }}
          ARTIFACT_URL: ${{ steps.upload-soak-evidence.outputs.artifact-url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          test -n "$ARTIFACT_URL"
          test -n "$ARTIFACT_DIGEST"
          {
            echo "### Dependabot typed companion soak evidence"
            echo
            echo "- Artifact: [$ARTIFACT_NAME]($ARTIFACT_URL)"
            echo "- Artifact ID: \`$ARTIFACT_ID\`"
            echo "- Artifact digest: \`$ARTIFACT_DIGEST\`"
            echo
            echo '```bash'
            echo "gh run download $RUN_ID \\"
            echo "  --repo $REPOSITORY \\"
            echo "  --name $ARTIFACT_NAME \\"
            echo "  --dir /tmp/dependabot-actions-companion-soak"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  retry-claude-review:
    name: Retry one authenticated transient Claude provider failure
    needs: evaluate
    if: >-
      needs.evaluate.result == 'success' &&
      needs.evaluate.outputs.claude_retry_candidate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
      pull-requests: read
    steps:
      # This job can rerun only the exact failed trusted workflow. It has no
      # checkout, candidate execution, repository mutation, check write, App
      # credential, or Claude credential.
      - name: Revalidate the exact transient receipt and rerun its workflow
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ needs.evaluate.outputs.expected_head_sha }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.evaluate.outputs.claude_run_attempt }}
          EXPECTED_RUN_ID: ${{ needs.evaluate.outputs.claude_run_id }}
          EXPECTED_RUN_TITLE: ${{ needs.evaluate.outputs.claude_run_title }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.evaluate.outputs.pr_numbers }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = "mento-protocol/frontend-monorepo"
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]
          [[ "$EXPECTED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_RUN_ATTEMPT" =~ ^[12]$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]

          pr_snapshot="$RUNNER_TEMP/dependabot-claude-retry-pr.json"
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" \
            --jq '{number,state,draft,user:{login:.user.login,type:.user.type},head:{sha:.head.sha,repo:{full_name:.head.repo.full_name}},base:{ref:.base.ref,repo:{full_name:.base.repo.full_name}}}' \
            > "$pr_snapshot"
          jq -e \
            --arg headSha "$EXPECTED_HEAD_SHA" \
            --arg repository "$REPOSITORY" \
            --argjson prNumber "$PR_NUMBER" \
            '
              .number == $prNumber and
              .state == "open" and
              .draft == false and
              .user.login == "dependabot[bot]" and
              .user.type == "Bot" and
              .head.sha == $headSha and
              .head.repo.full_name == $repository and
              .base.ref == "main" and
              .base.repo.full_name == $repository
            ' "$pr_snapshot" > /dev/null

          run_snapshot="$RUNNER_TEMP/dependabot-claude-retry-run.json"
          gh api "repos/$REPOSITORY/actions/runs/$EXPECTED_RUN_ID" \
            --jq '{id,run_attempt,status,conclusion,event,path,head_branch,head_sha,display_title,repository:{full_name:.repository.full_name}}' \
            > "$run_snapshot"
          jq -e \
            --arg displayTitle "$EXPECTED_RUN_TITLE" \
            --arg repository "$REPOSITORY" \
            --arg workflowSha "$WORKFLOW_SHA" \
            --argjson runAttempt "$EXPECTED_RUN_ATTEMPT" \
            --argjson runId "$EXPECTED_RUN_ID" \
            '
              .id == $runId and
              .run_attempt == $runAttempt and
              .status == "completed" and
              .conclusion == "failure" and
              .event == "workflow_run" and
              (.path == ".github/workflows/dependabot-claude-review.yml" or
               .path == ".github/workflows/dependabot-claude-review.yml@main") and
              .head_branch == "main" and
              .head_sha == $workflowSha and
              .repository.full_name == $repository and
              .display_title == $displayTitle
            ' "$run_snapshot" > /dev/null

          collect_check_runs() {
            local destination="$1"
            local collected=0
            local expected_total=""
            local page=1
            printf '[]\n' > "$destination"

            while (( page <= 20 )); do
              local page_snapshot="${destination%.json}-page-$page.json"
              gh api --method GET \
                "repos/$REPOSITORY/commits/$EXPECTED_HEAD_SHA/check-runs" \
                -f check_name=claude-review \
                -f filter=all \
                -F per_page=100 \
                -F page="$page" \
                --jq '{total_count,check_runs}' > "$page_snapshot"
              jq -e '
                type == "object" and
                (.total_count | type == "number" and floor == . and . >= 0 and . <= 2000) and
                (.check_runs | type == "array" and length <= 100) and
                all(.check_runs[];
                  type == "object" and
                  (.id | type == "number" and floor == . and . >= 1 and . <= 9007199254740991)
                )
              ' "$page_snapshot" > /dev/null

              local page_total
              local page_count
              page_total="$(jq -r '.total_count' "$page_snapshot")"
              page_count="$(jq -r '.check_runs | length' "$page_snapshot")"
              if test -z "$expected_total"; then
                expected_total="$page_total"
              else
                test "$page_total" -eq "$expected_total"
              fi
              test $(( collected + page_count )) -le "$expected_total"

              local merged_snapshot="${destination%.json}-merged.json"
              jq -s '.[0] + .[1].check_runs' \
                "$destination" "$page_snapshot" > "$merged_snapshot"
              mv "$merged_snapshot" "$destination"
              collected=$(( collected + page_count ))
              if test "$collected" -eq "$expected_total"; then
                break
              fi
              test "$page_count" -eq 100
              test "$page" -lt 20
              page=$(( page + 1 ))
            done

            test -n "$expected_total"
            test "$collected" -eq "$expected_total"
            test "$(jq '[.[].id] | unique | length' "$destination")" -eq "$collected"
          }

          all_checks_snapshot="$RUNNER_TEMP/dependabot-claude-retry-checks.json"
          collect_check_runs "$all_checks_snapshot"

          expected_external_id="dependabot-claude-review:v1:pr=$PR_NUMBER:sha=$EXPECTED_HEAD_SHA:run=$EXPECTED_RUN_ID:attempt=$EXPECTED_RUN_ATTEMPT"
          check_snapshot="$RUNNER_TEMP/dependabot-claude-retry-check.json"
          jq \
            --arg externalId "$expected_external_id" \
            --arg headSha "$EXPECTED_HEAD_SHA" \
            --arg repository "$REPOSITORY" \
            --argjson runId "$EXPECTED_RUN_ID" \
            '[.[] | select(
              .app.id == 15368 and
              .name == "claude-review" and
              .head_sha == $headSha and
              .status == "completed" and
              .conclusion == "failure" and
              .external_id == $externalId and
              (.details_url == "https://github.com/" + $repository + "/actions/runs/" + ($runId | tostring) or
               .details_url == "https://github.com/" + $repository + "/runs/" + (.id | tostring))
            )]' "$all_checks_snapshot" > "$check_snapshot"
          test "$(jq 'length' "$check_snapshot")" = "1"
          canonical_checks="$RUNNER_TEMP/dependabot-claude-retry-canonical-checks.tsv"
          jq -r \
            --arg headSha "$EXPECTED_HEAD_SHA" \
            --arg repository "$REPOSITORY" \
            --argjson prNumber "$PR_NUMBER" \
            '
              .[] |
              select(
                .app.id == 15368 and
                .name == "claude-review" and
                .head_sha == $headSha and
                .status == "completed" and
                (.conclusion == "success" or .conclusion == "failure")
              ) |
              (.external_id |
                try capture("^dependabot-claude-review:v1:pr=(?<pr>[1-9][0-9]{0,9}):sha=(?<sha>[0-9a-f]{40}):run=(?<run>[1-9][0-9]*):attempt=(?<attempt>[1-9][0-9]*)$")
                catch null) as $receipt |
              select(
                $receipt != null and
                $receipt.pr == ($prNumber | tostring) and
                $receipt.sha == $headSha
              ) |
              ($receipt.run | tonumber) as $runId |
              ($receipt.attempt | tonumber) as $runAttempt |
              select(
                $runId >= 1 and $runId <= 9007199254740991 and ($runId | floor) == $runId and
                $runAttempt >= 1 and $runAttempt <= 9007199254740991 and ($runAttempt | floor) == $runAttempt and
                (.details_url == "https://github.com/" + $repository + "/actions/runs/" + ($runId | tostring) or
                 .details_url == "https://github.com/" + $repository + "/runs/" + (.id | tostring))
              ) |
              [.id, $runId, $runAttempt, .conclusion, .external_id] |
              @tsv
            ' "$all_checks_snapshot" > "$canonical_checks"

          trusted_checks="$RUNNER_TEMP/dependabot-claude-retry-trusted-checks.json"
          printf '[]\n' > "$trusted_checks"
          while IFS=$'\t' read -r check_id run_id run_attempt conclusion external_id; do
            test -n "$check_id" || continue
            trusted_run_snapshot="$RUNNER_TEMP/dependabot-claude-retry-run-$run_id-$run_attempt.json"
            gh api \
              "repos/$REPOSITORY/actions/runs/$run_id/attempts/$run_attempt" \
              --jq '{id,run_attempt,status,conclusion,event,path,head_branch,head_sha,display_title,repository:{full_name:.repository.full_name}}' \
              > "$trusted_run_snapshot"
            if ! jq -e \
              --arg checkConclusion "$conclusion" \
              --arg headSha "$EXPECTED_HEAD_SHA" \
              --arg repository "$REPOSITORY" \
              --arg workflowSha "$WORKFLOW_SHA" \
              --argjson prNumber "$PR_NUMBER" \
              --argjson runAttempt "$run_attempt" \
              --argjson runId "$run_id" \
              '
                .id == $runId and
                .run_attempt == $runAttempt and
                .status == "completed" and
                .conclusion == $checkConclusion and
                .event == "workflow_run" and
                (.path == ".github/workflows/dependabot-claude-review.yml" or
                 .path == ".github/workflows/dependabot-claude-review.yml@main") and
                .head_branch == "main" and
                .head_sha == $workflowSha and
                .repository.full_name == $repository and
                (
                  (.display_title |
                    (capture("^dependabot-claude-review:v1 \\| source=dependabot-intake:v1 \\| repository=(?<repository>[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+) \\| pr=(?<pr>[1-9][0-9]{0,9}) \\| sha=(?<sha>[0-9a-f]{40}) \\| action=(?<action>opened|synchronize|reopened) \\| receipt=true$") // null)) as $native |
                  (.display_title |
                    (capture("^dependabot-claude-review:v1 \\| source=dependabot-prepared-head:v1\\|p=(?<pr>[1-9][0-9]{0,9})\\|h=(?<sha>[0-9a-f]{40})\\|o=(?<operation>[rp])\\|c=(?<count>[1-9][0-9]*)\\|d=(?<digest>[0-9a-f]{64})\\|ok=true$") // null)) as $prepared |
                  ($native != null and
                   $native.repository == $repository and
                   $native.pr == ($prNumber | tostring) and
                   $native.sha == $headSha) or
                  ($prepared != null and
                   $prepared.pr == ($prNumber | tostring) and
                   $prepared.sha == $headSha)
                )
              ' "$trusted_run_snapshot" > /dev/null; then
              continue
            fi

            next_trusted_checks="$RUNNER_TEMP/dependabot-claude-retry-trusted-next.json"
            jq \
              --arg conclusion "$conclusion" \
              --arg externalId "$external_id" \
              --argjson checkId "$check_id" \
              --argjson runAttempt "$run_attempt" \
              --argjson runId "$run_id" \
              '. + [{checkId:$checkId,conclusion:$conclusion,externalId:$externalId,runAttempt:$runAttempt,runId:$runId}]' \
              "$trusted_checks" > "$next_trusted_checks"
            mv "$next_trusted_checks" "$trusted_checks"
          done < "$canonical_checks"

          candidate_check_id="$(jq -r '.[0].id' "$check_snapshot")"
          test "$(jq \
            --arg externalId "$expected_external_id" \
            --argjson checkId "$candidate_check_id" \
            '[.[] | select(.checkId == $checkId and .externalId == $externalId)] | length' \
            "$trusted_checks")" -eq 1
          newest_trusted_check_id="$(jq -r 'max_by(.checkId).checkId // empty' "$trusted_checks")"
          test -n "$newest_trusted_check_id"
          if test "$candidate_check_id" -ne "$newest_trusted_check_id"; then
            echo "Skipping stale Claude retry because a newer trusted exact-head review result exists."
            exit 0
          fi

          classification="$(jq -er \
            --arg headSha "$EXPECTED_HEAD_SHA" \
            --arg repository "$REPOSITORY" \
            --argjson prNumber "$PR_NUMBER" \
            --argjson runAttempt "$EXPECTED_RUN_ATTEMPT" \
            --argjson runId "$EXPECTED_RUN_ID" \
            '
              .[0].output.text |
              fromjson |
              if .schema == "dependabot-claude-review-failure:v1" then
                if
                  type == "object" and
                  (keys | sort) == [
                    "apiStatus",
                    "failureKind",
                    "headSha",
                    "pullRequestNumber",
                    "repository",
                    "retryable",
                    "runAttempt",
                    "runId",
                    "schema"
                  ] and
                  .repository == $repository and
                  .pullRequestNumber == $prNumber and
                  .headSha == $headSha and
                  .runId == $runId and
                  .runAttempt == $runAttempt and
                  (.retryable | type) == "boolean" and
                  (
                    .apiStatus == null or
                    ((.apiStatus | type) == "number" and
                     (.apiStatus | floor) == .apiStatus and
                     .apiStatus >= 100 and .apiStatus <= 599)
                  )
                then
                  if
                    .failureKind == "provider-transient" and
                    .retryable == true and
                    (.apiStatus == 429 or
                     .apiStatus == 500 or
                     .apiStatus == 502 or
                     .apiStatus == 503 or
                     .apiStatus == 504 or
                     .apiStatus == 529)
                  then "retry"
                  elif
                    (.failureKind == "provider-terminal" or
                     .failureKind == "review-completed" or
                     .failureKind == "review-failed" or
                     .failureKind == "review-unavailable") and
                    .retryable == false
                  then "no-retry"
                  else error("invalid Claude failure classification")
                  end
                else error("invalid Claude failure receipt")
                end
              elif .schema == "dependabot-claude-review-result:v1" then
                if
                  type == "object" and
                  (keys | sort) == [
                    "findings",
                    "headSha",
                    "pullRequestNumber",
                    "repository",
                    "reviewCompleted",
                    "schema",
                    "verdict"
                  ] and
                  .repository == $repository and
                  .pullRequestNumber == $prNumber and
                  .headSha == $headSha and
                  .reviewCompleted == true and
                  .verdict == "findings" and
                  (.findings | type) == "array" and
                  (.findings | length) >= 1 and
                  (.findings | length) <= 20 and
                  all(.findings[];
                    type == "object" and
                    (keys | sort) == ["line", "path", "summary", "title"] and
                    (.title | type) == "string" and
                    (.title | length) >= 1 and (.title | length) <= 160 and
                    (.path | type) == "string" and
                    (.path | length) >= 1 and (.path | length) <= 300 and
                    (.line | type) == "number" and
                    (.line | floor) == .line and .line >= 1 and
                    (.summary | type) == "string" and
                    (.summary | length) >= 1 and (.summary | length) <= 1000)
                then "no-retry"
                else error("invalid Claude findings result")
                end
              else error("unsupported Claude check schema")
              end
            ' "$check_snapshot")"

          if test "$classification" = "no-retry"; then
            echo "Skipping Claude retry because the newest trusted result is deterministic or non-retryable."
            exit 0
          fi
          test "$classification" = "retry"

          gh api --method POST \
            "repos/$REPOSITORY/actions/runs/$EXPECTED_RUN_ID/rerun"

  process:
    name: Revalidate exact heads without branch-write authority
    needs: evaluate
    if: >-
      needs.evaluate.result == 'success' &&
      needs.evaluate.outputs.prepare != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: write
      contents: read
      issues: read
      pull-requests: write
      statuses: read
    steps:
      # This privileged job deliberately avoids checkout, artifacts, caches,
      # package installation, and every candidate-controlled ref.
      - name: Materialize the processor from the exact trusted workflow SHA
        id: processor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          trusted_root="$RUNNER_TEMP/dependabot-processor"
          install -d -m 0700 "$trusted_root"
          trusted_processor="$trusted_root/dependabot-processor.mjs"
          trusted_receipts="$trusted_root/dependabot-preparation-receipts.mjs"
          resolved_sha="$(gh api "repos/$REPOSITORY/commits/$WORKFLOW_SHA" --jq .sha)"
          test "$resolved_sha" = "$WORKFLOW_SHA"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPOSITORY/contents/scripts/dependabot-processor.mjs?ref=$WORKFLOW_SHA" \
            > "$trusted_processor"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPOSITORY/contents/scripts/dependabot-preparation-receipts.mjs?ref=$WORKFLOW_SHA" \
            > "$trusted_receipts"
          test -s "$trusted_processor"
          test -s "$trusted_receipts"
          chmod 0500 "$trusted_processor"
          chmod 0400 "$trusted_receipts"
          echo "path=$trusted_processor" >> "$GITHUB_OUTPUT"

      - name: Re-query exact heads and process the current sweep
        shell: bash
        env:
          DEPENDABOT_PROCESSOR_GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ needs.evaluate.outputs.expected_head_sha }}
          PROCESSOR_MODE: ${{ needs.evaluate.outputs.processor_mode }}
          PROCESSOR_PATH: ${{ steps.processor.outputs.path }}
          PR_NUMBERS: ${{ needs.evaluate.outputs.pr_numbers }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          arguments=(
            process
            --live
            --publish-checks
            --phase finalize
            --repo "$REPOSITORY"
            --pr-numbers "$PR_NUMBERS"
            --mode "$PROCESSOR_MODE"
          )
          if test -n "$EXPECTED_HEAD_SHA"; then
            arguments+=(--expected-head-sha "$EXPECTED_HEAD_SHA")
          fi
          node "$PROCESSOR_PATH" "${arguments[@]}"

  prepare-request:
    name: Publish a bounded refresh request without branch authority
    needs: evaluate
    if: >-
      needs.evaluate.result == 'success' &&
      needs.evaluate.outputs.prepare == 'true' &&
      (
        needs.evaluate.outputs.refresh_required == 'true' ||
        needs.evaluate.outputs.refresh_pending == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: write
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    outputs:
      refresh_pending: ${{ steps.plan.outputs.refresh_pending }}
      refresh_requested: ${{ steps.plan.outputs.refresh_requested }}
    steps:
      # This job can publish only a typed Refresh request. It receives the
      # public Prepare actor identity, but no client ID, secret, token, or
      # branch-update capability.
      - name: Materialize the processor from the exact trusted workflow SHA
        id: processor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          trusted_root="$RUNNER_TEMP/dependabot-processor"
          install -d -m 0700 "$trusted_root"
          trusted_processor="$trusted_root/dependabot-processor.mjs"
          trusted_receipts="$trusted_root/dependabot-preparation-receipts.mjs"
          resolved_sha="$(gh api "repos/$REPOSITORY/commits/$WORKFLOW_SHA" --jq .sha)"
          test "$resolved_sha" = "$WORKFLOW_SHA"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPOSITORY/contents/scripts/dependabot-processor.mjs?ref=$WORKFLOW_SHA" \
            > "$trusted_processor"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPOSITORY/contents/scripts/dependabot-preparation-receipts.mjs?ref=$WORKFLOW_SHA" \
            > "$trusted_receipts"
          test -s "$trusted_processor"
          test -s "$trusted_receipts"
          chmod 0500 "$trusted_processor"
          chmod 0400 "$trusted_receipts"
          echo "path=$trusted_processor" >> "$GITHUB_OUTPUT"

      - name: Publish only an exact-head refresh request when required
        id: request
        shell: bash
        env:
          DEPENDABOT_PROCESSOR_GITHUB_TOKEN: ${{ github.token }}
          DEPENDABOT_PROCESSOR_PREPARE_APP_SLUG: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_APP_SLUG }}
          DEPENDABOT_PROCESSOR_PREPARE_BOT_ID: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_BOT_ID }}
          DEPENDABOT_PROCESSOR_PREPARE_BOT_LOGIN: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_BOT_LOGIN }}
          EXPECTED_HEAD_SHA: ${{ needs.evaluate.outputs.expected_head_sha }}
          PROCESSOR_PATH: ${{ steps.processor.outputs.path }}
          PR_NUMBERS: ${{ needs.evaluate.outputs.pr_numbers }}
          REPOSITORY: ${{ github.repository }}
          REQUEST_RESULT_PATH: ${{ runner.temp }}/dependabot-request-result.json
        run: |
          set -euo pipefail
          arguments=(
            process
            --live
            --publish-checks
            --phase request
            --repo "$REPOSITORY"
            --pr-numbers "$PR_NUMBERS"
            --mode prepare
          )
          if test -n "$EXPECTED_HEAD_SHA"; then
            arguments+=(--expected-head-sha "$EXPECTED_HEAD_SHA")
          fi
          node "$PROCESSOR_PATH" "${arguments[@]}" > "$REQUEST_RESULT_PATH"

      - name: Classify the authenticated request-phase result
        id: plan
        shell: bash
        env:
          REQUEST_RESULT_PATH: ${{ runner.temp }}/dependabot-request-result.json
        run: |
          set -euo pipefail
          node --input-type=module --eval '
            import { appendFileSync, readFileSync } from "node:fs";

            const result = JSON.parse(
              readFileSync(process.env.REQUEST_RESULT_PATH, "utf8"),
            );
            if (
              result?.schema !== "dependabot-processor:v2" ||
              result?.mode !== "prepare" ||
              result?.phase !== "request" ||
              !Array.isArray(result.mutations) ||
              result.mutations.length > 1 ||
              result.mutations.some(
                (mutation) => mutation?.kind !== "refresh-requested",
              )
            ) {
              throw new Error("Invalid Dependabot request-phase result");
            }
            const refreshRequested = result.mutations.length === 1;
            const refreshPending =
              result.prepareCandidate?.disposition === "refresh-pending";
            if (refreshRequested && refreshPending) {
              throw new Error("Refresh cannot be requested and pending together");
            }
            appendFileSync(
              process.env.GITHUB_OUTPUT,
              `refresh_pending=${refreshPending}\n` +
                `refresh_requested=${refreshRequested}\n`,
            );
          '

  prepare-mutate:
    name: Apply the isolated refresh mutation path
    needs: [evaluate, prepare-request]
    if: >-
      needs.evaluate.result == 'success' &&
      needs.evaluate.outputs.prepare == 'true' &&
      needs.prepare-request.result == 'success' &&
      needs.prepare-request.outputs.refresh_pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    steps:
      # Only this job receives the short-lived refresh token. Its trusted code
      # path contains no processor approval, ALL CLEAR, merge, or native
      # auto-merge operation, and the token is revoked before finalization.
      - name: Require exact Prepare App identity and credentials
        shell: bash
        env:
          PREPARE_APP_CLIENT_ID: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_APP_CLIENT_ID }}
          PREPARE_APP_SLUG: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_APP_SLUG }}
          PREPARE_APP_PRIVATE_KEY: ${{ secrets.DEPENDABOT_PROCESSOR_PREPARE_APP_PRIVATE_KEY }}
          PREPARE_BOT_ID: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_BOT_ID }}
          PREPARE_BOT_LOGIN: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_BOT_LOGIN }}
        run: |
          set -euo pipefail
          [[ "$PREPARE_APP_CLIENT_ID" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "$PREPARE_APP_SLUG" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          [[ "$PREPARE_BOT_ID" =~ ^[1-9][0-9]*$ ]]
          test "$PREPARE_BOT_LOGIN" = "${PREPARE_APP_SLUG}[bot]"
          test -n "$PREPARE_APP_PRIVATE_KEY"

      - name: Create repository-scoped Prepare App token
        id: prepare-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_PROCESSOR_PREPARE_APP_PRIVATE_KEY }}
          owner: mento-protocol
          repositories: frontend-monorepo
          permission-contents: write
          permission-pull-requests: write

      - name: Bind the token to the exact Prepare App bot identity
        shell: bash
        env:
          ACTUAL_APP_SLUG: ${{ steps.prepare-token.outputs.app-slug }}
          ACTUAL_INSTALLATION_ID: ${{ steps.prepare-token.outputs.installation-id }}
          EXPECTED_APP_SLUG: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_APP_SLUG }}
          EXPECTED_BOT_ID: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_BOT_ID }}
          EXPECTED_BOT_LOGIN: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_BOT_LOGIN }}
          GH_TOKEN: ${{ steps.prepare-token.outputs.token }}
        run: |
          set -euo pipefail
          test "$ACTUAL_APP_SLUG" = "$EXPECTED_APP_SLUG"
          [[ "$ACTUAL_INSTALLATION_ID" =~ ^[1-9][0-9]*$ ]]
          test "$EXPECTED_BOT_LOGIN" = "${EXPECTED_APP_SLUG}[bot]"
          IFS=$'\t' read -r actual_bot_id actual_bot_login actual_bot_type < <(
            gh api "users/$EXPECTED_BOT_LOGIN" --jq '[.id,.login,.type] | @tsv'
          )
          test "$actual_bot_id" = "$EXPECTED_BOT_ID"
          test "$actual_bot_login" = "$EXPECTED_BOT_LOGIN"
          test "$actual_bot_type" = "Bot"

      - name: Materialize the processor from the exact trusted workflow SHA
        id: processor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          trusted_root="$RUNNER_TEMP/dependabot-processor"
          install -d -m 0700 "$trusted_root"
          trusted_processor="$trusted_root/dependabot-processor.mjs"
          trusted_receipts="$trusted_root/dependabot-preparation-receipts.mjs"
          resolved_sha="$(gh api "repos/$REPOSITORY/commits/$WORKFLOW_SHA" --jq .sha)"
          test "$resolved_sha" = "$WORKFLOW_SHA"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPOSITORY/contents/scripts/dependabot-processor.mjs?ref=$WORKFLOW_SHA" \
            > "$trusted_processor"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPOSITORY/contents/scripts/dependabot-preparation-receipts.mjs?ref=$WORKFLOW_SHA" \
            > "$trusted_receipts"
          test -s "$trusted_processor"
          test -s "$trusted_receipts"
          chmod 0500 "$trusted_processor"
          chmod 0400 "$trusted_receipts"
          echo "path=$trusted_processor" >> "$GITHUB_OUTPUT"

      - name: Re-query exact heads and apply refresh-only mutation
        shell: bash
        env:
          DEPENDABOT_PROCESSOR_GITHUB_TOKEN: ${{ github.token }}
          DEPENDABOT_PROCESSOR_PREPARE_APP_SLUG: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_APP_SLUG }}
          DEPENDABOT_PROCESSOR_PREPARE_BOT_ID: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_BOT_ID }}
          DEPENDABOT_PROCESSOR_PREPARE_BOT_LOGIN: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_BOT_LOGIN }}
          DEPENDABOT_PROCESSOR_REPAIR_TOKEN: ${{ steps.prepare-token.outputs.token }}
          EXPECTED_HEAD_SHA: ${{ needs.evaluate.outputs.expected_head_sha }}
          PROCESSOR_PATH: ${{ steps.processor.outputs.path }}
          PR_NUMBERS: ${{ needs.evaluate.outputs.pr_numbers }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          arguments=(
            process
            --live
            --phase mutate
            --repo "$REPOSITORY"
            --pr-numbers "$PR_NUMBERS"
            --mode prepare
          )
          if test -n "$EXPECTED_HEAD_SHA"; then
            arguments+=(--expected-head-sha "$EXPECTED_HEAD_SHA")
          fi
          node "$PROCESSOR_PATH" "${arguments[@]}"

  prepare-finalize:
    name: Finalize exact-head approval and human-only readiness
    needs: [evaluate, prepare-request, prepare-mutate]
    if: >-
      always() &&
      needs.evaluate.result == 'success' &&
      needs.evaluate.outputs.prepare == 'true' &&
      (
        (
          needs.prepare-request.result == 'success' &&
          needs.prepare-request.outputs.refresh_requested == 'false'
        ) ||
        (
          needs.prepare-request.result == 'skipped' &&
          needs.evaluate.outputs.refresh_required == 'false' &&
          needs.evaluate.outputs.refresh_pending == 'false'
        )
      ) &&
      (
        needs.prepare-mutate.result == 'success' ||
        needs.prepare-mutate.result == 'skipped'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: write
      contents: read
      issues: read
      pull-requests: write
      statuses: read
    outputs:
      actions_companion_base_sha: ${{ steps.finalize.outputs.actions_companion_base_sha }}
      actions_companion_candidate: ${{ steps.finalize.outputs.actions_companion_candidate }}
      actions_companion_head_sha: ${{ steps.finalize.outputs.actions_companion_head_sha }}
      actions_companion_pr_number: ${{ steps.finalize.outputs.actions_companion_pr_number }}
    steps:
      # The Prepare App client ID, secret, and token are absent from this job.
      # Its public actor identity binds completed receipts. The trusted
      # finalizer must recollect the current head and may remove old authority,
      # approve, and publish ALL CLEAR, but it cannot update a branch.
      - name: Materialize the processor from the exact trusted workflow SHA
        id: processor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          trusted_root="$RUNNER_TEMP/dependabot-processor"
          install -d -m 0700 "$trusted_root"
          trusted_processor="$trusted_root/dependabot-processor.mjs"
          trusted_receipts="$trusted_root/dependabot-preparation-receipts.mjs"
          resolved_sha="$(gh api "repos/$REPOSITORY/commits/$WORKFLOW_SHA" --jq .sha)"
          test "$resolved_sha" = "$WORKFLOW_SHA"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPOSITORY/contents/scripts/dependabot-processor.mjs?ref=$WORKFLOW_SHA" \
            > "$trusted_processor"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPOSITORY/contents/scripts/dependabot-preparation-receipts.mjs?ref=$WORKFLOW_SHA" \
            > "$trusted_receipts"
          test -s "$trusted_processor"
          test -s "$trusted_receipts"
          chmod 0500 "$trusted_processor"
          chmod 0400 "$trusted_receipts"
          echo "path=$trusted_processor" >> "$GITHUB_OUTPUT"

      - name: Recollect exact state and publish human-only readiness
        id: finalize
        shell: bash
        env:
          DEPENDABOT_PROCESSOR_GITHUB_TOKEN: ${{ github.token }}
          DEPENDABOT_PROCESSOR_PREPARE_APP_SLUG: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_APP_SLUG }}
          DEPENDABOT_PROCESSOR_PREPARE_BOT_ID: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_BOT_ID }}
          DEPENDABOT_PROCESSOR_PREPARE_BOT_LOGIN: ${{ vars.DEPENDABOT_PROCESSOR_PREPARE_BOT_LOGIN }}
          FINALIZE_RESULT_PATH: ${{ runner.temp }}/dependabot-finalize-result.json
          PROCESSOR_PATH: ${{ steps.processor.outputs.path }}
          PR_NUMBERS: ${{ needs.evaluate.outputs.pr_numbers }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node "$PROCESSOR_PATH" \
            process \
            --live \
            --publish-checks \
            --phase finalize \
            --repo "$REPOSITORY" \
            --pr-numbers "$PR_NUMBERS" \
            --mode prepare > "$FINALIZE_RESULT_PATH"
          node --input-type=module --eval '
            import { appendFileSync, readFileSync } from "node:fs";

            const result = JSON.parse(
              readFileSync(process.env.FINALIZE_RESULT_PATH, "utf8"),
            );
            const candidate = result?.actionsCompanionCandidate;
            const validCandidate =
              candidate === null ||
              (candidate !== null &&
                typeof candidate === "object" &&
                !Array.isArray(candidate) &&
                JSON.stringify(Object.keys(candidate).sort()) ===
                  JSON.stringify([
                    "baseSha",
                    "headSha",
                    "pullRequestNumber",
                  ]) &&
                /^[0-9a-f]{40}$/.test(candidate.baseSha ?? "") &&
                /^[0-9a-f]{40}$/.test(candidate.headSha ?? "") &&
                Number.isSafeInteger(candidate.pullRequestNumber) &&
                candidate.pullRequestNumber >= 1 &&
                candidate.pullRequestNumber <= 9_999_999_999 &&
                result?.prepareCandidate === null &&
                result?.serialization?.ready === true &&
                result.evaluations.filter(
                  (evaluation) =>
                    evaluation?.pullRequestNumber ===
                      candidate.pullRequestNumber &&
                    evaluation?.headSha === candidate.headSha &&
                    evaluation?.base?.currentBaseSha === candidate.baseSha &&
                    evaluation?.baseSha === candidate.baseSha &&
                    evaluation?.disposition === "manual-review",
                ).length === 1);
            if (
              result?.schema !== "dependabot-processor:v2" ||
              result?.repository !== process.env.REPOSITORY ||
              result?.mode !== "prepare" ||
              result?.phase !== "finalize" ||
              !Array.isArray(result?.evaluations) ||
              !Array.isArray(result?.mutations) ||
              !Object.hasOwn(result, "prepareCandidate") ||
              !Object.hasOwn(result, "actionsCompanionCandidate") ||
              !validCandidate
            ) {
              throw new Error("Invalid Dependabot finalization result");
            }
            appendFileSync(
              process.env.GITHUB_OUTPUT,
              `actions_companion_base_sha=${candidate?.baseSha ?? ""}\n` +
                `actions_companion_candidate=${Boolean(candidate)}\n` +
                `actions_companion_head_sha=${candidate?.headSha ?? ""}\n` +
                `actions_companion_pr_number=${candidate?.pullRequestNumber ?? ""}\n`,
            );
          '
