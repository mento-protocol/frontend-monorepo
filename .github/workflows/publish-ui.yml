name: Publish UI Package

on:
  push:
    tags:
      - "@mento-protocol/ui@*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @mento-protocol/ui
    if: startsWith(github.ref, 'refs/tags/@mento-protocol/ui@')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm dependencies
        uses: ./.github/actions/pnpm-install
        with:
          node-version: 24
          cache: "false"
          registry-url: https://registry.npmjs.org

      - name: Setup npm for trusted publishing
        run: |
          npm install --global npm@11.5.1
          npm --version

      - name: Validate tag version
        run: |
          tag_version="${GITHUB_REF_NAME#@mento-protocol/ui@}"
          package_version="$(node -p "require('./packages/ui/package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version $tag_version does not match package version $package_version"
            exit 1
          fi

      - name: Build package
        run: pnpm --filter @mento-protocol/ui build

      - name: Pack package
        run: pnpm --filter @mento-protocol/ui pack --pack-destination "$RUNNER_TEMP/ui-package"

      - name: Publish package
        run: |
          package_version="$(node -p "require('./packages/ui/package.json').version")"
          npm publish "$RUNNER_TEMP/ui-package/mento-protocol-ui-${package_version}.tgz" --access public
