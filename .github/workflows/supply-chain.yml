name: Supply Chain

# Dependency supply-chain gates, decoupled from trunk so the pre-push hook
# never blocks on lockfile CVEs (see .trunk/trunk.yaml — osv-scanner ignores
# the dependency lockfiles).
#
# Pull requests and main ask different questions:
#
#   * Pull request — OSV-Scanner PR mode, as a pair of local read-only jobs per
#     target: `_osv-scanner-baseline` scans the base branch and publishes the
#     baseline, `_osv-scanner-readonly` scans this branch and fails only on
#     vulnerabilities the pull request introduces. An advisory published
#     against a version already pinned on main therefore no longer turns every
#     open pull request red for something none of them changed. Splitting the
#     two scans across two jobs keeps each at one OSV scanner action step, as
#     AGENTS.md requires.
#   * Daily cron and manual dispatch — a full scan of the whole lockfile,
#     which is what catches a newly disclosed CVE against an already-pinned
#     dependency or an expired ignore. That is the backstop the pull-request
#     diff deliberately gives up. A scheduled failure becomes one managed
#     "CI: Supply Chain is failing" issue via ci-failure-notifier.yml.
#     Main pushes run neither: they run only the two deterministic jobs below,
#     so each push success stays valid main-branch recovery evidence.
#
# The adapter exists because the upstream reusable workflows request
# `security-events: write` even when SARIF upload is disabled. Separate
# schedule/manual jobs publish SARIF with that permission.
#
#   1. osv              — osv-scanner against the application lockfile, reading
#                         the repository-wide osv-scanner.toml.
#   2. osv-pnpm-runtime — a separately configured scan of the exact isolated
#                         trusted-tool lockfile. Its config contains no ignored
#                         vulnerabilities. The lockfile guard independently
#                         rejects affected pnpm releases.
#   3. osv-vercel-cli-runtime — scans the standalone Vercel CLI lockfile with
#                               only its two package-name false positives.
#   4. osv-pnpm-bootstrap — scans the exact npm-locked Linux bootstrap artifact
#                           without a vulnerability suppression config.
#                           Each lockfile is diffed against the base branch on
#                           every PR, by a `<name>-baseline` job paired with
#                           the scan job above it, and fully scanned by the
#                           daily cron (24h disclosure backstop for new CVEs
#                           and expired ignores).
#   5. lockfile-lint    — sha512 integrity + registry-poisoning gate, plus a
#                         real Linux npm-ci proof for the bootstrap lock.
#   6. version-skew     — every cataloged dep is "catalog:" or the exact catalog
#                         version (no silent drift off the shared catalog).
#                         Main pushes run only these two deterministic jobs so
#                         each success is valid main-branch recovery evidence.
#
# Repository-wide suppressions live in osv-scanner.toml. Advisories suppressed
# across configured scanners must stay in sync with the `allow-ghsas` list in
# dependency-review.yml and its expiry. Scanner-specific metadata false
# positives remain OSV-only beside their exact lockfile, with source evidence
# and a short `ignoreUntil`.
#
# No path filter on `pull_request`: `osv-scanner / osv-scan` is a required
# check, and a path-filtered required check that gets skipped sits "pending"
# forever and blocks merges. The jobs are cheap enough to run on every PR.
# Scheduled failures are handled by ci-failure-notifier.yml, which owns the
# repository-wide deduplicated failure issue lifecycle.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily so a newly-disclosed CVE against a pinned dep is caught within 24h.
    - cron: 17 6 * * *
  workflow_dispatch:

# A short main baseline must not cancel a full scheduled or manual OSV scan at
# the same SHA.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions: read-all

jobs:
  # Each pull-request target is a pair: a baseline job that scans the base
  # branch, and the scan of this branch that reports only what the pair
  # differs by. They are separate jobs so each runs exactly one OSV scanner
  # action step, as AGENTS.md requires. The pair must pass identical scan-args
  # or the two result sets are not comparable; dependency-policy.test.mjs
  # asserts that.
  #
  # Each scan job runs on `!cancelled()` rather than on its baseline
  # succeeding. A failed baseline falls back to an empty one and reports a full
  # scan, so `osv-scanner / osv-scan` never sits skipped, which for a required
  # check would block every merge.
  osv-baseline:
    name: osv-baseline
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_osv-scanner-baseline.yml
    with:
      baseline-artifact: osv-baseline-root
      scan-args: |-
        --config=osv-scanner.toml
        --lockfile=pnpm-lock.yaml

  osv:
    name: osv-scanner
    needs: osv-baseline
    if: ${{ github.event_name == 'pull_request' && !cancelled() }}
    permissions:
      actions: read
      contents: read
    # Pinned to v2.5.1. scan-args is scoped to the lockfile + the repo config:
    # with --lockfile, osv-scanner does NOT auto-discover osv-scanner.toml, so
    # --config is required. node_modules is gitignored and not scanned.
    uses: ./.github/workflows/_osv-scanner-readonly.yml
    with:
      baseline-artifact: osv-baseline-root
      scan-args: |-
        --config=osv-scanner.toml
        --lockfile=pnpm-lock.yaml

  osv-pnpm-runtime-baseline:
    name: osv-baseline (trusted pnpm runtime)
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_osv-scanner-baseline.yml
    with:
      baseline-artifact: osv-baseline-pnpm-runtime
      scan-args: |-
        --config=scripts/vercel-pnpm-runtime/osv-scanner.toml
        --lockfile=scripts/vercel-pnpm-runtime/pnpm-lock.yaml

  osv-pnpm-runtime:
    name: osv-scanner (trusted pnpm runtime)
    needs: osv-pnpm-runtime-baseline
    if: ${{ github.event_name == 'pull_request' && !cancelled() }}
    permissions:
      actions: read
      contents: read
    # Keep the no-ignore runtime config bound to this exact one-package
    # lockfile. Active pnpm advisories must fail this dedicated scan.
    uses: ./.github/workflows/_osv-scanner-readonly.yml
    with:
      baseline-artifact: osv-baseline-pnpm-runtime
      scan-args: |-
        --config=scripts/vercel-pnpm-runtime/osv-scanner.toml
        --lockfile=scripts/vercel-pnpm-runtime/pnpm-lock.yaml

  osv-vercel-cli-runtime-baseline:
    name: osv-baseline (standalone Vercel CLI runtime)
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_osv-scanner-baseline.yml
    with:
      baseline-artifact: osv-baseline-vercel-cli-runtime
      scan-args: |-
        --config=scripts/vercel-cli-runtime/osv-scanner.toml
        --lockfile=scripts/vercel-cli-runtime/pnpm-lock.yaml

  osv-vercel-cli-runtime:
    name: osv-scanner (standalone Vercel CLI runtime)
    needs: osv-vercel-cli-runtime-baseline
    if: ${{ github.event_name == 'pull_request' && !cancelled() }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_osv-scanner-readonly.yml
    with:
      baseline-artifact: osv-baseline-vercel-cli-runtime
      scan-args: |-
        --config=scripts/vercel-cli-runtime/osv-scanner.toml
        --lockfile=scripts/vercel-cli-runtime/pnpm-lock.yaml

  osv-pnpm-bootstrap-baseline:
    name: osv-baseline (trusted pnpm bootstrap)
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_osv-scanner-baseline.yml
    with:
      baseline-artifact: osv-baseline-pnpm-bootstrap
      scan-args: |-
        --lockfile=scripts/vercel-pnpm-bootstrap/package-lock.json

  osv-pnpm-bootstrap:
    name: osv-scanner (trusted pnpm bootstrap)
    needs: osv-pnpm-bootstrap-baseline
    if: ${{ github.event_name == 'pull_request' && !cancelled() }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_osv-scanner-readonly.yml
    with:
      baseline-artifact: osv-baseline-pnpm-bootstrap
      scan-args: |-
        --lockfile=scripts/vercel-pnpm-bootstrap/package-lock.json

  osv-sarif:
    name: osv-scanner SARIF
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8e5cf47b818121e8b405931c82126c2630b0b20d # v2.5.1
    with:
      scan-args: |-
        --config=osv-scanner.toml
        --lockfile=pnpm-lock.yaml
      upload-sarif: true

  osv-pnpm-runtime-sarif:
    name: osv-scanner SARIF (trusted pnpm runtime)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8e5cf47b818121e8b405931c82126c2630b0b20d # v2.5.1
    with:
      scan-args: |-
        --config=scripts/vercel-pnpm-runtime/osv-scanner.toml
        --lockfile=scripts/vercel-pnpm-runtime/pnpm-lock.yaml
      upload-sarif: true

  osv-vercel-cli-runtime-sarif:
    name: osv-scanner SARIF (standalone Vercel CLI runtime)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8e5cf47b818121e8b405931c82126c2630b0b20d # v2.5.1
    with:
      scan-args: |-
        --config=scripts/vercel-cli-runtime/osv-scanner.toml
        --lockfile=scripts/vercel-cli-runtime/pnpm-lock.yaml
      upload-sarif: true

  osv-pnpm-bootstrap-sarif:
    name: osv-scanner SARIF (trusted pnpm bootstrap)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8e5cf47b818121e8b405931c82126c2630b0b20d # v2.5.1
    with:
      scan-args: |-
        --lockfile=scripts/vercel-pnpm-bootstrap/package-lock.json
      upload-sarif: true

  lockfile-lint:
    name: lockfile integrity + registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: lockfile-lint self-tests
        run: node scripts/lockfile-lint.test.mjs
      - name: lockfile integrity + registry check
        run: npm run supply-chain:lockfile-lint
      - name: Install and authenticate the Linux pnpm bootstrap
        working-directory: scripts/vercel-pnpm-bootstrap
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          pnpm_binary=node_modules/@pnpm/linux-x64/pnpm
          test -f "$pnpm_binary"
          test ! -L "$pnpm_binary"
          echo "69a535476f407fb0f64427913c2b592ca2ed6bf93f92e2cb82a32349e31f36eb  $pnpm_binary" |
            sha256sum --check --strict
          "$pnpm_binary" --version | grep -Fxq "10.34.5"

  version-skew:
    name: catalog version-skew
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: version-skew self-tests
        run: node scripts/version-skew-check.test.mjs
      - name: catalog version-skew check
        run: node scripts/version-skew-check.mjs
