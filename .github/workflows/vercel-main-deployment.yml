        run: |
          set -euo pipefail
          materialize_inactive_smoke() {
            local active="$1"
            local runtime_proof="$2"
            if [ "$active" = true ]; then
              test -s "$runtime_proof"
            else
              printf 'null\n' > "$runtime_proof"
            fi
          }
          materialize_inactive_smoke "$APP_ACTIVE" "$RUNNER_TEMP/app-runtime-smoke.json"
          materialize_inactive_smoke "$GOVERNANCE_ACTIVE" "$RUNNER_TEMP/governance-runtime-smoke.json"
          materialize_inactive_smoke "$RESERVE_ACTIVE" "$RUNNER_TEMP/reserve-runtime-smoke.json"
          materialize_inactive_smoke "$UI_ACTIVE" "$RUNNER_TEMP/ui-runtime-smoke.json"
          node scripts/vercel-main-deployment.mjs active-public-smokes \
            --execution "$RUNNER_TEMP/execution.json" \
            --stage-barrier "$RUNNER_TEMP/stage-barrier.json" \
            --app "$RUNNER_TEMP/app-runtime-smoke.json" \
            --governance "$RUNNER_TEMP/governance-runtime-smoke.json" \
            --reserve "$RUNNER_TEMP/reserve-runtime-smoke.json" \
            --ui "$RUNNER_TEMP/ui-runtime-smoke.json" \
            --output "$RUNNER_TEMP/public-smokes.json"
      - name: Capture fresh final mappings state census and freshness
        if: >-
          steps.freshness.outputs.status == 'fresh' &&
          needs.prepare-release.outputs.has_active_targets == 'true'
        id: final-proof
        env:
          RELEASE_DECISION: ${{ needs.prepare-release.outputs.decision }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: |
          set -euo pipefail
          node scripts/vercel-main-deployment.mjs active-freshness --output "$RUNNER_TEMP/final-freshness.json"
          case "$RELEASE_DECISION" in
            verify-existing-release)
              node scripts/vercel-main-deployment.mjs current-release-mapping-spec --execution "$RUNNER_TEMP/execution.json" --stage-barrier "$RUNNER_TEMP/stage-barrier.json" --output "$RUNNER_TEMP/final-mapping-spec.json"
              node scripts/vercel-main-deployment.mjs current-release-state-spec --execution "$RUNNER_TEMP/execution.json" --stage-barrier "$RUNNER_TEMP/stage-barrier.json" --output "$RUNNER_TEMP/final-state-spec.json"
              ;;
            capture-new-baseline|resume-existing-release)
              node scripts/vercel-main-deployment.mjs active-mapping-spec --execution "$RUNNER_TEMP/execution.json" --stage-barrier "$RUNNER_TEMP/stage-barrier.json" --journal-history "$RUNNER_TEMP/active-journals/current-history.json" --output "$RUNNER_TEMP/final-mapping-spec.json"
              node scripts/vercel-main-deployment.mjs active-state-spec --execution "$RUNNER_TEMP/execution.json" --stage-barrier "$RUNNER_TEMP/stage-barrier.json" --journal-history "$RUNNER_TEMP/active-journals/current-history.json" --output "$RUNNER_TEMP/final-state-spec.json"
              ;;
            *)
              exit 1
              ;;
          esac
          node scripts/vercel-deployment-state.mjs alias-mappings --spec "$RUNNER_TEMP/final-mapping-spec.json" --output "$RUNNER_TEMP/final-mappings-raw.json"
          node scripts/vercel-main-deployment.mjs active-canonical-mappings --mapping-spec "$RUNNER_TEMP/final-mapping-spec.json" --mappings "$RUNNER_TEMP/final-mappings-raw.json" --output "$RUNNER_TEMP/final-mappings.json"
          node scripts/vercel-deployment-state.mjs active-proof --spec "$RUNNER_TEMP/final-state-spec.json" --output "$RUNNER_TEMP/final-state-proof.json"
          node scripts/vercel-main-deployment.mjs active-terminal-state-proof --execution "$RUNNER_TEMP/execution.json" --stage-barrier "$RUNNER_TEMP/stage-barrier.json" --state-proof "$RUNNER_TEMP/final-state-proof.json" --output "$RUNNER_TEMP/terminal-state-proof.json"
          node scripts/vercel-deployment-state.mjs snapshot --spec "$RUNNER_TEMP/legacy-spec.json" --output "$RUNNER_TEMP/final-legacy.json"
      - name: Finalize only the canonically proven committed journal
        if: >-
          steps.freshness.outputs.status == 'fresh' &&
          needs.prepare-release.outputs.has_active_targets == 'true' &&
          needs.prepare-release.outputs.decision != 'verify-existing-release'
        id: finalize
        run: |
          node scripts/vercel-main-deployment.mjs active-event-finalize --receipt "$RUNNER_TEMP/active-journals/current-receipt.json" --freshness "$RUNNER_TEMP/final-freshness.json" --current-mappings "$RUNNER_TEMP/final-mappings-raw.json" --public-smokes "$RUNNER_TEMP/public-smokes.json" --state-proof "$RUNNER_TEMP/final-state-proof.json" --output "$RUNNER_TEMP/finalize-event.json"
          node scripts/vercel-main-deployment.mjs run-active --execution "$RUNNER_TEMP/execution.json" --stage-barrier "$RUNNER_TEMP/stage-barrier.json" --prepared-journal "$RUNNER_TEMP/prepared-journal.json" --event "$RUNNER_TEMP/finalize-event.json" --journal-history "$RUNNER_TEMP/active-journals/current-history.json" --journal-output "$RUNNER_TEMP/committed-journal.json" --output "$RUNNER_TEMP/finalize-transition.json"
      - name: Require a committed terminal journal transition
        if: >-
          steps.freshness.outputs.status == 'fresh' &&
          needs.prepare-release.outputs.has_active_targets == 'true' &&
          needs.prepare-release.outputs.decision != 'verify-existing-release'
        env:
          AFTER_UPLOAD_ACTION: ${{ steps.finalize.outputs.after_upload_action }}
          ARTIFACT_NAME: ${{ steps.finalize.outputs.journal_artifact_name }}
          NEXT_ACTION: ${{ steps.finalize.outputs.next_action }}
          TRANSITION_KIND: ${{ steps.finalize.outputs.transition_kind }}
        run: |
          set -euo pipefail
          test "$TRANSITION_KIND" = journal
          test "$NEXT_ACTION" = upload-journal
          test "$AFTER_UPLOAD_ACTION" = complete
          test "$ARTIFACT_NAME" != none
      - name: Stage the committed terminal journal under its canonical artifact basename
        if: >-
          steps.freshness.outputs.status == 'fresh' &&
          needs.prepare-release.outputs.has_active_targets == 'true' &&
          needs.prepare-release.outputs.decision != 'verify-existing-release'
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/committed-journal-artifact"
          install -m 0600 "$RUNNER_TEMP/committed-journal.json" "$RUNNER_TEMP/committed-journal-artifact/main-journal.json"
      - name: Upload the committed terminal journal
        if: >-
          steps.freshness.outputs.status == 'fresh' &&
          needs.prepare-release.outputs.has_active_targets == 'true' &&
          needs.prepare-release.outputs.decision != 'verify-existing-release'
        id: upload-committed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.finalize.outputs.journal_artifact_name }}
          path: ${{ runner.temp }}/committed-journal-artifact/main-journal.json
          if-no-files-found: error
          retention-days: 7
      - name: Checkpoint the committed terminal journal
        if: >-
          steps.freshness.outputs.status == 'fresh' &&
          needs.prepare-release.outputs.has_active_targets == 'true' &&
          needs.prepare-release.outputs.decision != 'verify-existing-release'
        env:
          ARTIFACT_ID: ${{ steps.upload-committed.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.finalize.outputs.journal_artifact_name }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/active-journals/$ARTIFACT_NAME"
          install -m 0600 "$RUNNER_TEMP/committed-journal.json" "$RUNNER_TEMP/active-journals/$ARTIFACT_NAME/main-journal.json"
          node scripts/vercel-main-deployment.mjs active-journal-history --artifacts "$RUNNER_TEMP/active-journals" --output "$RUNNER_TEMP/final-history.json"
          node scripts/vercel-main-deployment.mjs active-journal-receipt --journal "$RUNNER_TEMP/committed-journal.json" --artifact-name "$ARTIFACT_NAME" --artifact-id "$ARTIFACT_ID" --output "$RUNNER_TEMP/final-receipt.json"
          install -m 0600 "$RUNNER_TEMP/final-history.json" "$RUNNER_TEMP/active-journals/current-history.json"
          install -m 0600 "$RUNNER_TEMP/committed-journal.json" "$RUNNER_TEMP/active-journals/current-journal.json"
          install -m 0600 "$RUNNER_TEMP/final-receipt.json" "$RUNNER_TEMP/active-journals/current-receipt.json"
      - name: Materialize committed terminal artifacts
        if: >-
          steps.freshness.outputs.status == 'fresh' &&
          needs.prepare-release.outputs.has_active_targets == 'true' &&
          needs.prepare-release.outputs.decision != 'verify-existing-release'
        id: committed-terminal
        run: |
          node scripts/vercel-main-release-cli.mjs terminal-artifacts \
            --active-evidence-output "$RUNNER_TEMP/active-evidence.json" \
            --execution "$RUNNER_TEMP/execution.json" \
            --final-census "$RUNNER_TEMP/terminal-state-proof.json" \
            --final-mappings "$RUNNER_TEMP/final-mappings.json" \
            --freshness "$RUNNER_TEMP/null.json" \
            --journal-history "$RUNNER_TEMP/final-history.json" \
            --legacy-v2 "$RUNNER_TEMP/final-legacy.json" \
            --outcome active-committed \
            --proofs-output "$RUNNER_TEMP/terminal-proofs.json" \
            --public-smokes "$RUNNER_TEMP/public-smokes.json" \
            --stage-results "$RUNNER_TEMP/null.json" \
            --state-proof "$RUNNER_TEMP/terminal-state-proof.json"
          echo "outcome=active-committed" >> "$GITHUB_OUTPUT"
      - name: Materialize an already-current release terminal without a journal
        if: >-
          steps.freshness.outputs.status == 'fresh' &&
          needs.prepare-release.outputs.has_active_targets == 'true' &&
          needs.prepare-release.outputs.decision == 'verify-existing-release'
        id: current-release-terminal
        run: |
          node scripts/vercel-main-release-cli.mjs terminal-artifacts \
            --active-evidence-output "$RUNNER_TEMP/active-evidence.json" \
            --execution "$RUNNER_TEMP/execution.json" \
            --final-census "$RUNNER_TEMP/terminal-state-proof.json" \
            --final-mappings "$RUNNER_TEMP/final-mappings.json" \
            --freshness "$RUNNER_TEMP/final-freshness.json" \
            --journal-history "$RUNNER_TEMP/empty-history.json" \
            --legacy-v2 "$RUNNER_TEMP/final-legacy.json" \
            --outcome current-release-verified \
            --proofs-output "$RUNNER_TEMP/terminal-proofs.json" \
            --public-smokes "$RUNNER_TEMP/public-smokes.json" \
            --stage-results "$RUNNER_TEMP/null.json" \
            --state-proof "$RUNNER_TEMP/terminal-state-proof.json"
          echo "outcome=current-release-verified" >> "$GITHUB_OUTPUT"
      - name: Publish terminal producer outputs
        id: terminal
        if: ${{ always() && !failure() && !cancelled() }}
        run: >-
          node scripts/vercel-main-deployment.mjs terminal-evidence-create
          --manifest "$RUNNER_TEMP/manifest.json" --execution "$RUNNER_TEMP/execution.json"
          --active-evidence "$RUNNER_TEMP/active-evidence.json" --proofs "$RUNNER_TEMP/terminal-proofs.json"
          --receipt-output "$RUNNER_TEMP/terminal-receipt.json" --evidence-output "$RUNNER_TEMP/terminal-evidence.json"
      - name: Publish canonical activation outcome
        id: outcome
        if: ${{ always() && !failure() && !cancelled() }}
        env:
          COORDINATOR_OUTCOME: ${{ steps.no-target-terminal.outputs.outcome || steps.superseded-terminal.outputs.outcome || steps.shadow-terminal.outputs.outcome || steps.committed-terminal.outputs.outcome || steps.current-release-terminal.outputs.outcome }}
        run: |
          test -n "$COORDINATOR_OUTCOME"
          echo "outcome=$COORDINATOR_OUTCOME" >> "$GITHUB_OUTPUT"
      - name: Remove authenticated App runtime
        if: ${{ always() }}
        uses: ./.github/actions/vercel-protected-runtime
        with: { operation: cleanup, logical-target: app }

  recover-main-deployment:
    name: Recover only this attempt's active journal
    needs:
      [
        wait-for-ci,
        require-ci-success,
        provider-preplan,
        restore-inherited-release,
        prepare-release,
        stage-app,
        stage-governance,
        stage-reserve,
        stage-ui,
        activate-and-verify,
      ]
    if: >-
      always() && needs.wait-for-ci.result == 'success' &&
      needs.require-ci-success.result == 'success' &&
      needs.provider-preplan.result == 'success' &&
      needs.prepare-release.result == 'success' &&
      needs.activate-and-verify.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: vercel-cli-production
      deployment: false # trunk-ignore(actionlint/syntax-check): Pinned actionlint has not learned GitHub's deployment key.
    outputs:
      outcome: ${{ steps.outcome.outputs.outcome }}
      receipt: ${{ steps.terminal.outputs.receipt }}
      evidence: ${{ steps.terminal.outputs.evidence }}
    env:
      DEPLOY_SHA: ${{ needs.wait-for-ci.outputs.deploy_sha }}
      UPSTREAM_RUN_ID: ${{ needs.wait-for-ci.outputs.upstream_run_id }}
      UPSTREAM_RUN_ATTEMPT: ${{ needs.wait-for-ci.outputs.upstream_run_attempt }}
      UPSTREAM_RUN_URL: ${{ needs.wait-for-ci.outputs.upstream_run_url }}
      BUILD_AND_TEST_JOB_URL: ${{ needs.require-ci-success.outputs.build_and_test_job_url }}
      MAIN_RELEASE_EXECUTION: ${{ needs.prepare-release.outputs.execution }}
      VERCEL_PROJECT_ID_APP: ${{ vars.VERCEL_PROJECT_ID_APP }}
      VERCEL_PROJECT_ID_GOVERNANCE: ${{ vars.VERCEL_PROJECT_ID_GOVERNANCE }}
      VERCEL_PROJECT_ID_RESERVE: ${{ vars.VERCEL_PROJECT_ID_RESERVE }}
      VERCEL_PROJECT_ID_UI: ${{ vars.VERCEL_PROJECT_ID_UI }}
    steps:
      - name: Check out immutable recovery controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            fetch-depth: 1,
            persist-credentials: false,
            ref: "${{ github.workflow_sha }}",
          }
      - name: Check out exact admitted recovery source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            fetch-depth: 0,
            path: source,
            persist-credentials: false,
            ref: "${{ needs.wait-for-ci.outputs.deploy_sha }}",
          }
      - name: Prove exact admitted recovery source
        env:
          { GITHUB_WORKFLOW_SHA: "${{ needs.wait-for-ci.outputs.deploy_sha }}" }
        run: |
          git -C "$SOURCE_PATH" fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/vercel-main-deployment.mjs validate-recovery-source
      - name: Install exact recovery source without lifecycle scripts
        uses: ./.github/actions/pnpm-install
        with:
          {
            working-directory: source,
            ignore-scripts: "true",
            filter: frontend-monorepo,
          }
      - name: Prepare protected recovery runtime
        id: recovery-runtime
        uses: ./.github/actions/vercel-protected-runtime
        with:
          {
            operation: prepare,
            logical-target: app,
            controller-path: "${{ github.workspace }}",
            source-path: "${{ github.workspace }}/source",
          }
      - name: Verify pinned recovery prerequisites
        run: ${{ steps.recovery-runtime.outputs.node-bin }} scripts/vercel-prebuilt.mjs check-versions --repo-root "$SOURCE_PATH"
      - name: Materialize current execution manifest and recovery specifications
        run: |
          set -euo pipefail
          umask 077
          node scripts/vercel-main-release-cli.mjs materialize --output "$RUNNER_TEMP/execution.json"
          jq -e '.manifest' "$RUNNER_TEMP/execution.json" > "$RUNNER_TEMP/manifest.json"
          printf 'null\n' > "$RUNNER_TEMP/null.json"
          printf '[]\n' > "$RUNNER_TEMP/empty-history.json"
          node scripts/vercel-main-deployment.mjs create-spec --scope legacy --output "$RUNNER_TEMP/legacy-spec.json"
      - name: Derive exact current-attempt journal identity
        id: journal-identity
        run: node scripts/vercel-main-deployment.mjs active-journal-identity
      - name: Download only this run and attempt's journal artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          pattern: ${{ steps.journal-identity.outputs.artifact_prefix }}*
          path: ${{ runner.temp }}/current-attempt-journals
          run-id: ${{ github.run_id }}
      - name: Detect exact current-attempt journal presence
        id: journal-presence
        env:
          ARTIFACT_PREFIX: ${{ steps.journal-identity.outputs.artifact_prefix }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/current-attempt-journals"
          journal_count="$(find "$RUNNER_TEMP/current-attempt-journals" -mindepth 2 -maxdepth 2 -type f -name main-journal.json | wc -l | tr -d ' ')"
          if [ "$journal_count" = 0 ]; then
            echo 'has_journal=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          find "$RUNNER_TEMP/current-attempt-journals" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' |
            while IFS= read -r artifact_name; do
              case "$artifact_name" in
                "$ARTIFACT_PREFIX"*) ;;
                *) exit 1 ;;
              esac
            done
          echo 'has_journal=true' >> "$GITHUB_OUTPUT"
      - name: Load strict exact current-attempt journal history
        id: journal-history
        if: steps.journal-presence.outputs.has_journal == 'true'
        run: >-
          node scripts/vercel-main-deployment.mjs active-journal-history
          --artifacts "$RUNNER_TEMP/current-attempt-journals"
          --output "$RUNNER_TEMP/current-attempt-journals/current-history.json"
      - name: Resolve exact current-attempt journal artifact metadata
        id: journal-metadata
        if: steps.journal-presence.outputs.has_journal == 'true'
        env:
          ARTIFACT_PREFIX: ${{ steps.journal-identity.outputs.artifact_prefix }}
          ARTIFACT_NAME: ${{ steps.journal-history.outputs.highest_artifact_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" | jq -er --arg prefix "$ARTIFACT_PREFIX" --arg name "$ARTIFACT_NAME" '[.artifacts[] | select(.expired == false and .name == $name and (.name | startswith($prefix))) | .id] | if length == 1 then .[0] else error("exact current-attempt journal artifact is missing or ambiguous") end')"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
      - name: Checkpoint downloaded exact current-attempt journal
        if: steps.journal-presence.outputs.has_journal == 'true'
        env:
          ARTIFACT_ID: ${{ steps.journal-metadata.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.journal-history.outputs.highest_artifact_name }}
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/current-attempt-journals/$ARTIFACT_NAME/main-journal.json"
          node scripts/vercel-main-deployment.mjs active-journal-receipt --journal "$RUNNER_TEMP/current-attempt-journals/$ARTIFACT_NAME/main-journal.json" --artifact-name "$ARTIFACT_NAME" --artifact-id "$ARTIFACT_ID" --output "$RUNNER_TEMP/current-attempt-journals/current-receipt.json"
          install -m 0600 "$RUNNER_TEMP/current-attempt-journals/$ARTIFACT_NAME/main-journal.json" "$RUNNER_TEMP/current-attempt-journals/current-journal.json"
      - name: Derive and capture full recovery mappings from journal history
        id: recovery-mappings
        if: steps.journal-presence.outputs.has_journal == 'true'
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: |
          node scripts/vercel-main-deployment.mjs active-recovery-mapping-spec --journal-history "$RUNNER_TEMP/current-attempt-journals/current-history.json" --output "$RUNNER_TEMP/recovery-mapping-spec.json"
          node scripts/vercel-deployment-state.mjs alias-mappings --spec "$RUNNER_TEMP/recovery-mapping-spec.json" --output "$RUNNER_TEMP/recovery-start-mappings.json"
      - name: Plan exact current-attempt recovery
        id: recovery-plan
        if: steps.journal-presence.outputs.has_journal == 'true'
        run: >-
          node scripts/vercel-main-deployment.mjs plan-active-recovery
          --journal-history "$RUNNER_TEMP/current-attempt-journals/current-history.json"
          --current-mappings "$RUNNER_TEMP/recovery-start-mappings.json"
          --output "$RUNNER_TEMP/recovery-plan.json"
      - name: Initialize durable current-attempt recovery journal
        id: initialize
        if: steps.journal-presence.outputs.has_journal == 'true'
        run: |
          node scripts/vercel-main-deployment.mjs active-recovery-event-initialize --receipt "$RUNNER_TEMP/current-attempt-journals/current-receipt.json" --output "$RUNNER_TEMP/recovery-initialize-event.json"
          node scripts/vercel-main-deployment.mjs run-active-recovery --plan "$RUNNER_TEMP/recovery-plan.json" --event "$RUNNER_TEMP/recovery-initialize-event.json" --journal-history "$RUNNER_TEMP/current-attempt-journals/current-history.json" --journal-output "$RUNNER_TEMP/recovery-initialized-journal.json" --output "$RUNNER_TEMP/recovery-initialize-transition.json"
      - name: Classify recovery preparation failure or non-journal result
        id: recovery-failed
        if: >-
          always() && !cancelled() &&
          steps.journal-presence.outputs.has_journal == 'true' &&
          (steps.recovery-mappings.outcome == 'failure' ||
          steps.recovery-plan.outcome == 'failure' ||
          steps.initialize.outcome == 'failure' ||
          (steps.initialize.outcome == 'success' &&
          (steps.initialize.outputs.transition_kind == 'recovery-not-required' ||
          steps.initialize.outputs.transition_kind == 'recovery-ready')))
        env:
          AFTER_UPLOAD_ACTION: ${{ steps.initialize.outputs.after_upload_action }}
          ARTIFACT_NAME: ${{ steps.initialize.outputs.journal_artifact_name }}
          HIGHEST_STATUS: ${{ steps.journal-history.outputs.highest_status }}
          INITIALIZE_OUTCOME: ${{ steps.initialize.outcome }}
          NEXT_ACTION: ${{ steps.initialize.outputs.next_action }}
          RECOVERY_MAPPINGS_OUTCOME: ${{ steps.recovery-mappings.outcome }}
          RECOVERY_PLAN_OUTCOME: ${{ steps.recovery-plan.outcome }}
          TRANSITION_KIND: ${{ steps.initialize.outputs.transition_kind }}
        run: |
          set -euo pipefail
          if [ "$RECOVERY_MAPPINGS_OUTCOME" = failure ] || [ "$RECOVERY_PLAN_OUTCOME" = failure ] || [ "$INITIALIZE_OUTCOME" = failure ]; then
            echo 'outcome=recovery-failed' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$INITIALIZE_OUTCOME" = success
          test "$AFTER_UPLOAD_ACTION" = none
          test "$ARTIFACT_NAME" = none
          case "$TRANSITION_KIND" in
            recovery-not-required)
              test "$NEXT_ACTION" = fail-after-evidence
              case "$HIGHEST_STATUS" in
                recovered|manual_intervention)
                  install -m 0600 "$RUNNER_TEMP/current-attempt-journals/current-history.json" "$RUNNER_TEMP/recovered-history.json"
                  echo 'outcome=terminal-bypass' >> "$GITHUB_OUTPUT"
                  echo "terminal_status=$HIGHEST_STATUS" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
              esac
              ;;
            recovery-ready) test "$NEXT_ACTION" = dispatch ;;
            *) exit 1 ;;
          esac
          echo 'outcome=recovery-failed' >> "$GITHUB_OUTPUT"
      - name: Require initialized recovery journal checkpoint
        if: >-
          steps.journal-presence.outputs.has_journal == 'true' &&
          steps.initialize.outputs.transition_kind == 'journal'
        env:
          AFTER_UPLOAD_ACTION: ${{ steps.initialize.outputs.after_upload_action }}
          ARTIFACT_NAME: ${{ steps.initialize.outputs.journal_artifact_name }}
          NEXT_ACTION: ${{ steps.initialize.outputs.next_action }}
          TRANSITION_KIND: ${{ steps.initialize.outputs.transition_kind }}
        run: |
          set -euo pipefail
          test "$TRANSITION_KIND" = journal
          test "$NEXT_ACTION" = upload-journal
          test "$AFTER_UPLOAD_ACTION" = dispatch
          test "$ARTIFACT_NAME" != none
      - name: Stage initialized recovery journal under its canonical artifact basename
        if: >-
          steps.journal-presence.outputs.has_journal == 'true' &&
          steps.initialize.outputs.transition_kind == 'journal'
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/recovery-initialized-artifact"
          install -m 0600 "$RUNNER_TEMP/recovery-initialized-journal.json" "$RUNNER_TEMP/recovery-initialized-artifact/main-journal.json"
      - name: Upload initialized recovery journal
        id: upload-initialized
        if: >-
          steps.journal-presence.outputs.has_journal == 'true' &&
          steps.initialize.outputs.transition_kind == 'journal'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
