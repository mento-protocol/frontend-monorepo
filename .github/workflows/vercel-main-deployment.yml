  activate-and-verify:
    name: Verify staged candidates and activate release
    needs:
      [
        wait-for-ci,
        require-ci-success,
        prepare-release,
        stage-app,
        stage-governance,
        stage-reserve,
        stage-ui,
      ]
    if: >-
      always() && !cancelled() &&
      needs.require-ci-success.result == 'success' &&
      needs.prepare-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: vercel-cli-production
      deployment: false # trunk-ignore(actionlint/syntax-check): Pinned actionlint has not learned GitHub's deployment key.
    outputs:
      outcome: ${{ steps.outcome.outputs.outcome }}
      receipt: ${{ steps.terminal.outputs.receipt }}
      evidence: ${{ steps.terminal.outputs.evidence }}
    env:
      DEPLOY_SHA: ${{ needs.wait-for-ci.outputs.deploy_sha }}
      UPSTREAM_RUN_ID: ${{ needs.wait-for-ci.outputs.upstream_run_id }}
      UPSTREAM_RUN_ATTEMPT: ${{ needs.wait-for-ci.outputs.upstream_run_attempt }}
      UPSTREAM_RUN_URL: ${{ needs.wait-for-ci.outputs.upstream_run_url }}
      BUILD_AND_TEST_JOB_URL: ${{ needs.require-ci-success.outputs.build_and_test_job_url }}
      MAIN_RELEASE_EXECUTION: ${{ needs.prepare-release.outputs.execution }}
      VERCEL_PROJECT_ID_APP: ${{ vars.VERCEL_PROJECT_ID_APP }}
      VERCEL_PROJECT_ID_GOVERNANCE: ${{ vars.VERCEL_PROJECT_ID_GOVERNANCE }}
      VERCEL_PROJECT_ID_RESERVE: ${{ vars.VERCEL_PROJECT_ID_RESERVE }}
      VERCEL_PROJECT_ID_UI: ${{ vars.VERCEL_PROJECT_ID_UI }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            fetch-depth: 1,
            persist-credentials: false,
            ref: "${{ github.workflow_sha }}",
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            fetch-depth: 0,
            path: source,
            persist-credentials: false,
            ref: "${{ needs.wait-for-ci.outputs.deploy_sha }}",
          }
      - name: Prove exact admitted activation source
        env:
          { GITHUB_WORKFLOW_SHA: "${{ needs.wait-for-ci.outputs.deploy_sha }}" }
        run: |
          git -C "$SOURCE_PATH" fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/vercel-main-deployment.mjs validate-source
      - name: Install exact activation source without lifecycle scripts
        uses: ./.github/actions/pnpm-install
        with:
          {
            working-directory: source,
            ignore-scripts: "true",
            filter: frontend-monorepo,
          }
      - name: Materialize execution and private coordinator artifacts
        run: |
          set -euo pipefail
          umask 077
          node scripts/vercel-main-release-cli.mjs materialize --output "$RUNNER_TEMP/execution.json"
          jq -e '.manifest' "$RUNNER_TEMP/execution.json" > "$RUNNER_TEMP/manifest.json"
          printf 'null\n' > "$RUNNER_TEMP/null.json"
          printf '[]\n' > "$RUNNER_TEMP/empty-history.json"
          node scripts/vercel-main-deployment.mjs create-spec --scope main --output "$RUNNER_TEMP/main-spec.json"
          node scripts/vercel-main-deployment.mjs create-spec --scope legacy --output "$RUNNER_TEMP/legacy-spec.json"
      - name: Validate literal stage results, receipts, and App payload identity
        env:
          APP_ACTION: ${{ needs.stage-app.outputs.action || 'none' }}
          APP_ACTIVE: ${{ contains(fromJSON(needs.prepare-release.outputs.active_targets), 'app') }}
          APP_PAYLOAD_ATTEMPT: ${{ needs.stage-app.outputs.payload_attempt || 'none' }}
          APP_PAYLOAD_SHA256: ${{ needs.stage-app.outputs.payload_sha256 || 'none' }}
          APP_RESULT: ${{ needs.stage-app.result }}
          APP_SELECTED: ${{ contains(fromJSON(needs.prepare-release.outputs.targets), 'app') }}
          GOVERNANCE_RECEIPT: ${{ needs.stage-governance.outputs.receipt || 'none' }}
          GOVERNANCE_RESULT: ${{ needs.stage-governance.result }}
          GOVERNANCE_SELECTED: ${{ contains(fromJSON(needs.prepare-release.outputs.targets), 'governance') }}
          RESERVE_RECEIPT: ${{ needs.stage-reserve.outputs.receipt || 'none' }}
          RESERVE_RESULT: ${{ needs.stage-reserve.result }}
          RESERVE_SELECTED: ${{ contains(fromJSON(needs.prepare-release.outputs.targets), 'reserve') }}
          UI_RECEIPT: ${{ needs.stage-ui.outputs.receipt || 'none' }}
          UI_RESULT: ${{ needs.stage-ui.result }}
          UI_SELECTED: ${{ contains(fromJSON(needs.prepare-release.outputs.targets), 'ui') }}
        run: |
          set -euo pipefail
          validate_stage() {
            local target="$1"
            local selected="$2"
            local result="$3"
            local receipt="$4"
            if [ "$selected" = true ]; then
              test "$result" = success
              test "$receipt" != none
            else
              test "$result" = skipped
              test "$receipt" = none
            fi
          }
          validate_stage governance "$GOVERNANCE_SELECTED" "$GOVERNANCE_RESULT" "$GOVERNANCE_RECEIPT"
          validate_stage reserve "$RESERVE_SELECTED" "$RESERVE_RESULT" "$RESERVE_RECEIPT"
          validate_stage ui "$UI_SELECTED" "$UI_RESULT" "$UI_RECEIPT"
          # App stages a build, never a provider deployment, so its expectation
          # is a literal graph rather than a candidate receipt:
          #   unselected            -> skipped, no action, no payload
          #   active and `create`   -> success, payload from this exact attempt
          #   active and `reuse`    -> success, no payload
          #   shadow only           -> success, payload from this exact attempt
          if [ "$APP_SELECTED" = true ]; then
            test "$APP_RESULT" = success
            if [ "$APP_ACTIVE" = true ]; then
              case "$APP_ACTION" in
                create | reuse) ;;
                *) exit 1 ;;
              esac
            else
              test "$APP_ACTION" = none
            fi
            if [ "$APP_ACTION" = reuse ]; then
              test "$APP_PAYLOAD_SHA256" = none
              test "$APP_PAYLOAD_ATTEMPT" = none
            else
              test "${#APP_PAYLOAD_SHA256}" -eq 64
              case "$APP_PAYLOAD_SHA256" in
                *[!0-9a-f]*) exit 1 ;;
              esac
              test "$APP_PAYLOAD_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
            fi
          else
            test "$APP_RESULT" = skipped
            test "$APP_ACTION" = none
            test "$APP_PAYLOAD_SHA256" = none
            test "$APP_PAYLOAD_ATTEMPT" = none
          fi
      - name: Capture a fresh legacy proof for every successful terminal route
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: >-
          node scripts/vercel-deployment-state.mjs snapshot
          --spec "$RUNNER_TEMP/legacy-spec.json"
          --output "$RUNNER_TEMP/route-legacy.json"
      - name: Check remote main freshness before App preparation
        if: needs.prepare-release.outputs.no_target != 'true'
        id: freshness
        run: >-
          node scripts/vercel-main-deployment.mjs active-freshness
          --output "$RUNNER_TEMP/preparation-freshness.json"
      - name: Materialize no-target terminal artifacts without a journal
        if: needs.prepare-release.outputs.no_target == 'true'
        id: no-target-terminal
        run: |
          node scripts/vercel-main-release-cli.mjs terminal-artifacts \
            --active-evidence-output "$RUNNER_TEMP/active-evidence.json" \
            --execution "$RUNNER_TEMP/execution.json" \
            --final-census "$RUNNER_TEMP/null.json" \
            --final-mappings "$RUNNER_TEMP/null.json" \
            --freshness "$RUNNER_TEMP/null.json" \
            --journal-history "$RUNNER_TEMP/empty-history.json" \
            --legacy-v2 "$RUNNER_TEMP/route-legacy.json" \
            --outcome no-target \
            --proofs-output "$RUNNER_TEMP/terminal-proofs.json" \
            --public-smokes "$RUNNER_TEMP/null.json" \
            --stage-results "$RUNNER_TEMP/null.json" \
            --state-proof "$RUNNER_TEMP/null.json"
          echo "outcome=no-target" >> "$GITHUB_OUTPUT"
      - name: Materialize superseded terminal artifacts without a journal
        if: steps.freshness.outputs.status == 'superseded'
        id: superseded-terminal
        run: |
          node scripts/vercel-main-release-cli.mjs terminal-artifacts \
            --active-evidence-output "$RUNNER_TEMP/active-evidence.json" \
            --execution "$RUNNER_TEMP/execution.json" \
            --final-census "$RUNNER_TEMP/null.json" \
            --final-mappings "$RUNNER_TEMP/null.json" \
            --freshness "$RUNNER_TEMP/preparation-freshness.json" \
            --journal-history "$RUNNER_TEMP/empty-history.json" \
            --legacy-v2 "$RUNNER_TEMP/route-legacy.json" \
            --outcome superseded-before-journal \
            --proofs-output "$RUNNER_TEMP/terminal-proofs.json" \
            --public-smokes "$RUNNER_TEMP/null.json" \
            --stage-results "$RUNNER_TEMP/null.json" \
            --state-proof "$RUNNER_TEMP/null.json"
          echo "outcome=superseded-before-journal" >> "$GITHUB_OUTPUT"
      - name: Prepare protected activation runtime independent of App reuse
        if: >-
          steps.freshness.outputs.status == 'fresh' &&
          (needs.prepare-release.outputs.has_active_targets == 'true' ||
          contains(fromJSON(needs.prepare-release.outputs.targets), 'app'))
        id: app-runtime
        uses: ./.github/actions/vercel-protected-runtime
        with:
          {
            operation: prepare,
            logical-target: app,
            controller-path: "${{ github.workspace }}",
            source-path: "${{ github.workspace }}/source",
          }
      - name: Verify pinned activation prerequisites
        if: >-
          steps.freshness.outputs.status == 'fresh' &&
          (needs.prepare-release.outputs.has_active_targets == 'true' ||
          contains(fromJSON(needs.prepare-release.outputs.targets), 'app'))
        run: ${{ steps.app-runtime.outputs.node-bin }} scripts/vercel-prebuilt.mjs check-versions --repo-root "$SOURCE_PATH"
      - name: Create App current-attempt build intent
        if: >-
          steps.freshness.outputs.status == 'fresh' &&
          contains(fromJSON(needs.prepare-release.outputs.targets), 'app')
        id: app-intent
        run: |
          node scripts/vercel-main-deployment.mjs candidate-intent --execution "$RUNNER_TEMP/execution.json" --target app --output "$RUNNER_TEMP/app-intent.json"
      - name: Bind the App stage candidate to this attempt's intent
        if: >-
          steps.freshness.outputs.status == 'fresh' &&
          contains(fromJSON(needs.prepare-release.outputs.targets), 'app')
        env:
          INTENT_CANDIDATE_ID: ${{ steps.app-intent.outputs.candidate_id }}
          STAGE_CANDIDATE_ID: ${{ needs.stage-app.outputs.candidate_id }}
        run: |
          set -euo pipefail
          test -n "$INTENT_CANDIDATE_ID"
          test "$INTENT_CANDIDATE_ID" = "$STAGE_CANDIDATE_ID"
      - name: Download the exact current-attempt App custom-v3 payload
        if: >-
          steps.freshness.outputs.status == 'fresh' &&
          needs.stage-app.outputs.payload_sha256 != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ needs.stage-app.outputs.payload_artifact }}
          path: ${{ runner.temp }}/app-v3-payload
          run-id: ${{ github.run_id }}
      - name: Verify and materialize the exact App custom-v3 payload
        if: >-
          steps.freshness.outputs.status == 'fresh' &&
          needs.stage-app.outputs.payload_sha256 != ''
        id: app-payload
        env:
          EXPECTED_BYTES: ${{ needs.stage-app.outputs.payload_bytes }}
          EXPECTED_SHA256: ${{ needs.stage-app.outputs.payload_sha256 }}
          ISOLATION_ROOT: ${{ steps.app-runtime.outputs.isolation-root }}
          UPLOAD_SOURCE_PATH: ${{ steps.app-runtime.outputs.upload-source-path }}
        run: |
          set -euo pipefail
          umask 022
          upload_name=mento-vercel-production-upload-source
          provenance_name="$upload_name.provenance.json"
          payload="$RUNNER_TEMP/app-v3-payload/app-v3-output.tar"
          case "$EXPECTED_SHA256" in
            *[!0-9a-f]*) exit 1 ;;
          esac
          test "${#EXPECTED_SHA256}" -eq 64
          case "$EXPECTED_BYTES" in
            '' | *[!0-9]*) exit 1 ;;
          esac
          test "$EXPECTED_BYTES" -gt 0
          test -n "$ISOLATION_ROOT"
          test "$UPLOAD_SOURCE_PATH" = "$ISOLATION_ROOT/$upload_name"
          test ! -L "$payload"
          test -f "$payload"
          test "$(stat -c %s "$payload")" = "$EXPECTED_BYTES"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$payload" |
            sha256sum --check --strict --status
          for fresh_path in "$UPLOAD_SOURCE_PATH" "$UPLOAD_SOURCE_PATH.provenance.json"; do
            if [ -e "$fresh_path" ] || [ -L "$fresh_path" ]; then
              echo "App custom-v3 payload destination is not fresh" >&2
              exit 1
            fi
          done
          tar \
            --extract \
            --file "$payload" \
            --directory "$ISOLATION_ROOT" \
            --preserve-permissions \
            --no-same-owner \
            --no-xattrs \
            --no-acls \
            --no-selinux \
            -- "$upload_name" "$provenance_name"
          while IFS= read -r entry; do
            case "$entry" in
              mento-vercel-trusted-tools | \
                mento-vercel-npm-cache | \
                mento-vercel-npm-home | \
                mento-vercel-pnpm-bootstrap | \
                mento-vercel-npm-tmp | \
                "$upload_name" | \
                "$provenance_name") ;;
              *)
                echo "Unexpected protected work entry after payload extraction: $entry" >&2
                exit 1
                ;;
            esac
          done < <(
            find "$ISOLATION_ROOT" -mindepth 1 -maxdepth 1 -printf '%f\n' |
              LC_ALL=C sort
          )
          rm -f -- "$payload"
