        run: ${{ steps.runtime.outputs.node-bin }} "$TRUSTED_POST_BUILD_PATH/scripts/vercel-production-shadow.mjs" deploy --candidate-metadata "$RUNNER_TEMP/ui-candidate-metadata.json" --expected "$RUNNER_TEMP/ui-deployment-expectation.json"
      - name: Freshly smoke and finalize UI candidate
        id: finalize
        env:
          {
            VERCEL_ORG_ID: "${{ vars.VERCEL_ORG_ID }}",
