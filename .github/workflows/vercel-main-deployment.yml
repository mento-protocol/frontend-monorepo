          "${{ steps.runtime.outputs.node-bin }}" "$TRUSTED_POST_BUILD_PATH/scripts/vercel-deployment-state.mjs" snapshot --spec "$RUNNER_TEMP/final-legacy-spec.json" --output "$RUNNER_TEMP/final-legacy.json"
          "${{ steps.runtime.outputs.node-bin }}" "$TRUSTED_POST_BUILD_PATH/scripts/vercel-main-deployment.mjs" revalidate-prior --planning-snapshot "$RUNNER_TEMP/final-main.json" --legacy-snapshot "$RUNNER_TEMP/final-legacy.json"

      - name: Measure UI runner duration
        id: total
        env:
          STARTED_AT_MS: ${{ steps.timing.outputs.started_at_ms }}
        run: echo "total_duration_ms=$(($(date +%s%3N) - STARTED_AT_MS))" >> "$GITHUB_OUTPUT"

      - name: Emit UI stage handoff
        id: handoff
        env:
          IMMUTABLE_SMOKE_PASSED: "true"
          PROTECTED_MAPPINGS_UNCHANGED: "true"
        run: >-
          node scripts/vercel-main-deployment.mjs stage-result
          --state "$RUNNER_TEMP/ui-state.json"
          --output "$RUNNER_TEMP/ui-stage.json"

      - name: Upload UI browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vercel-main-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: trusted-after-build/apps/app.mento.org/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove authenticated UI runtime
        if: ${{ always() }}
        uses: ./.github/actions/vercel-protected-runtime
        with:
          operation: cleanup
          logical-target: ui

  activate-and-verify:
    name: Activate GitHub-owned main deployments
    if: ${{ always() }}
    needs:
      - wait-for-ci
      - plan-main-deployments
      - stage-governance
      - stage-reserve
      - stage-ui
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: vercel-cli-production
      deployment: false # trunk-ignore(actionlint/syntax-check): Pinned actionlint has not learned GitHub's deployment key.
    outputs:
      outcome: ${{ steps.outcome.outputs.outcome }}
      artifact_name: ${{ steps.active-initialize.outputs.journal_artifact_name }}
      artifact_id: ${{ steps.active-initial-upload.outputs.artifact-id }}
      transaction_id: ${{ steps.active-initialize.outputs.transaction_id }}
      app_next_deployment_id: ${{ steps.app-identity.outputs.next_deployment_id }}
      app_build_duration_ms: ${{ steps.app-build.outputs.build_duration_ms }}
      app_turbo_cache_hits: ${{ steps.app-build.outputs.turbo_cache_hits }}
      app_turbo_cache_misses: ${{ steps.app-build.outputs.turbo_cache_misses }}
      app_total_duration_ms: ${{ steps.app-total.outputs.total_duration_ms }}
      total_duration_ms: ${{ steps.total.outputs.total_duration_ms }}
    env:
      DEPLOY_SHA: ${{ needs.wait-for-ci.outputs.deploy_sha }}
      PLAN_JSON: ${{ needs.plan-main-deployments.outputs.plan }}
      STAGE_GOVERNANCE_RESULT: ${{ needs.stage-governance.result }}
      STAGE_GOVERNANCE_HANDOFF: ${{ needs.stage-governance.outputs.handoff }}
      STAGE_RESERVE_RESULT: ${{ needs.stage-reserve.result }}
      STAGE_RESERVE_HANDOFF: ${{ needs.stage-reserve.outputs.handoff }}
      STAGE_UI_RESULT: ${{ needs.stage-ui.result }}
      STAGE_UI_HANDOFF: ${{ needs.stage-ui.outputs.handoff }}
      VERCEL_PROJECT_ID_APP: ${{ vars.VERCEL_PROJECT_ID_APP }}
      VERCEL_PROJECT_ID_GOVERNANCE: ${{ vars.VERCEL_PROJECT_ID_GOVERNANCE }}
      VERCEL_PROJECT_ID_RESERVE: ${{ vars.VERCEL_PROJECT_ID_RESERVE }}
      VERCEL_PROJECT_ID_UI: ${{ vars.VERCEL_PROJECT_ID_UI }}
    steps:
      - name: Start coordinator runner timing
        id: timing
        run: echo "started_at_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"

      - name: Check out trusted coordinator
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.wait-for-ci.outputs.deploy_sha }}

      - name: Bind every selected stage to this exact attempt
        id: stages
        run: node scripts/vercel-main-deployment.mjs validate-stages

      - name: Check freshness before any App work
        if: steps.stages.outputs.outcome == 'eligible'
        id: freshness
        run: node scripts/vercel-main-deployment.mjs freshness

      - name: Check out exact coordinator source
        if: steps.freshness.outputs.status == 'fresh'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false
          ref: ${{ needs.wait-for-ci.outputs.deploy_sha }}

      - name: Prove exact coordinator source
        if: steps.freshness.outputs.status == 'fresh'
        env:
          GITHUB_WORKFLOW_SHA: ${{ needs.wait-for-ci.outputs.deploy_sha }}
        run: |
          git -C "$SOURCE_PATH" fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/vercel-main-deployment.mjs validate-source

      - name: Re-inspect every protected mapping before App preparation
        if: steps.freshness.outputs.status == 'fresh'
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: |
          node scripts/vercel-main-deployment.mjs create-spec --scope main --output "$RUNNER_TEMP/coordinator-main-spec.json"
          node scripts/vercel-main-deployment.mjs create-spec --scope legacy --output "$RUNNER_TEMP/coordinator-legacy-spec.json"
          node scripts/vercel-deployment-state.mjs planning-snapshot --spec "$RUNNER_TEMP/coordinator-main-spec.json" --output "$RUNNER_TEMP/coordinator-main.json"
          node scripts/vercel-deployment-state.mjs snapshot --spec "$RUNNER_TEMP/coordinator-legacy-spec.json" --output "$RUNNER_TEMP/coordinator-legacy.json"
          node scripts/vercel-main-deployment.mjs revalidate-prior --planning-snapshot "$RUNNER_TEMP/coordinator-main.json" --legacy-snapshot "$RUNNER_TEMP/coordinator-legacy.json"

      - name: Start App runner timing
        if: >-
          steps.freshness.outputs.status == 'fresh' &&
          contains(fromJSON(needs.plan-main-deployments.outputs.targets), 'app')
        id: app-timing
        run: echo "started_at_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"

      - name: Prepare protected active-operation runtime
        if: >-
          steps.freshness.outputs.status == 'fresh' &&
          (contains(fromJSON(needs.plan-main-deployments.outputs.targets), 'app') ||
          contains(fromJSON(needs.plan-main-deployments.outputs.targets), 'governance') ||
          contains(fromJSON(needs.plan-main-deployments.outputs.targets), 'reserve') ||
          contains(fromJSON(needs.plan-main-deployments.outputs.targets), 'ui'))
        id: app-runtime
        uses: ./.github/actions/vercel-protected-runtime
        with:
          operation: prepare
          logical-target: app
          controller-path: ${{ github.workspace }}
          source-path: ${{ github.workspace }}/source

      - name: Verify pinned App prerequisites
        if: steps.app-runtime.outcome == 'success'
        run: ${{ steps.app-runtime.outputs.node-bin }} scripts/vercel-prebuilt.mjs check-versions --repo-root "$SOURCE_PATH"

      - name: Prepare runner-owned App pull staging
        if: >-
          steps.app-runtime.outcome == 'success' &&
          contains(fromJSON(needs.plan-main-deployments.outputs.targets), 'app')
        env:
          LOGICAL_TARGET: app
          PULL_STAGING_PATH: ${{ steps.app-runtime.outputs.pull-staging-path }}
          SOURCE_PATH: ${{ steps.app-runtime.outputs.pull-staging-path }}
          VERCEL_ISOLATION_ROOT: ${{ steps.app-runtime.outputs.isolation-root }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_APP }}
        run: ${{ steps.app-runtime.outputs.node-bin }} scripts/vercel-production-shadow.mjs prepare-pull-staging

      - name: Pull App custom-v3 configuration
        if: >-
          steps.app-runtime.outcome == 'success' &&
          contains(fromJSON(needs.plan-main-deployments.outputs.targets), 'app')
        env:
          LOGICAL_TARGET: app
          SOURCE_PATH: ${{ steps.app-runtime.outputs.pull-staging-path }}
          TRUSTED_NODE_PATH: ${{ steps.app-runtime.outputs.node-bin }}
          TRUSTED_VERCEL_CLI_PATH: ${{ steps.app-runtime.outputs.vercel-cli }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_APP }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: ${{ steps.app-runtime.outputs.node-bin }} scripts/vercel-production-shadow.mjs pull

      - name: Validate App custom-v3 project and Root Directory
        if: >-
          steps.app-runtime.outcome == 'success' &&
          contains(fromJSON(needs.plan-main-deployments.outputs.targets), 'app')
        env:
          LOGICAL_TARGET: app
          PULL_STAGING_PATH: ${{ steps.app-runtime.outputs.pull-staging-path }}
          SOURCE_PATH: ${{ steps.app-runtime.outputs.pull-staging-path }}
          VERCEL_ISOLATION_ROOT: ${{ steps.app-runtime.outputs.isolation-root }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_APP }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: |
          "${{ steps.app-runtime.outputs.node-bin }}" scripts/vercel-production-shadow.mjs validate-pull-staging
          "${{ steps.app-runtime.outputs.node-bin }}" scripts/vercel-deployment-state.mjs project --project-id "$VERCEL_PROJECT_ID" --project-name app.mento.org --root-directory apps/app.mento.org

      - name: Generate exact App custom deployment identity
        if: >-
          steps.app-runtime.outcome == 'success' &&
          contains(fromJSON(needs.plan-main-deployments.outputs.targets), 'app')
        id: app-identity
        run: |
          next_deployment_id="$("${{ steps.app-runtime.outputs.node-bin }}" scripts/vercel-prebuilt.mjs deployment-id --target app --sha "$DEPLOY_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT")"
          echo "next_deployment_id=$next_deployment_id" >> "$GITHUB_OUTPUT"

      - name: Build App custom-v3 candidate without deployment
        if: >-
          steps.app-runtime.outcome == 'success' &&
          contains(fromJSON(needs.plan-main-deployments.outputs.targets), 'app')
        id: app-build
        env:
          CI: 1
          LOGICAL_TARGET: app
          MENTO_NEXT_DEPLOYMENT_ID: ${{ steps.app-identity.outputs.next_deployment_id }}
          NEXT_PUBLIC_VERCEL_ENV: preview
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          VERCEL: 1
          VERCEL_ENV: preview
          VERCEL_GIT_COMMIT_REF: main
          VERCEL_GIT_COMMIT_SHA: ${{ needs.wait-for-ci.outputs.deploy_sha }}
          VERCEL_GIT_PROVIDER: github
          VERCEL_GIT_REPO_OWNER: mento-protocol
          VERCEL_GIT_REPO_SLUG: frontend-monorepo
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_APP }}
          VERCEL_TARGET_ENV: v3
        uses: ./.github/actions/vercel-candidate-build
        with:
          controller-path: ${{ github.workspace }}
          source-path: ${{ github.workspace }}/source
          runtime-root: ${{ steps.app-runtime.outputs.runtime-root }}
          isolation-root: ${{ steps.app-runtime.outputs.isolation-root }}
          runtime-marker: ${{ steps.app-runtime.outputs.runtime-marker }}
          tools-path: ${{ steps.app-runtime.outputs.tools-path }}
          build-environment-path: ${{ steps.app-runtime.outputs.build-environment-path }}
          candidate-source-path: ${{ steps.app-runtime.outputs.candidate-source-path }}
          candidate-home-path: ${{ steps.app-runtime.outputs.candidate-home-path }}
          pull-staging-path: ${{ steps.app-runtime.outputs.pull-staging-path }}
          candidate-identity-marker: ${{ steps.app-runtime.outputs.candidate-identity-marker }}
          build-log-path: ${{ steps.app-runtime.outputs.build-log-path }}
          provenance-path: ${{ steps.app-runtime.outputs.provenance-path }}
          upload-source-path: ${{ steps.app-runtime.outputs.upload-source-path }}
          node-bin: ${{ steps.app-runtime.outputs.node-bin }}
          pnpm-bin: ${{ steps.app-runtime.outputs.pnpm-bin }}
          vercel-cli: ${{ steps.app-runtime.outputs.vercel-cli }}
          deploy-sha: ${{ needs.wait-for-ci.outputs.deploy_sha }}
          next-deployment-id: ${{ steps.app-identity.outputs.next_deployment_id }}
          logical-target: app
          expected-root-directory: apps/app.mento.org
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_APP }}

      - name: Restore fresh trusted transaction controller
        if: steps.freshness.outputs.status == 'fresh'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          path: trusted-coordinator
          persist-credentials: false
          ref: ${{ needs.wait-for-ci.outputs.deploy_sha }}

      - name: Record exact App build-only proof
        if: >-
          steps.app-build.outcome == 'success' &&
          contains(fromJSON(needs.plan-main-deployments.outputs.targets), 'app')
        id: app-proof
        env:
          MENTO_NEXT_DEPLOYMENT_ID: ${{ steps.app-identity.outputs.next_deployment_id }}
        run: >-
          node trusted-coordinator/scripts/vercel-main-deployment.mjs
          app-build-proof --output "$RUNNER_TEMP/app-build-proof.json"

      - name: Measure App runner duration
        if: >-
          steps.app-proof.outcome == 'success' &&
          contains(fromJSON(needs.plan-main-deployments.outputs.targets), 'app')
        id: app-total
        env:
          STARTED_AT_MS: ${{ steps.app-timing.outputs.started_at_ms }}
        run: echo "total_duration_ms=$(($(date +%s%3N) - STARTED_AT_MS))" >> "$GITHUB_OUTPUT"

      - name: Persist the immutable App build proof for active transitions
        if: >-
          steps.app-proof.outcome == 'success' &&
          contains(fromJSON(needs.plan-main-deployments.outputs.targets), 'app')
        env:
          APP_BUILD_PROOF: ${{ steps.app-proof.outputs.proof }}
        run: printf 'APP_BUILD_PROOF=%s\n' "$APP_BUILD_PROOF" >> "$GITHUB_ENV"

      - name: Initialize an empty active journal history
        if: >-
          steps.freshness.outputs.status == 'fresh' &&
          (contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'app') ||
          contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'governance') ||
          contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'reserve') ||
          contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'ui'))
        run: |
          install -d -m 0700 "$RUNNER_TEMP/vercel-main-active-journals"
          printf '[]\n' > "$RUNNER_TEMP/vercel-main-active-journals/current-history.json"

      - name: Create the durable active journal
        if: >-
          steps.freshness.outputs.status == 'fresh' &&
          (contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'app') ||
          contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'governance') ||
          contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'reserve') ||
          contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'ui'))
        id: active-initialize
        run: |
          node trusted-coordinator/scripts/vercel-main-deployment.mjs active-event-initialize --output "$RUNNER_TEMP/active-initialize-event.json"
          node trusted-coordinator/scripts/vercel-main-deployment.mjs run-active --event "$RUNNER_TEMP/active-initialize-event.json" --journal-history "$RUNNER_TEMP/vercel-main-active-journals/current-history.json" --journal-output "$RUNNER_TEMP/active-initialize-journal.json" --output "$RUNNER_TEMP/active-initialize-transition.json"

      - name: Upload the prepared active journal
        if: steps.active-initialize.outcome == 'success'
        id: active-initial-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.active-initialize.outputs.journal_artifact_name }}
          path: ${{ runner.temp }}/active-initialize-journal.json
          if-no-files-found: error
          retention-days: 7

      - name: Checkpoint the uploaded prepared active journal
        if: steps.active-initial-upload.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.active-initial-upload.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.active-initialize.outputs.journal_artifact_name }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/vercel-main-active-journals/$ARTIFACT_NAME"
          install -m 0600 "$RUNNER_TEMP/active-initialize-journal.json" "$RUNNER_TEMP/vercel-main-active-journals/$ARTIFACT_NAME/main-journal.json"
          node trusted-coordinator/scripts/vercel-main-deployment.mjs active-journal-history --artifacts "$RUNNER_TEMP/vercel-main-active-journals" --output "$RUNNER_TEMP/active-initialize-history.json"
          node trusted-coordinator/scripts/vercel-main-deployment.mjs active-journal-receipt --journal "$RUNNER_TEMP/active-initialize-journal.json" --artifact-name "$ARTIFACT_NAME" --artifact-id "$ARTIFACT_ID" --output "$RUNNER_TEMP/active-initialize-receipt.json"
          install -m 0600 "$RUNNER_TEMP/active-initialize-history.json" "$RUNNER_TEMP/vercel-main-active-journals/current-history.json"
          install -m 0600 "$RUNNER_TEMP/active-initialize-journal.json" "$RUNNER_TEMP/vercel-main-active-journals/current-journal.json"
          install -m 0600 "$RUNNER_TEMP/active-initialize-receipt.json" "$RUNNER_TEMP/vercel-main-active-journals/current-receipt.json"

      - name: Advance Governance promotion through durable active transitions
        if: >-
          steps.active-initial-upload.outcome == 'success' &&
          contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'governance')
        uses: ./.github/actions/vercel-main-active-transition
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        with:
          app-verification: "false"
          controller-path: ${{ github.workspace }}/trusted-coordinator
          journal-directory: ${{ runner.temp }}/vercel-main-active-journals
          operation-cwd: ${{ github.workspace }}/source
          slot: governance
          vercel-cli: ${{ steps.app-runtime.outputs.vercel-cli }}

      - name: Advance Reserve promotion through durable active transitions
        if: >-
          steps.active-initial-upload.outcome == 'success' &&
          contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'reserve')
        uses: ./.github/actions/vercel-main-active-transition
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        with:
          app-verification: "false"
          controller-path: ${{ github.workspace }}/trusted-coordinator
          journal-directory: ${{ runner.temp }}/vercel-main-active-journals
          operation-cwd: ${{ github.workspace }}/source
          slot: reserve
          vercel-cli: ${{ steps.app-runtime.outputs.vercel-cli }}

      - name: Advance UI promotion through durable active transitions
        if: >-
          steps.active-initial-upload.outcome == 'success' &&
          contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'ui')
        uses: ./.github/actions/vercel-main-active-transition
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        with:
          app-verification: "false"
          controller-path: ${{ github.workspace }}/trusted-coordinator
          journal-directory: ${{ runner.temp }}/vercel-main-active-journals
          operation-cwd: ${{ github.workspace }}/source
          slot: ui
          vercel-cli: ${{ steps.app-runtime.outputs.vercel-cli }}

      - name: Advance App v3 deployment through durable active transitions
        if: >-
          steps.active-initial-upload.outcome == 'success' &&
          contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'app')
        uses: ./.github/actions/vercel-main-active-transition
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        with:
          app-verification: "true"
          controller-path: ${{ github.workspace }}/trusted-coordinator
          journal-directory: ${{ runner.temp }}/vercel-main-active-journals
          operation-cwd: ${{ steps.app-runtime.outputs.upload-source-path }}
          slot: app-deploy
          vercel-cli: ${{ steps.app-runtime.outputs.vercel-cli }}

      - name: Advance App public alias through durable active transitions
        if: >-
          steps.active-initial-upload.outcome == 'success' &&
          contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'app')
        uses: ./.github/actions/vercel-main-active-transition
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        with:
          app-verification: "false"
          controller-path: ${{ github.workspace }}/trusted-coordinator
          journal-directory: ${{ runner.temp }}/vercel-main-active-journals
          operation-cwd: ${{ github.workspace }}/source
          slot: app-public-alias
          vercel-cli: ${{ steps.app-runtime.outputs.vercel-cli }}

      - name: Advance App generated alias through durable active transitions
        if: >-
          steps.active-initial-upload.outcome == 'success' &&
          contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'app')
        uses: ./.github/actions/vercel-main-active-transition
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        with:
          app-verification: "false"
          controller-path: ${{ github.workspace }}/trusted-coordinator
          journal-directory: ${{ runner.temp }}/vercel-main-active-journals
          operation-cwd: ${{ github.workspace }}/source
          slot: app-generated-alias
          vercel-cli: ${{ steps.app-runtime.outputs.vercel-cli }}

      - name: Smoke selected App public deployment
        if: contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'app')
        env:
          LOGICAL_TARGET: app
          PUBLIC_URL: https://app.mento.org/
        run: node trusted-coordinator/scripts/vercel-main-runtime.mjs

      - name: Record selected App public smoke
        if: contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'app')
        run: >-
          node trusted-coordinator/scripts/vercel-main-deployment.mjs active-public-smoke-target
          --target app --status passed --served-sha "$DEPLOY_SHA"
          --output "$RUNNER_TEMP/active-smoke-app.json"

      - name: Record unselected App public smoke
        if: "!contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'app')"
        run: >-
          node trusted-coordinator/scripts/vercel-main-deployment.mjs active-public-smoke-target
          --target app --status not-required --served-sha none
          --output "$RUNNER_TEMP/active-smoke-app.json"

      - name: Smoke selected Governance public deployment
        if: contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'governance')
        env:
          LOGICAL_TARGET: governance
          PUBLIC_URL: https://governance.mento.org/
        run: node trusted-coordinator/scripts/vercel-main-runtime.mjs

      - name: Record selected Governance public smoke
        if: contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'governance')
        run: >-
          node trusted-coordinator/scripts/vercel-main-deployment.mjs active-public-smoke-target
          --target governance --status passed --served-sha "$DEPLOY_SHA"
          --output "$RUNNER_TEMP/active-smoke-governance.json"

      - name: Record unselected Governance public smoke
        if: "!contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'governance')"
        run: >-
          node trusted-coordinator/scripts/vercel-main-deployment.mjs active-public-smoke-target
          --target governance --status not-required --served-sha none
          --output "$RUNNER_TEMP/active-smoke-governance.json"

      - name: Smoke selected Reserve public deployment
        if: contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'reserve')
        env:
          LOGICAL_TARGET: reserve
          PUBLIC_URL: https://reserve.mento.org/
        run: node trusted-coordinator/scripts/vercel-main-runtime.mjs

      - name: Record selected Reserve public smoke
        if: contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'reserve')
        run: >-
          node trusted-coordinator/scripts/vercel-main-deployment.mjs active-public-smoke-target
          --target reserve --status passed --served-sha "$DEPLOY_SHA"
          --output "$RUNNER_TEMP/active-smoke-reserve.json"

      - name: Record unselected Reserve public smoke
        if: "!contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'reserve')"
        run: >-
          node trusted-coordinator/scripts/vercel-main-deployment.mjs active-public-smoke-target
          --target reserve --status not-required --served-sha none
          --output "$RUNNER_TEMP/active-smoke-reserve.json"

      - name: Smoke selected UI public deployment
        if: contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'ui')
        env:
          LOGICAL_TARGET: ui
          PUBLIC_URL: https://ui.mento.org/
        run: node trusted-coordinator/scripts/vercel-main-runtime.mjs

      - name: Record selected UI public smoke
        if: contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'ui')
        run: >-
          node trusted-coordinator/scripts/vercel-main-deployment.mjs active-public-smoke-target
          --target ui --status passed --served-sha "$DEPLOY_SHA"
          --output "$RUNNER_TEMP/active-smoke-ui.json"

      - name: Record unselected UI public smoke
        if: "!contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'ui')"
        run: >-
          node trusted-coordinator/scripts/vercel-main-deployment.mjs active-public-smoke-target
          --target ui --status not-required --served-sha none
          --output "$RUNNER_TEMP/active-smoke-ui.json"

      - name: Finalize active state, public smokes, and duplicate census
        if: >-
          steps.active-initial-upload.outcome == 'success' &&
          (contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'app') ||
          contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'governance') ||
          contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'reserve') ||
          contains(fromJSON(needs.plan-main-deployments.outputs.plan).activeTargets, 'ui'))
        id: active-finalize
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: |
          set -euo pipefail
          node trusted-coordinator/scripts/vercel-main-deployment.mjs active-public-smokes --app "$RUNNER_TEMP/active-smoke-app.json" --governance "$RUNNER_TEMP/active-smoke-governance.json" --reserve "$RUNNER_TEMP/active-smoke-reserve.json" --ui "$RUNNER_TEMP/active-smoke-ui.json" --output "$RUNNER_TEMP/active-public-smokes.json"
          node trusted-coordinator/scripts/vercel-main-deployment.mjs active-state-spec --journal-history "$RUNNER_TEMP/vercel-main-active-journals/current-history.json" --output "$RUNNER_TEMP/active-state-spec.json"
          node trusted-coordinator/scripts/vercel-deployment-state.mjs active-proof --spec "$RUNNER_TEMP/active-state-spec.json" --output "$RUNNER_TEMP/active-state-proof.json"
          node trusted-coordinator/scripts/vercel-main-deployment.mjs active-mapping-spec --journal-history "$RUNNER_TEMP/vercel-main-active-journals/current-history.json" --output "$RUNNER_TEMP/active-final-mapping-spec.json"
          node trusted-coordinator/scripts/vercel-deployment-state.mjs alias-mappings --spec "$RUNNER_TEMP/active-final-mapping-spec.json" --output "$RUNNER_TEMP/active-final-mappings.json"
          node trusted-coordinator/scripts/vercel-main-deployment.mjs active-freshness --output "$RUNNER_TEMP/active-final-freshness.json"
          node trusted-coordinator/scripts/vercel-main-deployment.mjs active-event-finalize --receipt "$RUNNER_TEMP/vercel-main-active-journals/current-receipt.json" --freshness "$RUNNER_TEMP/active-final-freshness.json" --current-mappings "$RUNNER_TEMP/active-final-mappings.json" --public-smokes "$RUNNER_TEMP/active-public-smokes.json" --state-proof "$RUNNER_TEMP/active-state-proof.json" --output "$RUNNER_TEMP/active-finalize-event.json"
          node trusted-coordinator/scripts/vercel-main-deployment.mjs run-active --event "$RUNNER_TEMP/active-finalize-event.json" --journal-history "$RUNNER_TEMP/vercel-main-active-journals/current-history.json" --journal-output "$RUNNER_TEMP/active-final-journal.json" --output "$RUNNER_TEMP/active-final-transition.json"

      - name: Upload the committed active journal
        if: steps.active-finalize.outcome == 'success'
        id: active-final-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.active-finalize.outputs.journal_artifact_name }}
          path: ${{ runner.temp }}/active-final-journal.json
          if-no-files-found: error
          retention-days: 7

      - name: Checkpoint the committed active journal
        if: steps.active-final-upload.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.active-final-upload.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.active-finalize.outputs.journal_artifact_name }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/vercel-main-active-journals/$ARTIFACT_NAME"
          install -m 0600 "$RUNNER_TEMP/active-final-journal.json" "$RUNNER_TEMP/vercel-main-active-journals/$ARTIFACT_NAME/main-journal.json"
          node trusted-coordinator/scripts/vercel-main-deployment.mjs active-journal-history --artifacts "$RUNNER_TEMP/vercel-main-active-journals" --output "$RUNNER_TEMP/active-final-history.json"
          node trusted-coordinator/scripts/vercel-main-deployment.mjs active-journal-receipt --journal "$RUNNER_TEMP/active-final-journal.json" --artifact-name "$ARTIFACT_NAME" --artifact-id "$ARTIFACT_ID" --output "$RUNNER_TEMP/active-final-receipt.json"
          install -m 0600 "$RUNNER_TEMP/active-final-history.json" "$RUNNER_TEMP/vercel-main-active-journals/current-history.json"
          install -m 0600 "$RUNNER_TEMP/active-final-journal.json" "$RUNNER_TEMP/vercel-main-active-journals/current-journal.json"
          install -m 0600 "$RUNNER_TEMP/active-final-receipt.json" "$RUNNER_TEMP/vercel-main-active-journals/current-receipt.json"

      - name: Write canonical redacted active deployment evidence
        if: steps.active-final-upload.outcome == 'success'
        env:
          ACTIVE_FRESHNESS_JSON: '[{"phase":"transaction-start","status":"fresh"},{"phase":"transaction-commit","status":"fresh"}]'
          ACTIVE_PUBLIC_SMOKES_FILE: ${{ runner.temp }}/active-public-smokes.json
          PUBLIC_SERVING_MUTATION_COMMANDS: ${{ steps.active-finalize.outputs.confirmed_mutation_commands }}
          RECOVERY_OUTCOME: not-required
          ROLLBACK_STATE_TARGETS_JSON: "[]"
        run: |
          set -euo pipefail
          ACTIVE_PUBLIC_SMOKES_JSON="$(<"$ACTIVE_PUBLIC_SMOKES_FILE")"
          export ACTIVE_PUBLIC_SMOKES_JSON
          node trusted-coordinator/scripts/vercel-main-deployment.mjs active-evidence --final-mappings "$RUNNER_TEMP/active-final-mappings.json" --journal-history "$RUNNER_TEMP/vercel-main-active-journals/current-history.json" --state-proof "$RUNNER_TEMP/active-state-proof.json" --output "$RUNNER_TEMP/vercel-main-evidence.json"

      - name: Upload active evidence for final result publication
        if: steps.active-final-upload.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vercel-main-active-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vercel-main-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Measure coordinator runner duration
        if: ${{ always() }}
        id: total
        env:
          STARTED_AT_MS: ${{ steps.timing.outputs.started_at_ms }}
        run: echo "total_duration_ms=$(($(date +%s%3N) - STARTED_AT_MS))" >> "$GITHUB_OUTPUT"

      - name: Publish one canonical coordinator outcome
        if: ${{ always() }}
        id: outcome
        env:
          ACTIVE_TARGET_COUNT: ${{ steps.stages.outputs.active_target_count }}
          PLANNING_OUTCOME: ${{ steps.stages.outputs.outcome }}
          FRESHNESS_STATUS: ${{ steps.freshness.outputs.status }}
          ACTIVE_FINAL_OUTCOME: ${{ steps.active-final-upload.outcome }}
        run: |
          if [ "$PLANNING_OUTCOME" = "no-target" ]; then
            echo "outcome=no-target" >> "$GITHUB_OUTPUT"
          elif [ "$FRESHNESS_STATUS" = "superseded" ]; then
            echo "outcome=superseded-before-journal" >> "$GITHUB_OUTPUT"
          elif [ "$FRESHNESS_STATUS" = "fresh" ] &&
            [ "$ACTIVE_TARGET_COUNT" = "0" ]; then
            echo "outcome=shadow-prepared" >> "$GITHUB_OUTPUT"
          elif [ "$ACTIVE_FINAL_OUTCOME" = success ]; then
            echo "outcome=active-committed" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=active-failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove authenticated App runtime
        if: ${{ always() }}
        uses: ./.github/actions/vercel-protected-runtime
        with:
          operation: cleanup
          logical-target: app

  recover-main-deployment:
    name: Recover durable active deployment journal
    if: ${{ always() }}
    needs:
      - wait-for-ci
      - plan-main-deployments
      - stage-governance
      - stage-reserve
      - stage-ui
      - activate-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 24
    environment:
      name: vercel-cli-production
      deployment: false # trunk-ignore(actionlint/syntax-check): Pinned actionlint has not learned GitHub's deployment key.
    outputs:
      outcome: ${{ steps.outcome.outputs.outcome }}
    env:
      DEPLOY_SHA: ${{ needs.wait-for-ci.outputs.deploy_sha }}
      PLAN_JSON: ${{ needs.plan-main-deployments.outputs.plan }}
      VERCEL_PROJECT_ID_APP: ${{ vars.VERCEL_PROJECT_ID_APP }}
    steps:
      - name: Check out trusted recovery controller
        if: >-
          needs.wait-for-ci.result == 'success' &&
          needs.plan-main-deployments.result == 'success'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.wait-for-ci.outputs.deploy_sha }}

      - name: Derive exact active journal identity without coordinator outputs
        if: >-
          needs.wait-for-ci.result == 'success' &&
          needs.plan-main-deployments.result == 'success' &&
          needs.activate-and-verify.outputs.outcome != 'no-target' &&
          needs.activate-and-verify.outputs.outcome != 'superseded-before-journal' &&
          needs.activate-and-verify.outputs.outcome != 'shadow-prepared'
        id: journal-identity
        run: node scripts/vercel-main-deployment.mjs active-journal-identity

      - name: Download every exact active journal snapshot without merging
        if: steps.journal-identity.outcome == 'success'
        id: journal-download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ${{ steps.journal-identity.outputs.artifact_prefix }}*
          path: ${{ runner.temp }}/main-recovery
          merge-multiple: false

      - name: Validate the highest exact active journal history
        if: steps.journal-download.outcome == 'success'
        id: journal-history
        run: >-
          node scripts/vercel-main-deployment.mjs active-journal-history
          --artifacts "$RUNNER_TEMP/main-recovery"
          --output "$RUNNER_TEMP/main-recovery-history.json"

      - name: Check out exact recovery source
        if: >-
          steps.journal-history.outcome == 'success' &&
          needs.activate-and-verify.outputs.outcome != 'active-committed'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false
          ref: ${{ needs.wait-for-ci.outputs.deploy_sha }}

      - name: Prove exact recovery source
        if: >-
          steps.journal-history.outcome == 'success' &&
          needs.activate-and-verify.outputs.outcome != 'active-committed'
        env:
          GITHUB_WORKFLOW_SHA: ${{ needs.wait-for-ci.outputs.deploy_sha }}
        run: |
          git -C "$SOURCE_PATH" fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/vercel-main-deployment.mjs validate-source

      - name: Prepare protected recovery runtime
        if: >-
          steps.journal-history.outcome == 'success' &&
          needs.activate-and-verify.outputs.outcome != 'active-committed'
        id: recovery-runtime
        uses: ./.github/actions/vercel-protected-runtime
        with:
          operation: prepare
          logical-target: app
          controller-path: ${{ github.workspace }}
          source-path: ${{ github.workspace }}/source

      - name: Materialize active recovery history and assess App candidate discovery
        if: >-
          steps.journal-history.outcome == 'success' &&
          needs.activate-and-verify.outputs.outcome != 'active-committed'
        id: recovery-preflight
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/main-recovery-current"
          install -m 0600 "$RUNNER_TEMP/main-recovery-history.json" "$RUNNER_TEMP/main-recovery-current/current-history.json"
          install -m 0600 "$RUNNER_TEMP/main-recovery/${{ steps.journal-history.outputs.highest_artifact_name }}/main-journal.json" "$RUNNER_TEMP/main-recovery-current/current-journal.json"
          node scripts/vercel-main-deployment.mjs active-journal-receipt --journal "$RUNNER_TEMP/main-recovery-current/current-journal.json" --artifact-name "${{ steps.journal-history.outputs.highest_artifact_name }}" --artifact-id 1 --output "$RUNNER_TEMP/main-recovery-current/current-receipt.json"
          node scripts/vercel-main-deployment.mjs active-mapping-spec --journal-history "$RUNNER_TEMP/main-recovery-current/current-history.json" --output "$RUNNER_TEMP/main-recovery-mapping-spec.json"
          node scripts/vercel-deployment-state.mjs alias-mappings --spec "$RUNNER_TEMP/main-recovery-mapping-spec.json" --output "$RUNNER_TEMP/main-recovery-mappings.json"
          node scripts/vercel-main-deployment.mjs active-app-candidate-matches-none --output "$RUNNER_TEMP/main-recovery-app-matches.json"
          node scripts/vercel-main-deployment.mjs plan-active-recovery --journal-history "$RUNNER_TEMP/main-recovery-current/current-history.json" --current-mappings "$RUNNER_TEMP/main-recovery-mappings.json" --app-candidate-matches "$RUNNER_TEMP/main-recovery-app-matches.json" --output "$RUNNER_TEMP/main-recovery-preflight.json"

      - name: Materialize exact App recovery candidate expectation
        if: >-
          steps.recovery-preflight.outputs.reason ==
          'app-candidate-ambiguous-after-mapping-moved'
        id: recovery-app-expectation
        run: >-
          node scripts/vercel-main-deployment.mjs app-candidate-expectation
          --journal "$RUNNER_TEMP/main-recovery-current/current-journal.json"
          --output "$RUNNER_TEMP/main-recovery-app-expectation.json"

      - name: Discover one exact moved App recovery candidate
        if: steps.recovery-app-expectation.outcome == 'success'
        id: recovery-app-candidate
        continue-on-error: true
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: >-
          node scripts/vercel-deployment-state.mjs app-candidate
          --expected "$RUNNER_TEMP/main-recovery-app-expectation.json"
          --output "$RUNNER_TEMP/main-recovery-app-candidate.json"

      - name: Materialize exact App recovery candidate matches
        if: steps.recovery-preflight.outcome == 'success'
        id: recovery-app-matches
        run: |
          set -euo pipefail
          if [ "${{ steps.recovery-app-candidate.outcome }}" = success ]; then
            node scripts/vercel-main-deployment.mjs active-app-candidate-matches-one --candidate "$RUNNER_TEMP/main-recovery-app-candidate.json" --output "$RUNNER_TEMP/main-recovery-app-matches.json"
          else
            node scripts/vercel-main-deployment.mjs active-app-candidate-matches-none --output "$RUNNER_TEMP/main-recovery-app-matches.json"
          fi

      - name: Materialize exact active recovery plan
        if: steps.recovery-app-matches.outcome == 'success'
        id: recovery-plan
        run: >-
          node scripts/vercel-main-deployment.mjs plan-active-recovery
          --journal-history "$RUNNER_TEMP/main-recovery-current/current-history.json"
          --current-mappings "$RUNNER_TEMP/main-recovery-mappings.json"
          --app-candidate-matches "$RUNNER_TEMP/main-recovery-app-matches.json"
          --output "$RUNNER_TEMP/main-recovery-plan.json"

      - name: Initialize the durable active recovery journal
        if: steps.recovery-plan.outcome == 'success'
        id: recovery-initialize
        run: |
          node scripts/vercel-main-deployment.mjs active-recovery-event-initialize --receipt "$RUNNER_TEMP/main-recovery-current/current-receipt.json" --output "$RUNNER_TEMP/main-recovery-initialize-event.json"
          node scripts/vercel-main-deployment.mjs run-active-recovery --plan "$RUNNER_TEMP/main-recovery-plan.json" --event "$RUNNER_TEMP/main-recovery-initialize-event.json" --journal-history "$RUNNER_TEMP/main-recovery-current/current-history.json" --journal-output "$RUNNER_TEMP/main-recovery-initialize-journal.json" --output "$RUNNER_TEMP/main-recovery-initialize-transition.json"

      - name: Upload initialized active recovery journal
        if: steps.recovery-initialize.outputs.journal_artifact_name != 'none'
        id: recovery-initialize-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.recovery-initialize.outputs.journal_artifact_name }}
          path: ${{ runner.temp }}/main-recovery-initialize-journal.json
          if-no-files-found: error
          retention-days: 7

      - name: Checkpoint initialized active recovery journal
        if: steps.recovery-initialize-upload.outcome == 'success'
        id: recovery-initialize-checkpoint
        env:
          ARTIFACT_ID: ${{ steps.recovery-initialize-upload.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.recovery-initialize.outputs.journal_artifact_name }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/main-recovery-current/$ARTIFACT_NAME"
          install -m 0600 "$RUNNER_TEMP/main-recovery-initialize-journal.json" "$RUNNER_TEMP/main-recovery-current/$ARTIFACT_NAME/main-journal.json"
          node scripts/vercel-main-deployment.mjs active-journal-history --artifacts "$RUNNER_TEMP/main-recovery-current" --output "$RUNNER_TEMP/main-recovery-initialize-history.json"
          node scripts/vercel-main-deployment.mjs active-journal-receipt --journal "$RUNNER_TEMP/main-recovery-initialize-journal.json" --artifact-name "$ARTIFACT_NAME" --artifact-id "$ARTIFACT_ID" --output "$RUNNER_TEMP/main-recovery-initialize-receipt.json"
          install -m 0600 "$RUNNER_TEMP/main-recovery-initialize-history.json" "$RUNNER_TEMP/main-recovery-current/current-history.json"
          install -m 0600 "$RUNNER_TEMP/main-recovery-initialize-journal.json" "$RUNNER_TEMP/main-recovery-current/current-journal.json"
          install -m 0600 "$RUNNER_TEMP/main-recovery-initialize-receipt.json" "$RUNNER_TEMP/main-recovery-current/current-receipt.json"

      - name: Initialize recovery after checkpointing discovered App candidate
        if: >-
          steps.recovery-initialize-checkpoint.outcome == 'success' &&
          steps.recovery-initialize.outputs.after_upload_action == 'initialize'
        id: recovery-reinitialize
        run: |
          node scripts/vercel-main-deployment.mjs active-recovery-event-initialize --receipt "$RUNNER_TEMP/main-recovery-current/current-receipt.json" --output "$RUNNER_TEMP/main-recovery-reinitialize-event.json"
          node scripts/vercel-main-deployment.mjs run-active-recovery --plan "$RUNNER_TEMP/main-recovery-plan.json" --event "$RUNNER_TEMP/main-recovery-reinitialize-event.json" --journal-history "$RUNNER_TEMP/main-recovery-current/current-history.json" --journal-output "$RUNNER_TEMP/main-recovery-reinitialize-journal.json" --output "$RUNNER_TEMP/main-recovery-reinitialize-transition.json"

      - name: Upload reinitialized active recovery journal
        if: steps.recovery-reinitialize.outputs.journal_artifact_name != 'none'
        id: recovery-reinitialize-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.recovery-reinitialize.outputs.journal_artifact_name }}
          path: ${{ runner.temp }}/main-recovery-reinitialize-journal.json
          if-no-files-found: error
          retention-days: 7

      - name: Checkpoint reinitialized active recovery journal
        if: steps.recovery-reinitialize-upload.outcome == 'success'
        id: recovery-reinitialize-checkpoint
        env:
          ARTIFACT_ID: ${{ steps.recovery-reinitialize-upload.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.recovery-reinitialize.outputs.journal_artifact_name }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/main-recovery-current/$ARTIFACT_NAME"
          install -m 0600 "$RUNNER_TEMP/main-recovery-reinitialize-journal.json" "$RUNNER_TEMP/main-recovery-current/$ARTIFACT_NAME/main-journal.json"
          node scripts/vercel-main-deployment.mjs active-journal-history --artifacts "$RUNNER_TEMP/main-recovery-current" --output "$RUNNER_TEMP/main-recovery-reinitialize-history.json"
          node scripts/vercel-main-deployment.mjs active-journal-receipt --journal "$RUNNER_TEMP/main-recovery-reinitialize-journal.json" --artifact-name "$ARTIFACT_NAME" --artifact-id "$ARTIFACT_ID" --output "$RUNNER_TEMP/main-recovery-reinitialize-receipt.json"
          install -m 0600 "$RUNNER_TEMP/main-recovery-reinitialize-history.json" "$RUNNER_TEMP/main-recovery-current/current-history.json"
          install -m 0600 "$RUNNER_TEMP/main-recovery-reinitialize-journal.json" "$RUNNER_TEMP/main-recovery-current/current-journal.json"
          install -m 0600 "$RUNNER_TEMP/main-recovery-reinitialize-receipt.json" "$RUNNER_TEMP/main-recovery-current/current-receipt.json"

      - name: Reverse recovery turn 1
        if: >-
          steps.recovery-initialize-checkpoint.outcome == 'success' &&
          (steps.recovery-initialize.outputs.after_upload_action == 'dispatch' ||
          steps.recovery-reinitialize-checkpoint.outcome == 'success')
        uses: ./.github/actions/vercel-main-active-recovery-transition
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        with:
          controller-path: ${{ github.workspace }}
          journal-directory: ${{ runner.temp }}/main-recovery-current
          operation-cwd: ${{ github.workspace }}/source
          recovery-plan: ${{ runner.temp }}/main-recovery-plan.json
          slot: "1"
          vercel-cli: ${{ steps.recovery-runtime.outputs.vercel-cli }}

      - name: Reverse recovery turn 2
        if: >-
          steps.recovery-initialize-checkpoint.outcome == 'success' &&
          (steps.recovery-initialize.outputs.after_upload_action == 'dispatch' ||
          steps.recovery-reinitialize-checkpoint.outcome == 'success')
        uses: ./.github/actions/vercel-main-active-recovery-transition
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        with:
          controller-path: ${{ github.workspace }}
          journal-directory: ${{ runner.temp }}/main-recovery-current
          operation-cwd: ${{ github.workspace }}/source
          recovery-plan: ${{ runner.temp }}/main-recovery-plan.json
          slot: "2"
          vercel-cli: ${{ steps.recovery-runtime.outputs.vercel-cli }}

      - name: Reverse recovery turn 3
        if: >-
          steps.recovery-initialize-checkpoint.outcome == 'success' &&
          (steps.recovery-initialize.outputs.after_upload_action == 'dispatch' ||
          steps.recovery-reinitialize-checkpoint.outcome == 'success')
        uses: ./.github/actions/vercel-main-active-recovery-transition
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        with:
          controller-path: ${{ github.workspace }}
          journal-directory: ${{ runner.temp }}/main-recovery-current
          operation-cwd: ${{ github.workspace }}/source
          recovery-plan: ${{ runner.temp }}/main-recovery-plan.json
          slot: "3"
          vercel-cli: ${{ steps.recovery-runtime.outputs.vercel-cli }}

      - name: Reverse recovery turn 4
        if: >-
          steps.recovery-initialize-checkpoint.outcome == 'success' &&
          (steps.recovery-initialize.outputs.after_upload_action == 'dispatch' ||
          steps.recovery-reinitialize-checkpoint.outcome == 'success')
        uses: ./.github/actions/vercel-main-active-recovery-transition
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        with:
          controller-path: ${{ github.workspace }}
          journal-directory: ${{ runner.temp }}/main-recovery-current
          operation-cwd: ${{ github.workspace }}/source
          recovery-plan: ${{ runner.temp }}/main-recovery-plan.json
          slot: "4"
          vercel-cli: ${{ steps.recovery-runtime.outputs.vercel-cli }}

      - name: Reverse recovery turn 5
        if: >-
          steps.recovery-initialize-checkpoint.outcome == 'success' &&
          (steps.recovery-initialize.outputs.after_upload_action == 'dispatch' ||
          steps.recovery-reinitialize-checkpoint.outcome == 'success')
        uses: ./.github/actions/vercel-main-active-recovery-transition
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        with:
          controller-path: ${{ github.workspace }}
          journal-directory: ${{ runner.temp }}/main-recovery-current
          operation-cwd: ${{ github.workspace }}/source
          recovery-plan: ${{ runner.temp }}/main-recovery-plan.json
          slot: "5"
          vercel-cli: ${{ steps.recovery-runtime.outputs.vercel-cli }}

      - name: Reverse recovery turn 6
        if: >-
          steps.recovery-initialize-checkpoint.outcome == 'success' &&
          (steps.recovery-initialize.outputs.after_upload_action == 'dispatch' ||
          steps.recovery-reinitialize-checkpoint.outcome == 'success')
        uses: ./.github/actions/vercel-main-active-recovery-transition
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        with:
          controller-path: ${{ github.workspace }}
          journal-directory: ${{ runner.temp }}/main-recovery-current
          operation-cwd: ${{ github.workspace }}/source
          recovery-plan: ${{ runner.temp }}/main-recovery-plan.json
          slot: "6"
          vercel-cli: ${{ steps.recovery-runtime.outputs.vercel-cli }}

      - name: Finalize reverse recovery after all bounded turns
        if: >-
          steps.recovery-initialize-checkpoint.outcome == 'success' &&
          (steps.recovery-initialize.outputs.after_upload_action == 'dispatch' ||
          steps.recovery-reinitialize-checkpoint.outcome == 'success')
        uses: ./.github/actions/vercel-main-active-recovery-transition
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        with:
          controller-path: ${{ github.workspace }}
          journal-directory: ${{ runner.temp }}/main-recovery-current
          operation-cwd: ${{ github.workspace }}/source
          recovery-plan: ${{ runner.temp }}/main-recovery-plan.json
          slot: final
          vercel-cli: ${{ steps.recovery-runtime.outputs.vercel-cli }}

      - name: Read the terminal durable recovery status
        if: >-
          steps.recovery-initialize-checkpoint.outcome == 'success' &&
          (steps.recovery-initialize.outputs.after_upload_action == 'dispatch' ||
          steps.recovery-reinitialize-checkpoint.outcome == 'success')
        id: recovery-terminal
        run: >-
          node scripts/vercel-main-deployment.mjs active-journal-history
          --artifacts "$RUNNER_TEMP/main-recovery-current"
          --output "$RUNNER_TEMP/main-recovery-terminal-history.json"

      - name: Publish one canonical recovery outcome
        if: ${{ always() }}
        id: outcome
        env:
          COORDINATOR_OUTCOME: ${{ needs.activate-and-verify.outputs.outcome }}
          COORDINATOR_RESULT: ${{ needs.activate-and-verify.result }}
          DOWNLOAD_OUTCOME: ${{ steps.journal-download.outcome }}
          HISTORY_OUTCOME: ${{ steps.journal-history.outcome }}
          RECOVERY_STATUS: ${{ steps.recovery-terminal.outputs.highest_status }}
        run: |
          if [ "$COORDINATOR_OUTCOME" = "no-target" ] ||
            [ "$COORDINATOR_OUTCOME" = "superseded-before-journal" ] ||
            [ "$COORDINATOR_OUTCOME" = "shadow-prepared" ]; then
            echo "outcome=not-required" >> "$GITHUB_OUTPUT"
          elif [ "$COORDINATOR_OUTCOME" = "active-committed" ] &&
            [ "$HISTORY_OUTCOME" = "success" ]; then
            echo "outcome=not-required" >> "$GITHUB_OUTPUT"
          elif [ "$RECOVERY_STATUS" = "recovered" ]; then
            echo "outcome=recovered" >> "$GITHUB_OUTPUT"
          elif [ "$RECOVERY_STATUS" = "manual_intervention" ]; then
            echo "outcome=manual-intervention" >> "$GITHUB_OUTPUT"
          elif [ "$HISTORY_OUTCOME" = "success" ]; then
            echo "outcome=recovery-failed" >> "$GITHUB_OUTPUT"
          elif [ "$COORDINATOR_RESULT" != "success" ] &&
            [ "$DOWNLOAD_OUTCOME" != "success" ]; then
            echo "outcome=not-found-after-runner-failure" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=not-found-after-runner-failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove authenticated recovery runtime
        if: ${{ always() }}
        uses: ./.github/actions/vercel-protected-runtime
        with:
          operation: cleanup
          logical-target: app

  result:
    name: Vercel Main Deployment
    if: ${{ always() }}
    needs:
      - wait-for-ci
      - plan-main-deployments
      - stage-governance
      - stage-reserve
      - stage-ui
      - activate-and-verify
      - recover-main-deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted final controller
        if: ${{ always() }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Enforce one active final result
        id: final-verdict
        if: ${{ always() }}
        continue-on-error: true
        env:
          PLAN_JSON: ${{ needs.plan-main-deployments.outputs.plan }}
          WAIT_FOR_CI_RESULT: ${{ needs.wait-for-ci.result }}
          PLAN_RESULT: ${{ needs.plan-main-deployments.result }}
          STAGE_GOVERNANCE_RESULT: ${{ needs.stage-governance.result }}
          STAGE_RESERVE_RESULT: ${{ needs.stage-reserve.result }}
          STAGE_UI_RESULT: ${{ needs.stage-ui.result }}
          COORDINATOR_RESULT: ${{ needs.activate-and-verify.result }}
          COORDINATOR_OUTCOME: ${{ needs.activate-and-verify.outputs.outcome }}
          RECOVERY_RESULT: ${{ needs.recover-main-deployment.result }}
          RECOVERY_OUTCOME: ${{ needs.recover-main-deployment.outputs.outcome }}
        run: node scripts/vercel-main-deployment.mjs final-active

      - name: Download canonical active success evidence
        if: ${{ always() && steps.final-verdict.outcome == 'success' && needs.activate-and-verify.outputs.outcome == 'active-committed' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vercel-main-active-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}

      - name: Download every active journal snapshot for failure evidence
        if: ${{ always() && steps.final-verdict.outcome != 'success' }}
        id: final-journal-download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vercel-main-journal-*
          path: ${{ runner.temp }}/main-final-journals
          merge-multiple: false

      - name: Validate active journal history for failure evidence
        if: ${{ steps.final-journal-download.outcome == 'success' }}
        id: final-journal-history
        continue-on-error: true
        env:
          DEPLOY_SHA: ${{ needs.wait-for-ci.outputs.deploy_sha }}
        run: >-
          node scripts/vercel-main-deployment.mjs active-journal-history
          --artifacts "$RUNNER_TEMP/main-final-journals"
          --output "$RUNNER_TEMP/main-final-journal-history.json"

      - name: Write active safe-noop audit evidence
        id: success-evidence
        if: ${{ always() && steps.final-verdict.outcome == 'success' && needs.activate-and-verify.outputs.outcome != 'active-committed' }}
        env:
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_SHA: ${{ needs.wait-for-ci.outputs.deploy_sha }}
          PLAN_JSON: ${{ needs.plan-main-deployments.outputs.plan }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          WAIT_FOR_CI_RESULT: ${{ needs.wait-for-ci.result }}
          PLAN_RESULT: ${{ needs.plan-main-deployments.result }}
          STAGE_GOVERNANCE_RESULT: ${{ needs.stage-governance.result }}
          STAGE_RESERVE_RESULT: ${{ needs.stage-reserve.result }}
          STAGE_UI_RESULT: ${{ needs.stage-ui.result }}
          COORDINATOR_RESULT: ${{ needs.activate-and-verify.result }}
          RECOVERY_RESULT: ${{ needs.recover-main-deployment.result }}
          COORDINATOR_OUTCOME: ${{ needs.activate-and-verify.outputs.outcome }}
          RECOVERY_OUTCOME: ${{ needs.recover-main-deployment.outputs.outcome }}
          ACTIVE_FRESHNESS_JSON: "[]"
          ROLLBACK_STATE_TARGETS_JSON: "[]"
          PUBLIC_SERVING_MUTATION_COMMANDS: "0"
          ACTIVE_ERROR_CODE: SAFE_NOOP
        run: |
          set -euo pipefail
          printf '[]\n' > "$RUNNER_TEMP/active-noop-journal-history.json"
          printf 'null\n' > "$RUNNER_TEMP/active-noop-state-proof.json"
          node scripts/vercel-main-deployment.mjs active-failure-evidence --journal-history "$RUNNER_TEMP/active-noop-journal-history.json" --state-proof "$RUNNER_TEMP/active-noop-state-proof.json" --output "$RUNNER_TEMP/vercel-main-evidence.json"

      - name: Write canonical active failure evidence
        id: failure-evidence
        if: ${{ always() && steps.final-verdict.outcome != 'success' }}
        env:
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_SHA: ${{ needs.wait-for-ci.outputs.deploy_sha }}
          PLAN_JSON: ${{ needs.plan-main-deployments.outputs.plan }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          WAIT_FOR_CI_RESULT: ${{ needs.wait-for-ci.result }}
          PLAN_RESULT: ${{ needs.plan-main-deployments.result }}
          STAGE_GOVERNANCE_RESULT: ${{ needs.stage-governance.result }}
          STAGE_RESERVE_RESULT: ${{ needs.stage-reserve.result }}
          STAGE_UI_RESULT: ${{ needs.stage-ui.result }}
          COORDINATOR_RESULT: ${{ needs.activate-and-verify.result }}
          RECOVERY_RESULT: ${{ needs.recover-main-deployment.result }}
          COORDINATOR_OUTCOME: ${{ needs.activate-and-verify.outputs.outcome }}
          RECOVERY_OUTCOME: ${{ needs.recover-main-deployment.outputs.outcome }}
          ACTIVE_FRESHNESS_JSON: "[]"
          ROLLBACK_STATE_TARGETS_JSON: "[]"
          HISTORY_OUTCOME: ${{ steps.final-journal-history.outcome }}
          POSSIBLE_MUTATION_COMMANDS: ${{ steps.final-journal-history.outputs.possible_mutation_commands }}
          ACTIVE_ERROR_CODE: ACTIVE_FINAL_FAILURE
        run: |
          set -euo pipefail
          if [ "$HISTORY_OUTCOME" = success ]; then
            install -m 0600 "$RUNNER_TEMP/main-final-journal-history.json" "$RUNNER_TEMP/active-failure-journal-history.json"
            printf 'PUBLIC_SERVING_MUTATION_COMMANDS=%s\n' "$POSSIBLE_MUTATION_COMMANDS" >> "$GITHUB_ENV"
            export PUBLIC_SERVING_MUTATION_COMMANDS="$POSSIBLE_MUTATION_COMMANDS"
          else
            printf '[]\n' > "$RUNNER_TEMP/active-failure-journal-history.json"
            printf 'PUBLIC_SERVING_MUTATION_COMMANDS=12\n' >> "$GITHUB_ENV"
            export PUBLIC_SERVING_MUTATION_COMMANDS=12
          fi
          printf 'null\n' > "$RUNNER_TEMP/active-failure-state-proof.json"
          node scripts/vercel-main-deployment.mjs active-failure-evidence --journal-history "$RUNNER_TEMP/active-failure-journal-history.json" --state-proof "$RUNNER_TEMP/active-failure-state-proof.json" --output "$RUNNER_TEMP/vercel-main-evidence.json"

      - name: Upload canonical redacted PR-A evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vercel-main-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vercel-main-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Fail after publishing an unsafe final result
        if: ${{ always() && steps.final-verdict.outcome != 'success' }}
        run: |
          echo "The Vercel main deployment graph did not reach a safe final result" >&2
          exit 1
