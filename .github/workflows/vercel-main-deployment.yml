name: Vercel Main Deployment

on:
  workflow_run:
    workflows: [CI/CD]
    types: [requested, completed]
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  VERCEL_MAIN_MODE: active
  MAIN_OWNERSHIP_MODE_JSON: '{"app":"github","governance":"github","reserve":"github","ui":"github"}'
  SOURCE_PATH: source
  TRUSTED_POST_BUILD_PATH: trusted-after-build

concurrency:
  group: vercel-main-deployment
  cancel-in-progress: false
  queue: single # trunk-ignore(actionlint/syntax-check): Pinned actionlint has not learned GitHub's queue key.

jobs:
  wait-for-ci:
    name: Admit exact upstream CI attempt
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.action == 'requested' ||
      (github.event.action == 'completed' &&
      github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy_sha: ${{ steps.ci.outputs.deploy_sha }}
      upstream_run_id: ${{ steps.ci.outputs.upstream_run_id }}
      upstream_run_attempt: ${{ steps.ci.outputs.upstream_run_attempt }}
      upstream_run_url: ${{ steps.ci.outputs.upstream_run_url }}
      admission_mode: ${{ steps.ci.outputs.admission_mode }}
      deploy_mode: ${{ steps.ci.outputs.deploy_mode }}
      duplicate_of_run_url: ${{ steps.ci.outputs.duplicate_of_run_url }}
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out trusted workflow controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Validate immutable workflow controller
        run: node scripts/vercel-main-deployment.mjs validate-context
      - name: Admit exact upstream attempt
        id: ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/vercel-main-ci-attempt.mjs admit
      # A deduplicated no-op run deploys nothing and can start long after the
      # tip moved, so it proves no source. The proof stays mandatory for every
      # run that can reach a provider write.
      - name: Check out exact deployment source
        if: steps.ci.outputs.deploy_mode == 'deploy'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Prove exact checked-out source
        if: steps.ci.outputs.deploy_mode == 'deploy'
        run: |
          git -C "$SOURCE_PATH" fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/vercel-main-deployment.mjs validate-source

  require-ci-success:
    # The exact upstream attempt is bound into this job's name. It is the only
    # durable, queryable proof that a given deployment run already passed the CI
    # verdict for that attempt; a `workflow_run` run object names no triggering
    # run. `scripts/vercel-main-ci-attempt.mjs` owns the exact format.
    name: Require the exact successful CI attempt for upstream ${{ github.event.workflow_run.id }} attempt ${{ github.event.workflow_run.run_attempt }}
    needs: [wait-for-ci]
    if: needs.wait-for-ci.outputs.deploy_mode == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # GitHub creates the `Build and Test` job record only once its `needs`
    # resolve, so it does not exist while a `requested` delivery is admitting.
    # The gate is the first place that record is guaranteed to exist, so it
    # derives the exact sentinel and publishes it to every downstream job.
    outputs:
      build_and_test_job_url: ${{ steps.gate.outputs.build_and_test_job_url }}
    env:
      DEPLOY_SHA: ${{ needs.wait-for-ci.outputs.deploy_sha }}
      UPSTREAM_RUN_ID: ${{ needs.wait-for-ci.outputs.upstream_run_id }}
      UPSTREAM_RUN_ATTEMPT: ${{ needs.wait-for-ci.outputs.upstream_run_attempt }}
    steps:
      - name: Check out trusted workflow controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            fetch-depth: 1,
            persist-credentials: false,
            ref: "${{ github.workflow_sha }}",
          }
      - name: Validate immutable workflow controller
        run: node scripts/vercel-main-deployment.mjs validate-context
      - name: Require the exact successful upstream attempt
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/vercel-main-ci-attempt.mjs require-success

  provider-preplan:
    name: Discover and decide active release pre-plan
    needs: [wait-for-ci]
    if: needs.wait-for-ci.outputs.deploy_mode == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: vercel-cli-production
      deployment: false # trunk-ignore(actionlint/syntax-check): Pinned actionlint has not learned GitHub's deployment key.
    outputs:
      handoff: ${{ steps.decide.outputs.handoff }}
      decision: ${{ steps.decide.outputs.decision }}
    env:
      DEPLOY_SHA: ${{ needs.wait-for-ci.outputs.deploy_sha }}
      UPSTREAM_RUN_ID: ${{ needs.wait-for-ci.outputs.upstream_run_id }}
      UPSTREAM_RUN_ATTEMPT: ${{ needs.wait-for-ci.outputs.upstream_run_attempt }}
      UPSTREAM_RUN_URL: ${{ needs.wait-for-ci.outputs.upstream_run_url }}
      VERCEL_PROJECT_ID_APP: ${{ vars.VERCEL_PROJECT_ID_APP }}
      VERCEL_PROJECT_ID_GOVERNANCE: ${{ vars.VERCEL_PROJECT_ID_GOVERNANCE }}
      VERCEL_PROJECT_ID_RESERVE: ${{ vars.VERCEL_PROJECT_ID_RESERVE }}
      VERCEL_PROJECT_ID_UI: ${{ vars.VERCEL_PROJECT_ID_UI }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            fetch-depth: 1,
            persist-credentials: false,
            ref: "${{ github.workflow_sha }}",
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            fetch-depth: 0,
            path: source,
            persist-credentials: false,
            ref: "${{ needs.wait-for-ci.outputs.deploy_sha }}",
          }
      - name: Prove exact checked-out source
        env:
          { GITHUB_WORKFLOW_SHA: "${{ needs.wait-for-ci.outputs.deploy_sha }}" }
        run: |
          git -C "$SOURCE_PATH" fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/vercel-main-deployment.mjs validate-source
      - uses: ./.github/actions/pnpm-install
        with:
          {
            working-directory: source,
            ignore-scripts: "true",
            filter: frontend-monorepo,
          }
      - name: Capture reviewed main and legacy snapshots
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: |
          node scripts/vercel-main-deployment.mjs create-spec --scope main --output "$RUNNER_TEMP/main-spec.json"
          node scripts/vercel-main-deployment.mjs create-spec --scope legacy --output "$RUNNER_TEMP/legacy-spec.json"
          node scripts/vercel-deployment-state.mjs planning-snapshot --spec "$RUNNER_TEMP/main-spec.json" --output "$RUNNER_TEMP/planning.json"
          node scripts/vercel-deployment-state.mjs snapshot --spec "$RUNNER_TEMP/legacy-spec.json" --output "$RUNNER_TEMP/legacy.json"
          umask 077
          jq -n --arg app "$VERCEL_PROJECT_ID_APP" --arg governance "$VERCEL_PROJECT_ID_GOVERNANCE" --arg reserve "$VERCEL_PROJECT_ID_RESERVE" --arg ui "$VERCEL_PROJECT_ID_UI" '{app:$app,governance:$governance,reserve:$reserve,ui:$ui}' > "$RUNNER_TEMP/projects.json"
      - name: Discover protected provider candidates
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: >-
          node scripts/vercel-main-provider-cli.mjs preplan-discover
          --planning-snapshot "$RUNNER_TEMP/planning.json" --legacy-snapshot "$RUNNER_TEMP/legacy.json"
          --project-ids "$RUNNER_TEMP/projects.json" --output "$RUNNER_TEMP/discovery.json"
      - name: Decide from a fresh stable provider census
        id: decide
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: |
          status=0
          node scripts/vercel-main-provider-cli.mjs preplan-decide \
            --discovery "$RUNNER_TEMP/discovery.json" \
            --planning-snapshot "$RUNNER_TEMP/planning.json" \
            --legacy-snapshot "$RUNNER_TEMP/legacy.json" \
            --output "$RUNNER_TEMP/preplan.json" || status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "$status" -ne 75 ]; then
            exit "$status"
          fi

          echo "Provider state changed during the decision census; repeating one complete observation epoch."
          node scripts/vercel-deployment-state.mjs planning-snapshot \
            --spec "$RUNNER_TEMP/main-spec.json" \
            --output "$RUNNER_TEMP/planning-retry.json"
          node scripts/vercel-deployment-state.mjs snapshot \
            --spec "$RUNNER_TEMP/legacy-spec.json" \
            --output "$RUNNER_TEMP/legacy-retry.json"
          node scripts/vercel-main-provider-cli.mjs preplan-discover \
            --planning-snapshot "$RUNNER_TEMP/planning-retry.json" \
            --legacy-snapshot "$RUNNER_TEMP/legacy-retry.json" \
            --project-ids "$RUNNER_TEMP/projects.json" \
            --output "$RUNNER_TEMP/discovery-retry.json"
          node scripts/vercel-main-provider-cli.mjs preplan-decide \
            --discovery "$RUNNER_TEMP/discovery-retry.json" \
            --planning-snapshot "$RUNNER_TEMP/planning-retry.json" \
            --legacy-snapshot "$RUNNER_TEMP/legacy-retry.json" \
            --output "$RUNNER_TEMP/preplan-retry.json"

  restore-inherited-release:
    name: Restore inherited active release into this attempt
    # No `always()`: GitHub's implicit needs-success keeps every inherited
    # public mutation behind the exact-attempt CI success gate.
    needs: [wait-for-ci, require-ci-success, provider-preplan]
    if: needs.provider-preplan.outputs.decision == 'restore-before-planning'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: vercel-cli-production
      deployment: false # trunk-ignore(actionlint/syntax-check): Pinned actionlint has not learned GitHub's deployment key.
    outputs:
      outcome: ${{ steps.outcome.outputs.outcome }}
    env:
      DEPLOY_SHA: ${{ needs.wait-for-ci.outputs.deploy_sha }}
      UPSTREAM_RUN_ID: ${{ needs.wait-for-ci.outputs.upstream_run_id }}
      UPSTREAM_RUN_ATTEMPT: ${{ needs.wait-for-ci.outputs.upstream_run_attempt }}
      UPSTREAM_RUN_URL: ${{ needs.wait-for-ci.outputs.upstream_run_url }}
      BUILD_AND_TEST_JOB_URL: ${{ needs.require-ci-success.outputs.build_and_test_job_url }}
      MAIN_PREPLAN_HANDOFF: ${{ needs.provider-preplan.outputs.handoff }}
      VERCEL_PROJECT_ID_APP: ${{ vars.VERCEL_PROJECT_ID_APP }}
      VERCEL_PROJECT_ID_GOVERNANCE: ${{ vars.VERCEL_PROJECT_ID_GOVERNANCE }}
      VERCEL_PROJECT_ID_RESERVE: ${{ vars.VERCEL_PROJECT_ID_RESERVE }}
      VERCEL_PROJECT_ID_UI: ${{ vars.VERCEL_PROJECT_ID_UI }}
    steps:
      - name: Check out immutable inherited recovery controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            fetch-depth: 1,
            persist-credentials: false,
            ref: "${{ github.workflow_sha }}",
          }
      - name: Check out exact admitted inherited recovery source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            fetch-depth: 0,
            path: source,
            persist-credentials: false,
            ref: "${{ needs.wait-for-ci.outputs.deploy_sha }}",
          }
      - name: Prove exact admitted inherited recovery source
        env:
          { GITHUB_WORKFLOW_SHA: "${{ needs.wait-for-ci.outputs.deploy_sha }}" }
        run: |
          git -C "$SOURCE_PATH" fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/vercel-main-deployment.mjs validate-recovery-source
      - name: Install exact inherited recovery source without lifecycle scripts
        uses: ./.github/actions/pnpm-install
        with:
          {
            working-directory: source,
            ignore-scripts: "true",
            filter: frontend-monorepo,
          }
      - name: Materialize strict inherited recovery decision
        id: inherited
        run: node scripts/vercel-main-provider-cli.mjs preplan-materialize --output "$RUNNER_TEMP/inherited-preplan.json"
      - name: Bind inherited journal deployment SHA
        env:
          INHERITED_JOURNAL_DEPLOY_SHA: ${{ steps.inherited.outputs.inherited_journal_deploy_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$INHERITED_JOURNAL_DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Inherited journal deployment SHA must be lowercase hexadecimal" >&2
            exit 1
          fi
          printf 'MAIN_ACTIVE_JOURNAL_DEPLOY_SHA=%s\n' "$INHERITED_JOURNAL_DEPLOY_SHA" >> "$GITHUB_ENV"
      - name: Materialize inherited mapping specifications
        run: |
          node scripts/vercel-main-deployment.mjs create-spec --scope main --output "$RUNNER_TEMP/main-spec.json"
          node scripts/vercel-main-deployment.mjs create-spec --scope legacy --output "$RUNNER_TEMP/legacy-spec.json"
      - name: Create inherited governance candidate intent
        if: contains(fromJSON(steps.inherited.outputs.inherited_candidate_targets), 'governance')
        run: >-
          node scripts/vercel-main-release-cli.mjs inherited-candidate-intent
          --preplan "$RUNNER_TEMP/inherited-preplan.json" --target governance
          --output "$RUNNER_TEMP/inherited-governance-intent.json"
      - name: Require an existing inherited governance provider candidate
        if: contains(fromJSON(steps.inherited.outputs.inherited_candidate_targets), 'governance')
        id: inherited-governance-preflight
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: >-
          node scripts/vercel-main-provider-cli.mjs candidate-preflight
          --intent "$RUNNER_TEMP/inherited-governance-intent.json"
          --output "$RUNNER_TEMP/inherited-governance-preflight.json"
      - name: Freshly smoke and finalize inherited governance candidate
        if: contains(fromJSON(steps.inherited.outputs.inherited_candidate_targets), 'governance')
        id: inherited-governance-finalize
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: |
          test "${{ steps.inherited-governance-preflight.outputs.action }}" = reuse
          node scripts/vercel-main-provider-cli.mjs candidate-smoke --intent "$RUNNER_TEMP/inherited-governance-intent.json" --output "$RUNNER_TEMP/inherited-governance-smoke.json"
          node scripts/vercel-main-provider-cli.mjs candidate-finalize-inherited --intent "$RUNNER_TEMP/inherited-governance-intent.json" --smoke "$RUNNER_TEMP/inherited-governance-smoke.json" --output "$RUNNER_TEMP/inherited-governance-receipt.json"
      - name: Create inherited reserve candidate intent
        if: contains(fromJSON(steps.inherited.outputs.inherited_candidate_targets), 'reserve')
        run: >-
          node scripts/vercel-main-release-cli.mjs inherited-candidate-intent
          --preplan "$RUNNER_TEMP/inherited-preplan.json" --target reserve
          --output "$RUNNER_TEMP/inherited-reserve-intent.json"
      - name: Require an existing inherited reserve provider candidate
        if: contains(fromJSON(steps.inherited.outputs.inherited_candidate_targets), 'reserve')
        id: inherited-reserve-preflight
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: >-
          node scripts/vercel-main-provider-cli.mjs candidate-preflight
          --intent "$RUNNER_TEMP/inherited-reserve-intent.json"
          --output "$RUNNER_TEMP/inherited-reserve-preflight.json"
      - name: Freshly smoke and finalize inherited reserve candidate
        if: contains(fromJSON(steps.inherited.outputs.inherited_candidate_targets), 'reserve')
        id: inherited-reserve-finalize
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: |
          test "${{ steps.inherited-reserve-preflight.outputs.action }}" = reuse
          node scripts/vercel-main-provider-cli.mjs candidate-smoke --intent "$RUNNER_TEMP/inherited-reserve-intent.json" --output "$RUNNER_TEMP/inherited-reserve-smoke.json"
          node scripts/vercel-main-provider-cli.mjs candidate-finalize-inherited --intent "$RUNNER_TEMP/inherited-reserve-intent.json" --smoke "$RUNNER_TEMP/inherited-reserve-smoke.json" --output "$RUNNER_TEMP/inherited-reserve-receipt.json"
      - name: Create inherited UI candidate intent
        if: contains(fromJSON(steps.inherited.outputs.inherited_candidate_targets), 'ui')
        run: >-
          node scripts/vercel-main-release-cli.mjs inherited-candidate-intent
          --preplan "$RUNNER_TEMP/inherited-preplan.json" --target ui
          --output "$RUNNER_TEMP/inherited-ui-intent.json"
      - name: Require an existing inherited UI provider candidate
        if: contains(fromJSON(steps.inherited.outputs.inherited_candidate_targets), 'ui')
        id: inherited-ui-preflight
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: >-
          node scripts/vercel-main-provider-cli.mjs candidate-preflight
          --intent "$RUNNER_TEMP/inherited-ui-intent.json"
          --output "$RUNNER_TEMP/inherited-ui-preflight.json"
      - name: Freshly smoke and finalize inherited UI candidate
        if: contains(fromJSON(steps.inherited.outputs.inherited_candidate_targets), 'ui')
        id: inherited-ui-finalize
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: |
          test "${{ steps.inherited-ui-preflight.outputs.action }}" = reuse
          node scripts/vercel-main-provider-cli.mjs candidate-smoke --intent "$RUNNER_TEMP/inherited-ui-intent.json" --output "$RUNNER_TEMP/inherited-ui-smoke.json"
          node scripts/vercel-main-provider-cli.mjs candidate-finalize-inherited --intent "$RUNNER_TEMP/inherited-ui-intent.json" --smoke "$RUNNER_TEMP/inherited-ui-smoke.json" --output "$RUNNER_TEMP/inherited-ui-receipt.json"
      - name: Create inherited App candidate intent
        if: contains(fromJSON(steps.inherited.outputs.inherited_candidate_targets), 'app')
        run: >-
          node scripts/vercel-main-release-cli.mjs inherited-candidate-intent
          --preplan "$RUNNER_TEMP/inherited-preplan.json" --target app
          --output "$RUNNER_TEMP/inherited-app-intent.json"
      - name: Require an existing inherited App provider candidate
        if: contains(fromJSON(steps.inherited.outputs.inherited_candidate_targets), 'app')
        id: inherited-app-preflight
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: >-
          node scripts/vercel-main-provider-cli.mjs candidate-preflight
          --intent "$RUNNER_TEMP/inherited-app-intent.json"
          --output "$RUNNER_TEMP/inherited-app-preflight.json"
      - name: Freshly smoke and finalize inherited App candidate without pending state
        if: contains(fromJSON(steps.inherited.outputs.inherited_candidate_targets), 'app')
        id: inherited-app-finalize
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: |
          test "${{ steps.inherited-app-preflight.outputs.action }}" = reuse
          node scripts/vercel-main-provider-cli.mjs candidate-smoke --intent "$RUNNER_TEMP/inherited-app-intent.json" --output "$RUNNER_TEMP/inherited-app-smoke.json"
          node scripts/vercel-main-provider-cli.mjs candidate-finalize --intent "$RUNNER_TEMP/inherited-app-intent.json" --smoke "$RUNNER_TEMP/inherited-app-smoke.json" --output "$RUNNER_TEMP/inherited-app-receipt.json"
      - name: Materialize strict inherited candidate receipts
        env:
          APP_RECEIPT: ${{ steps.inherited-app-finalize.outputs.receipt || 'none' }}
          GOVERNANCE_RECEIPT: ${{ steps.inherited-governance-finalize.outputs.receipt || 'none' }}
          RESERVE_RECEIPT: ${{ steps.inherited-reserve-finalize.outputs.receipt || 'none' }}
          UI_RECEIPT: ${{ steps.inherited-ui-finalize.outputs.receipt || 'none' }}
        run: >-
          node scripts/vercel-main-release-cli.mjs inherited-candidate-receipts
          --preplan "$RUNNER_TEMP/inherited-preplan.json"
          --app "$APP_RECEIPT" --governance "$GOVERNANCE_RECEIPT"
          --reserve "$RESERVE_RECEIPT" --ui "$UI_RECEIPT"
          --output "$RUNNER_TEMP/inherited-candidate-receipts.json"
      - name: Recapture authoritative inherited mappings after candidate validation
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: |
          node scripts/vercel-deployment-state.mjs planning-snapshot --spec "$RUNNER_TEMP/main-spec.json" --output "$RUNNER_TEMP/current-planning.json"
          node scripts/vercel-deployment-state.mjs snapshot --spec "$RUNNER_TEMP/legacy-spec.json" --output "$RUNNER_TEMP/current-legacy.json"
          node scripts/vercel-main-provider-cli.mjs canonical-mappings --planning-snapshot "$RUNNER_TEMP/current-planning.json" --legacy-snapshot "$RUNNER_TEMP/current-legacy.json" --output "$RUNNER_TEMP/current-mappings.json"
      - name: Create a current-attempt inherited recovery journal
        id: journal
        run: >-
          node scripts/vercel-main-release-cli.mjs inherited-recovery-journal
          --preplan "$RUNNER_TEMP/inherited-preplan.json" --legacy-snapshot "$RUNNER_TEMP/current-legacy.json"
          --current-mappings "$RUNNER_TEMP/current-mappings.json" --candidate-receipts "$RUNNER_TEMP/inherited-candidate-receipts.json"
          --journal-output "$RUNNER_TEMP/inherited-recovery-journal.json" --plan-output "$RUNNER_TEMP/inherited-recovery-plan.json"
      - name: Stage current-attempt recovery journal under its canonical artifact basename
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/inherited-recovery-artifact"
          install -m 0600 "$RUNNER_TEMP/inherited-recovery-journal.json" "$RUNNER_TEMP/inherited-recovery-artifact/main-journal.json"
      - name: Upload current-attempt recovery journal before reverse mutation
        id: upload-prepared
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.journal.outputs.journal_artifact_name }}
          path: ${{ runner.temp }}/inherited-recovery-artifact/main-journal.json
          if-no-files-found: error
          retention-days: 7
      - name: Checkpoint inherited recovery journal receipt and history
        env:
          ARTIFACT_ID: ${{ steps.upload-prepared.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.journal.outputs.journal_artifact_name }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/inherited-journals/$ARTIFACT_NAME"
          install -m 0600 "$RUNNER_TEMP/inherited-recovery-journal.json" "$RUNNER_TEMP/inherited-journals/$ARTIFACT_NAME/main-journal.json"
          node scripts/vercel-main-deployment.mjs active-journal-history --artifacts "$RUNNER_TEMP/inherited-journals" --output "$RUNNER_TEMP/inherited-journals/current-history.json"
          node scripts/vercel-main-deployment.mjs active-journal-receipt --journal "$RUNNER_TEMP/inherited-recovery-journal.json" --artifact-name "$ARTIFACT_NAME" --artifact-id "$ARTIFACT_ID" --output "$RUNNER_TEMP/inherited-journals/current-receipt.json"
          install -m 0600 "$RUNNER_TEMP/inherited-recovery-journal.json" "$RUNNER_TEMP/inherited-journals/current-journal.json"
      - name: Prepare protected inherited recovery runtime
        id: recovery-runtime
        uses: ./.github/actions/vercel-protected-runtime
        with:
          {
            operation: prepare,
            logical-target: app,
            controller-path: "${{ github.workspace }}",
            source-path: "${{ github.workspace }}/source",
          }
      - name: Initialize current-attempt inherited recovery
        id: initialize
        run: |
          node scripts/vercel-main-deployment.mjs active-recovery-event-initialize --receipt "$RUNNER_TEMP/inherited-journals/current-receipt.json" --output "$RUNNER_TEMP/inherited-initialize-event.json"
          node scripts/vercel-main-deployment.mjs run-active-recovery --plan "$RUNNER_TEMP/inherited-recovery-plan.json" --event "$RUNNER_TEMP/inherited-initialize-event.json" --journal-history "$RUNNER_TEMP/inherited-journals/current-history.json" --journal-output "$RUNNER_TEMP/inherited-initialized-journal.json" --output "$RUNNER_TEMP/inherited-initialize-transition.json"
      - name: Require initialized inherited recovery journal
        run: |
          test "${{ steps.initialize.outputs.transition_kind }}" = journal
          test "${{ steps.initialize.outputs.next_action }}" = upload-journal
