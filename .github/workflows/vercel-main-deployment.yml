          --output "$RUNNER_TEMP/stage-barrier.json"
      - name: Capture fresh unchanged mappings for a shadow-only release
        if: >-
          steps.freshness.outputs.status == 'fresh' &&
          needs.prepare-release.outputs.has_active_targets != 'true'
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: |
          node scripts/vercel-deployment-state.mjs planning-snapshot --spec "$RUNNER_TEMP/main-spec.json" --output "$RUNNER_TEMP/shadow-planning.json"
          node scripts/vercel-deployment-state.mjs snapshot --spec "$RUNNER_TEMP/legacy-spec.json" --output "$RUNNER_TEMP/shadow-legacy.json"
          node scripts/vercel-main-provider-cli.mjs canonical-mappings --planning-snapshot "$RUNNER_TEMP/shadow-planning.json" --legacy-snapshot "$RUNNER_TEMP/shadow-legacy.json" --output "$RUNNER_TEMP/shadow-mappings.json"
