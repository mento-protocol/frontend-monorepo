          set -euo pipefail
          if [ "$TERMINAL_OUTCOME" = recovered ]; then
            test -s "$RUNNER_TEMP/recovery-public-smokes.json"
            test -s "$RUNNER_TEMP/recovery-final-mappings.json"
            case "$CENSUS_OUTCOME" in
              proven)
                terminal_outcome=recovered
                final_census="$RUNNER_TEMP/recovery-final-state-proof.json"
                state_proof="$RUNNER_TEMP/recovery-final-state-proof.json"
                test -s "$final_census"
                ;;
              unproven)
                terminal_outcome=recovered-census-unproven
                final_census="$RUNNER_TEMP/recovery-final-census-failure.json"
                state_proof="$RUNNER_TEMP/null.json"
                test -s "$final_census"
                ;;
              *) exit 1 ;;
            esac
            public_smokes="$RUNNER_TEMP/recovery-public-smokes.json"
          else
            terminal_outcome="$TERMINAL_OUTCOME"
            final_census="$RUNNER_TEMP/recovery-final-state-proof.json"
            state_proof="$RUNNER_TEMP/recovery-final-state-proof.json"
            public_smokes="$RUNNER_TEMP/null.json"
            test -s "$final_census"
          fi
          node scripts/vercel-main-release-cli.mjs terminal-artifacts --active-evidence-output "$RUNNER_TEMP/recovery-evidence.json" --execution "$RUNNER_TEMP/execution.json" --final-census "$final_census" --final-mappings "$RUNNER_TEMP/recovery-final-mappings.json" --freshness "$RUNNER_TEMP/null.json" --journal-history "$RUNNER_TEMP/recovered-history.json" --legacy-v2 "$RUNNER_TEMP/recovery-final-legacy.json" --outcome "$terminal_outcome" --proofs-output "$RUNNER_TEMP/recovery-proofs.json" --public-smokes "$public_smokes" --stage-results "$RUNNER_TEMP/null.json" --state-proof "$state_proof"
          echo "outcome=$terminal_outcome" >> "$GITHUB_OUTPUT"
      - name: Publish recovery terminal producer outputs
        id: terminal
        if: ${{ always() && !cancelled() && (steps.preparation-failure-terminal.outcome == 'success' || steps.recovery-failed-terminal.outcome == 'success' || steps.recovered-terminal.outcome == 'success') }}
        run: >-
          node scripts/vercel-main-deployment.mjs terminal-evidence-create
          --manifest "$RUNNER_TEMP/manifest.json" --execution "$RUNNER_TEMP/execution.json"
          --active-evidence "$RUNNER_TEMP/recovery-evidence.json" --proofs "$RUNNER_TEMP/recovery-proofs.json"
          --receipt-output "$RUNNER_TEMP/recovery-receipt.json" --evidence-output "$RUNNER_TEMP/recovery-terminal-evidence.json"
      - name: Mark recovered census-unproven terminal route
        if: ${{ always() && steps.terminal.outcome == 'success' && steps.recovered-terminal.outputs.outcome == 'recovered-census-unproven' }}
        run: "true"
      - name: Publish recovery outcome
        id: outcome
        if: ${{ always() && steps.terminal.outcome == 'success' }}
        env:
          {
            TERMINAL_OUTCOME: "${{ steps.preparation-failure-terminal.outputs.outcome || steps.recovery-failed-terminal.outputs.outcome || steps.recovered-terminal.outputs.outcome }}",
          }
        run: |
          set -euo pipefail
          case "$TERMINAL_OUTCOME" in
            recovered|recovered-census-unproven|manual-intervention|recovery-failed|preparation-failed-before-journal) ;;
            *) exit 1 ;;
          esac
          echo "outcome=$TERMINAL_OUTCOME" >> "$GITHUB_OUTPUT"
      - name: Fail after recording recovery terminal evidence
        if: ${{ always() && steps.outcome.outcome == 'success' }}
        env: { TERMINAL_OUTCOME: "${{ steps.outcome.outputs.outcome }}" }
        run: |
          case "$TERMINAL_OUTCOME" in
            recovered|recovered-census-unproven|manual-intervention|recovery-failed|preparation-failed-before-journal) exit 1 ;;
            *) exit 1 ;;
          esac
      - name: Remove authenticated recovery runtime
        if: ${{ always() }}
        uses: ./.github/actions/vercel-protected-runtime
        with: { operation: cleanup, logical-target: app }

  result:
    name: Vercel Main Deployment
    if: ${{ always() }}
    needs:
      [
        wait-for-ci,
        require-ci-success,
        provider-preplan,
        restore-inherited-release,
        prepare-release,
        stage-app,
        stage-governance,
        stage-reserve,
        stage-ui,
        activate-and-verify,
        recover-main-deployment,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            fetch-depth: 1,
            persist-credentials: false,
            ref: "${{ github.workflow_sha }}",
          }
      - name: Restore the exact terminal producer handoff without artifact verdict downloads
        id: terminal-restore
        if: ${{ always() }}
        continue-on-error: true
        env:
          DEPLOY_SHA: ${{ needs.wait-for-ci.outputs.deploy_sha }}
          UPSTREAM_RUN_ID: ${{ needs.wait-for-ci.outputs.upstream_run_id }}
          UPSTREAM_RUN_ATTEMPT: ${{ needs.wait-for-ci.outputs.upstream_run_attempt }}
          MAIN_RELEASE_EXECUTION: ${{ needs.prepare-release.outputs.execution }}
          PREPARE_RESULT: ${{ needs.prepare-release.result }}
          COORDINATOR_EVIDENCE: ${{ needs.activate-and-verify.outputs.evidence }}
          COORDINATOR_RECEIPT: ${{ needs.activate-and-verify.outputs.receipt }}
          RECOVERY_EVIDENCE: ${{ needs.recover-main-deployment.outputs.evidence }}
          RECOVERY_RECEIPT: ${{ needs.recover-main-deployment.outputs.receipt }}
        run: |
          set -euo pipefail
          if [ "$PREPARE_RESULT" != success ]; then
            echo 'execution_available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/vercel-main-release-cli.mjs materialize --output "$RUNNER_TEMP/execution.json"
          jq -c .manifest "$RUNNER_TEMP/execution.json" > "$RUNNER_TEMP/manifest.json"
          if [ -n "$RECOVERY_RECEIPT$RECOVERY_EVIDENCE" ]; then
            test -n "$RECOVERY_RECEIPT"
            test -n "$RECOVERY_EVIDENCE"
            terminal_receipt="$RECOVERY_RECEIPT"
            terminal_evidence="$RECOVERY_EVIDENCE"
          else
            test -n "$COORDINATOR_RECEIPT"
            test -n "$COORDINATOR_EVIDENCE"
            terminal_receipt="$COORDINATOR_RECEIPT"
            terminal_evidence="$COORDINATOR_EVIDENCE"
          fi
          node scripts/vercel-main-deployment.mjs terminal-evidence-restore --manifest "$RUNNER_TEMP/manifest.json" --execution "$RUNNER_TEMP/execution.json" --receipt "$terminal_receipt" --evidence "$terminal_evidence" --output "$RUNNER_TEMP/final-evidence.json"
          echo 'execution_available=true' >> "$GITHUB_OUTPUT"
          echo 'terminal_restored=true' >> "$GITHUB_OUTPUT"
      - name: Evaluate literal active final result graph
        id: final-active
        if: ${{ always() && needs.prepare-release.result == 'success' }}
        env:
          COORDINATOR_OUTCOME: ${{ needs.activate-and-verify.outputs.outcome || needs.recover-main-deployment.outputs.outcome }}
          COORDINATOR_RESULT: ${{ needs.activate-and-verify.result }}
          DEPLOY_SHA: ${{ needs.wait-for-ci.outputs.deploy_sha }}
          PLAN_RESULT: ${{ needs.prepare-release.result }}
          RECOVERY_OUTCOME: ${{ needs.recover-main-deployment.outputs.outcome || 'not-required' }}
          RECOVERY_RESULT: ${{ needs.recover-main-deployment.result }}
          STAGE_GOVERNANCE_RESULT: ${{ needs.stage-governance.result }}
          STAGE_RESERVE_RESULT: ${{ needs.stage-reserve.result }}
          STAGE_UI_RESULT: ${{ needs.stage-ui.result }}
          UPSTREAM_RUN_ATTEMPT: ${{ needs.wait-for-ci.outputs.upstream_run_attempt }}
          UPSTREAM_RUN_ID: ${{ needs.wait-for-ci.outputs.upstream_run_id }}
          WAIT_FOR_CI_RESULT: ${{ needs.wait-for-ci.result }}
        run: >-
          node scripts/vercel-main-deployment.mjs final-active
          --execution "$RUNNER_TEMP/execution.json"
      - name: Publish exact Dependabot post-merge verification
        if: >-
          ${{ always() && needs.wait-for-ci.result == 'success' &&
          needs.require-ci-success.result == 'success' &&
          needs.wait-for-ci.outputs.deploy_mode == 'deploy' }}
        env:
          DEPLOY_SHA: ${{ needs.wait-for-ci.outputs.deploy_sha }}
          FAIL_AFTER_EVIDENCE: ${{ steps.final-active.outputs.fail_after_evidence }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.final-active.outputs.release_outcome }}
          RELEASE_REASON: ${{ steps.final-active.outputs.reason }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TERMINAL_RESTORED: ${{ steps.terminal-restore.outputs.terminal_restored }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]

          conclusion=failure
          case "$RELEASE_REASON" in
            active-committed|current-release-verified|no-target)
              if [ "$TERMINAL_RESTORED" = true ] && \
                [ "$RELEASE_OUTCOME" = success ] && \
                [ "$FAIL_AFTER_EVIDENCE" = false ]; then
                conclusion=success
              fi
              ;;
          esac

          jq -n \
            --arg conclusion "$conclusion" \
            --arg deploy_sha "$DEPLOY_SHA" \
            --arg details_url "$RUN_URL" \
            --arg external_id "dependabot-post-merge:${{ github.run_id }}:${{ github.run_attempt }}" \
            --arg release_outcome "${RELEASE_OUTCOME:-missing}" \
            --arg release_reason "${RELEASE_REASON:-missing}" \
            --arg terminal_restored "${TERMINAL_RESTORED:-false}" \
            '{
              name: "Dependabot Post-Merge Verification",
              head_sha: $deploy_sha,
              status: "completed",
              conclusion: $conclusion,
              details_url: $details_url,
              external_id: $external_id,
              output: {
                title: "Dependabot post-merge release proof",
                summary: ("release_outcome=" + $release_outcome + "; reason=" + $release_reason + "; terminal_restored=" + $terminal_restored)
              }
            }' > "$RUNNER_TEMP/dependabot-post-merge-check.json"
          gh api --method POST \
            "repos/$REPOSITORY/check-runs" \
            --input "$RUNNER_TEMP/dependabot-post-merge-check.json" \
            > /dev/null
      - name: Fail after terminal evidence for an unsafe final graph
        if: ${{ always() && needs.prepare-release.result == 'success' }}
        env:
          FINAL_FAIL_AFTER_EVIDENCE: ${{ steps.final-active.outputs.fail_after_evidence }}
          TERMINAL_RESTORED: ${{ steps.terminal-restore.outputs.terminal_restored }}
        run: |
          set -euo pipefail
          test "$TERMINAL_RESTORED" = true
          test "$FINAL_FAIL_AFTER_EVIDENCE" = false
      - name: Report a deduplicated upstream-attempt no-op
        if: >-
          ${{ always() &&
          needs.wait-for-ci.outputs.deploy_mode == 'already-deployed' }}
        env:
          DUPLICATE_OF_RUN_URL: ${{ needs.wait-for-ci.outputs.duplicate_of_run_url }}
          UPSTREAM_RUN_URL: ${{ needs.wait-for-ci.outputs.upstream_run_url }}
        run: |
          set -euo pipefail
          {
            echo '### Deduplicated upstream attempt'
            echo
            echo "- Upstream run attempt: ${UPSTREAM_RUN_URL}"
            echo "- Already deployed by: ${DUPLICATE_OF_RUN_URL}"
            echo
            echo 'That run passed the exact-attempt CI success gate, so this completed delivery executed no release job and no public mutation.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail closed before release execution exists
        if: >-
          ${{ always() && needs.prepare-release.result != 'success' &&
          needs.wait-for-ci.outputs.deploy_mode != 'already-deployed' }}
        run: exit 1
