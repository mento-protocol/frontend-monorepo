  prepare-release:
    name: Capture and materialize the current active release
    needs:
      [
        wait-for-ci,
        require-ci-success,
        provider-preplan,
        restore-inherited-release,
      ]
    if: >-
      always() && needs.wait-for-ci.result == 'success' &&
      needs.require-ci-success.result == 'success' &&
      needs.provider-preplan.result == 'success' &&
      (needs.restore-inherited-release.result == 'skipped' ||
      (needs.restore-inherited-release.result == 'success' &&
      needs.restore-inherited-release.outputs.outcome == 'recovered'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: vercel-cli-production
      deployment: false # trunk-ignore(actionlint/syntax-check): Pinned actionlint has not learned GitHub's deployment key.
    outputs:
      execution: ${{ steps.execution.outputs.execution }}
      decision: ${{ steps.execution.outputs.decision }}
      targets: ${{ steps.execution.outputs.targets }}
      active_targets: ${{ steps.execution.outputs.active_targets }}
      shadow_targets: ${{ steps.execution.outputs.shadow_targets }}
      has_active_targets: ${{ steps.execution.outputs.has_active_targets }}
      no_target: ${{ steps.execution.outputs.no_target }}
    env:
      DEPLOY_SHA: ${{ needs.wait-for-ci.outputs.deploy_sha }}
      UPSTREAM_RUN_ID: ${{ needs.wait-for-ci.outputs.upstream_run_id }}
      UPSTREAM_RUN_ATTEMPT: ${{ needs.wait-for-ci.outputs.upstream_run_attempt }}
      UPSTREAM_RUN_URL: ${{ needs.wait-for-ci.outputs.upstream_run_url }}
      BUILD_AND_TEST_JOB_URL: ${{ needs.require-ci-success.outputs.build_and_test_job_url }}
      VERCEL_PROJECT_ID_APP: ${{ vars.VERCEL_PROJECT_ID_APP }}
      VERCEL_PROJECT_ID_GOVERNANCE: ${{ vars.VERCEL_PROJECT_ID_GOVERNANCE }}
      VERCEL_PROJECT_ID_RESERVE: ${{ vars.VERCEL_PROJECT_ID_RESERVE }}
      VERCEL_PROJECT_ID_UI: ${{ vars.VERCEL_PROJECT_ID_UI }}
    steps:
      - name: Check out immutable release preparation controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            fetch-depth: 1,
            persist-credentials: false,
            ref: "${{ github.workflow_sha }}",
          }
      - name: Check out exact admitted release preparation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            fetch-depth: 0,
            path: source,
            persist-credentials: false,
            ref: "${{ needs.wait-for-ci.outputs.deploy_sha }}",
          }
      - name: Prove exact admitted release preparation source
        env:
          { GITHUB_WORKFLOW_SHA: "${{ needs.wait-for-ci.outputs.deploy_sha }}" }
        run: |
          git -C "$SOURCE_PATH" fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/vercel-main-deployment.mjs validate-source
      - name: Install exact release preparation source without lifecycle scripts
        uses: ./.github/actions/pnpm-install
        with:
          {
            working-directory: source,
            ignore-scripts: "true",
            filter: frontend-monorepo,
          }
      - name: Materialize fresh release preparation specifications
        run: |
          node scripts/vercel-main-deployment.mjs create-spec --scope main --output "$RUNNER_TEMP/main-spec.json"
          node scripts/vercel-main-deployment.mjs create-spec --scope legacy --output "$RUNNER_TEMP/legacy-spec.json"
          umask 077
          jq -n --arg app "$VERCEL_PROJECT_ID_APP" --arg governance "$VERCEL_PROJECT_ID_GOVERNANCE" --arg reserve "$VERCEL_PROJECT_ID_RESERVE" --arg ui "$VERCEL_PROJECT_ID_UI" '{app:$app,governance:$governance,reserve:$reserve,ui:$ui}' > "$RUNNER_TEMP/projects.json"
      - name: Capture wholly fresh main and full legacy snapshots
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: |
          node scripts/vercel-deployment-state.mjs planning-snapshot --spec "$RUNNER_TEMP/main-spec.json" --output "$RUNNER_TEMP/planning.json"
          node scripts/vercel-deployment-state.mjs snapshot --spec "$RUNNER_TEMP/legacy-spec.json" --output "$RUNNER_TEMP/legacy.json"
      - name: Discover a wholly fresh provider candidate census
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: >-
          node scripts/vercel-main-provider-cli.mjs preplan-discover
          --planning-snapshot "$RUNNER_TEMP/planning.json" --legacy-snapshot "$RUNNER_TEMP/legacy.json"
          --project-ids "$RUNNER_TEMP/projects.json" --output "$RUNNER_TEMP/discovery.json"
      - name: Decide from the wholly fresh provider census
        id: decide
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: >-
          node scripts/vercel-main-provider-cli.mjs preplan-decide
          --discovery "$RUNNER_TEMP/discovery.json"
          --planning-snapshot "$RUNNER_TEMP/planning.json"
          --legacy-snapshot "$RUNNER_TEMP/legacy.json"
          --output "$RUNNER_TEMP/preplan.json"
      - name: Reject a second inherited restore decision
        env: { DECISION: "${{ steps.decide.outputs.decision }}" }
        run: test "$DECISION" != restore-before-planning
      - name: Create and encode release execution
        id: execution
        run: >-
          node scripts/vercel-main-release-cli.mjs execution --preplan "$RUNNER_TEMP/preplan.json"
          --discovery "$RUNNER_TEMP/discovery.json" --planning-snapshot "$RUNNER_TEMP/planning.json"
          --legacy-snapshot "$RUNNER_TEMP/legacy.json" --output "$RUNNER_TEMP/execution.json"

  stage-app:
    name: Build App custom-v3 candidate output
    needs: [wait-for-ci, require-ci-success, prepare-release]
    # Same status contract as the ordinary stages: `prepare-release` can succeed
    # through its explicit skipped-restore route, and `always()` disables
    # implicit needs-success, so the exact-attempt CI success gate is asserted
    # literally. This job creates no provider deployment; it only builds and
    # hands the exact custom-`v3` output to activation.
    if: >-
      always() && !cancelled() && needs.wait-for-ci.result == 'success' &&
      needs.require-ci-success.result == 'success' &&
      needs.prepare-release.result == 'success' &&
      contains(fromJSON(needs.prepare-release.outputs.targets), 'app')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: vercel-cli-production
      deployment: false # trunk-ignore(actionlint/syntax-check): Pinned actionlint has not learned GitHub's deployment key.
    outputs:
      action: ${{ steps.preflight.outputs.action }}
      candidate_id: ${{ steps.intent.outputs.candidate_id }}
      payload_artifact: ${{ steps.seal.outputs.artifact_name }}
      payload_attempt: ${{ steps.seal.outputs.run_attempt }}
      payload_bytes: ${{ steps.seal.outputs.bytes }}
      payload_sha256: ${{ steps.seal.outputs.sha256 }}
    env:
      DEPLOY_SHA: ${{ needs.wait-for-ci.outputs.deploy_sha }}
      UPSTREAM_RUN_ID: ${{ needs.wait-for-ci.outputs.upstream_run_id }}
      UPSTREAM_RUN_ATTEMPT: ${{ needs.wait-for-ci.outputs.upstream_run_attempt }}
      MAIN_RELEASE_EXECUTION: ${{ needs.prepare-release.outputs.execution }}
      LOGICAL_TARGET: app
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_APP }}
      VERCEL_PROJECT_ID_APP: ${{ vars.VERCEL_PROJECT_ID_APP }}
    steps:
      - name: Check out trusted App controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            fetch-depth: 1,
            persist-credentials: false,
            ref: "${{ github.workflow_sha }}",
          }
      - name: Check out exact App source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            fetch-depth: 0,
            path: source,
            persist-credentials: false,
            ref: "${{ needs.wait-for-ci.outputs.deploy_sha }}",
          }
      - name: Prove exact App source
        env: { GITHUB_WORKFLOW_SHA: "${{ github.workflow_sha }}" }
        run: |
          git -C "$SOURCE_PATH" fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/vercel-main-deployment.mjs validate-source
      - name: Install exact App source without lifecycle scripts
        uses: ./.github/actions/pnpm-install
        with:
          {
            working-directory: source,
            ignore-scripts: "true",
            filter: frontend-monorepo,
          }
      - name: Materialize execution and create App current intent
        id: intent
        run: |
          node scripts/vercel-main-release-cli.mjs materialize --output "$RUNNER_TEMP/execution.json"
          node scripts/vercel-main-deployment.mjs candidate-intent --execution "$RUNNER_TEMP/execution.json" --target app --output "$RUNNER_TEMP/app-intent.json"
      - name: Prepare protected App runtime
        id: runtime
        uses: ./.github/actions/vercel-protected-runtime
        with:
          {
            operation: prepare,
            logical-target: app,
            controller-path: "${{ github.workspace }}",
            source-path: "${{ github.workspace }}/source",
          }
      - name: Verify pinned App prerequisites
        run: ${{ steps.runtime.outputs.node-bin }} scripts/vercel-prebuilt.mjs check-versions --repo-root "$SOURCE_PATH"
      - name: Preflight an App candidate only when App has activation authority
        if: contains(fromJSON(needs.prepare-release.outputs.active_targets), 'app')
        id: preflight
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: |
          node scripts/vercel-main-provider-cli.mjs candidate-preflight --intent "$RUNNER_TEMP/app-intent.json" --output "$RUNNER_TEMP/app-preflight.json"
      - name: Prepare runner-owned App custom-v3 pull staging
        if: >-
          steps.preflight.outputs.action == 'create' ||
          contains(fromJSON(needs.prepare-release.outputs.shadow_targets), 'app')
        env:
          PULL_STAGING_PATH: ${{ steps.runtime.outputs.pull-staging-path }}
          SOURCE_PATH: ${{ steps.runtime.outputs.pull-staging-path }}
          VERCEL_ISOLATION_ROOT: ${{ steps.runtime.outputs.isolation-root }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
        run: >-
          ${{ steps.runtime.outputs.node-bin }}
          scripts/vercel-production-shadow.mjs prepare-pull-staging
      - name: Pull App custom-v3 configuration
        if: >-
          steps.preflight.outputs.action == 'create' ||
          contains(fromJSON(needs.prepare-release.outputs.shadow_targets), 'app')
        env:
          SOURCE_PATH: ${{ steps.runtime.outputs.pull-staging-path }}
          TRUSTED_NODE_PATH: ${{ steps.runtime.outputs.node-bin }}
          TRUSTED_VERCEL_CLI_PATH: ${{ steps.runtime.outputs.vercel-cli }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: >-
          ${{ steps.runtime.outputs.node-bin }}
          scripts/vercel-production-shadow.mjs pull
      - name: Validate App project link and Root Directory
        if: >-
          steps.preflight.outputs.action == 'create' ||
          contains(fromJSON(needs.prepare-release.outputs.shadow_targets), 'app')
        env:
          PULL_STAGING_PATH: ${{ steps.runtime.outputs.pull-staging-path }}
          SOURCE_PATH: ${{ steps.runtime.outputs.pull-staging-path }}
          VERCEL_ISOLATION_ROOT: ${{ steps.runtime.outputs.isolation-root }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: |
          "${{ steps.runtime.outputs.node-bin }}" scripts/vercel-production-shadow.mjs validate-pull-staging
          "${{ steps.runtime.outputs.node-bin }}" scripts/vercel-deployment-state.mjs project --project-id "$VERCEL_PROJECT_ID" --project-name app.mento.org --root-directory apps/app.mento.org
      - name: Build exact App custom-v3 output without deploying
        if: >-
          steps.preflight.outputs.action == 'create' ||
          contains(fromJSON(needs.prepare-release.outputs.shadow_targets), 'app')
        id: build
        env:
          CI: 1
          MENTO_NEXT_DEPLOYMENT_ID: ${{ steps.intent.outputs.candidate_id }}
          NEXT_PUBLIC_VERCEL_ENV: preview
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          VERCEL: 1
          VERCEL_ENV: preview
          VERCEL_GIT_COMMIT_REF: main
          VERCEL_GIT_COMMIT_SHA: ${{ needs.wait-for-ci.outputs.deploy_sha }}
          VERCEL_GIT_PROVIDER: github
          VERCEL_GIT_REPO_OWNER: mento-protocol
          VERCEL_GIT_REPO_SLUG: frontend-monorepo
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TARGET_ENV: v3
        uses: ./.github/actions/vercel-candidate-build
        with:
          controller-path: ${{ github.workspace }}
          source-path: ${{ github.workspace }}/source
          runtime-root: ${{ steps.runtime.outputs.runtime-root }}
          isolation-root: ${{ steps.runtime.outputs.isolation-root }}
          runtime-marker: ${{ steps.runtime.outputs.runtime-marker }}
          tools-path: ${{ steps.runtime.outputs.tools-path }}
          build-environment-path: ${{ steps.runtime.outputs.build-environment-path }}
          candidate-source-path: ${{ steps.runtime.outputs.candidate-source-path }}
          candidate-home-path: ${{ steps.runtime.outputs.candidate-home-path }}
          pull-staging-path: ${{ steps.runtime.outputs.pull-staging-path }}
          candidate-identity-marker: ${{ steps.runtime.outputs.candidate-identity-marker }}
          build-log-path: ${{ steps.runtime.outputs.build-log-path }}
          provenance-path: ${{ steps.runtime.outputs.provenance-path }}
          upload-source-path: ${{ steps.runtime.outputs.upload-source-path }}
          node-bin: ${{ steps.runtime.outputs.node-bin }}
          pnpm-bin: ${{ steps.runtime.outputs.pnpm-bin }}
          vercel-cli: ${{ steps.runtime.outputs.vercel-cli }}
          deploy-sha: ${{ needs.wait-for-ci.outputs.deploy_sha }}
          next-deployment-id: ${{ steps.intent.outputs.candidate_id }}
          logical-target: app
          expected-root-directory: apps/app.mento.org
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_APP }}
      # Same-run transport only. The archive carries no release, mapping, or
      # journal authority: the digest, byte count, artifact name, and run
      # attempt travel as job outputs through the `needs` graph, and activation
      # re-establishes every property of the tree in its own attempt.
      # `actions/upload-artifact` on a raw directory would dereference the
      # intra-output symlinks the validator accepts and drop the 0600 mapping
      # modes it requires, so the handoff is one archive instead. The archive
      # itself stays uncompressed so the seal depends on no external
      # compression binary; the upload deflates it on the wire.
      - name: Seal the immutable App custom-v3 payload
        id: seal
        if: steps.build.outcome == 'success'
        env:
          ISOLATION_ROOT: ${{ steps.runtime.outputs.isolation-root }}
          UPLOAD_SOURCE_PATH: ${{ steps.runtime.outputs.upload-source-path }}
        run: |
          set -euo pipefail
          umask 077
          upload_name=mento-vercel-production-upload-source
          provenance_name="$upload_name.provenance.json"
          test "$UPLOAD_SOURCE_PATH" = "$ISOLATION_ROOT/$upload_name"
          test ! -L "$UPLOAD_SOURCE_PATH"
          test -d "$UPLOAD_SOURCE_PATH"
          test ! -L "$UPLOAD_SOURCE_PATH.provenance.json"
          test -f "$UPLOAD_SOURCE_PATH.provenance.json"
          install -d -m 0700 "$RUNNER_TEMP/app-v3-payload"
          payload="$RUNNER_TEMP/app-v3-payload/app-v3-output.tar"
          tar \
            --create \
            --file "$payload" \
            --directory "$ISOLATION_ROOT" \
            --format=pax \
            --sort=name \
            --numeric-owner \
            --hard-dereference \
            --no-xattrs \
            --no-acls \
            --no-selinux \
            -- "$upload_name" "$provenance_name"
          bytes="$(stat -c %s "$payload")"
          digest="$(sha256sum "$payload" | cut -d ' ' -f1)"
          {
            echo "artifact_name=vercel-main-app-v3-payload-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "bytes=$bytes"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "sha256=$digest"
          } >> "$GITHUB_OUTPUT"
          echo "App custom-v3 payload: $bytes bytes"
      - name: Upload the exact App custom-v3 payload
        if: steps.seal.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          {
            name: "${{ steps.seal.outputs.artifact_name }}",
            path: "${{ runner.temp }}/app-v3-payload/app-v3-output.tar",
            compression-level: 1,
            if-no-files-found: error,
            retention-days: 1,
          }
      - name: Remove authenticated App runtime
        if: ${{ always() }}
        uses: ./.github/actions/vercel-protected-runtime
        with: { operation: cleanup, logical-target: app }

  stage-governance:
    name: Stage governance candidate
    needs: [wait-for-ci, require-ci-success, prepare-release]
    # `prepare-release` can succeed through its explicit skipped-restore route.
    # Override GitHub's implicit success() so that skipped ancestor cannot poison
    # a selected stage after the release has been materialized successfully.
    # `always()` also disables implicit needs-success, so the exact-attempt CI
    # success gate must be asserted here explicitly.
    if: >-
      always() && !cancelled() && needs.wait-for-ci.result == 'success' &&
      needs.require-ci-success.result == 'success' &&
      needs.prepare-release.result == 'success' &&
      contains(fromJSON(needs.prepare-release.outputs.targets), 'governance')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: vercel-cli-production
      deployment: false # trunk-ignore(actionlint/syntax-check): Pinned actionlint has not learned GitHub's deployment key.
    outputs:
      receipt: ${{ steps.finalize.outputs.receipt }}
      evidence: ${{ steps.terminal.outputs.evidence }}
    env:
      DEPLOY_SHA: ${{ needs.wait-for-ci.outputs.deploy_sha }}
      UPSTREAM_RUN_ID: ${{ needs.wait-for-ci.outputs.upstream_run_id }}
      UPSTREAM_RUN_ATTEMPT: ${{ needs.wait-for-ci.outputs.upstream_run_attempt }}
      MAIN_RELEASE_EXECUTION: ${{ needs.prepare-release.outputs.execution }}
      LOGICAL_TARGET: governance
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_GOVERNANCE }}
      VERCEL_PROJECT_ID_GOVERNANCE: ${{ vars.VERCEL_PROJECT_ID_GOVERNANCE }}
    steps:
      - name: Check out trusted governance controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            fetch-depth: 1,
            persist-credentials: false,
            ref: "${{ github.workflow_sha }}",
          }
      - name: Check out exact governance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            fetch-depth: 0,
            path: source,
            persist-credentials: false,
            ref: "${{ needs.wait-for-ci.outputs.deploy_sha }}",
          }
      - name: Prove exact governance source
        env: { GITHUB_WORKFLOW_SHA: "${{ github.workflow_sha }}" }
        run: |
          git -C "$SOURCE_PATH" fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/vercel-main-deployment.mjs validate-source
      - name: Install exact governance source without lifecycle scripts
        uses: ./.github/actions/pnpm-install
        with:
          {
            working-directory: source,
            ignore-scripts: "true",
            filter: frontend-monorepo,
          }
      - name: Materialize execution and create governance current intent
        id: intent
        run: |
          node scripts/vercel-main-release-cli.mjs materialize --output "$RUNNER_TEMP/execution.json"
          node scripts/vercel-main-deployment.mjs candidate-intent --execution "$RUNNER_TEMP/execution.json" --target governance --output "$RUNNER_TEMP/intent.json"
      - name: Prepare protected governance runtime
        id: runtime
        uses: ./.github/actions/vercel-protected-runtime
        with:
          {
            operation: prepare,
            logical-target: governance,
            controller-path: "${{ github.workspace }}",
            source-path: "${{ github.workspace }}/source",
          }
      - name: Verify pinned governance prerequisites
        run: ${{ steps.runtime.outputs.node-bin }} scripts/vercel-prebuilt.mjs check-versions --repo-root "$SOURCE_PATH"
      - name: Prepare runner-owned governance pull staging
        env:
          {
            PULL_STAGING_PATH: "${{ steps.runtime.outputs.pull-staging-path }}",
            SOURCE_PATH: "${{ steps.runtime.outputs.pull-staging-path }}",
            VERCEL_ISOLATION_ROOT: "${{ steps.runtime.outputs.isolation-root }}",
            VERCEL_ORG_ID: "${{ vars.VERCEL_ORG_ID }}",
          }
        run: ${{ steps.runtime.outputs.node-bin }} scripts/vercel-production-shadow.mjs prepare-pull-staging
      - name: Pull governance production configuration
        env:
          {
            SOURCE_PATH: "${{ steps.runtime.outputs.pull-staging-path }}",
            TRUSTED_NODE_PATH: "${{ steps.runtime.outputs.node-bin }}",
            TRUSTED_VERCEL_CLI_PATH: "${{ steps.runtime.outputs.vercel-cli }}",
            VERCEL_ORG_ID: "${{ vars.VERCEL_ORG_ID }}",
            VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN_PRODUCTION }}",
          }
        run: ${{ steps.runtime.outputs.node-bin }} scripts/vercel-production-shadow.mjs pull
      - name: Validate governance project and Root Directory
        env:
          {
            PULL_STAGING_PATH: "${{ steps.runtime.outputs.pull-staging-path }}",
            SOURCE_PATH: "${{ steps.runtime.outputs.pull-staging-path }}",
            VERCEL_ISOLATION_ROOT: "${{ steps.runtime.outputs.isolation-root }}",
            VERCEL_ORG_ID: "${{ vars.VERCEL_ORG_ID }}",
            VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN_PRODUCTION }}",
          }
        run: |
          "${{ steps.runtime.outputs.node-bin }}" scripts/vercel-production-shadow.mjs validate-pull-staging
          "${{ steps.runtime.outputs.node-bin }}" scripts/vercel-deployment-state.mjs project --project-id "$VERCEL_PROJECT_ID" --project-name governance.mento.org --root-directory apps/governance.mento.org
      - name: Preflight governance candidate provider
        id: preflight
        env:
          {
            VERCEL_ORG_ID: "${{ vars.VERCEL_ORG_ID }}",
            VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN_PRODUCTION }}",
          }
        run: node scripts/vercel-main-provider-cli.mjs candidate-preflight --intent "$RUNNER_TEMP/intent.json" --output "$RUNNER_TEMP/preflight.json"
      - name: Materialize governance candidate metadata
        if: steps.preflight.outputs.action == 'create'
        run: node scripts/vercel-main-deployment.mjs candidate-metadata --intent "$RUNNER_TEMP/intent.json" --output "$RUNNER_TEMP/governance-candidate-metadata.json"
      - name: Build and upload governance only when candidate creation is authorized
        id: build
        if: steps.preflight.outputs.action == 'create'
        env:
          CI: 1
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          MENTO_NEXT_DEPLOYMENT_ID: ${{ steps.intent.outputs.candidate_id }}
          NEXT_PUBLIC_VERCEL_ENV: production
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          VERCEL: 1
          VERCEL_ENV: production
          VERCEL_GIT_COMMIT_REF: main
          VERCEL_GIT_COMMIT_SHA: ${{ needs.wait-for-ci.outputs.deploy_sha }}
          VERCEL_GIT_PROVIDER: github
          VERCEL_GIT_REPO_OWNER: mento-protocol
          VERCEL_GIT_REPO_SLUG: frontend-monorepo
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TARGET_ENV: production
        uses: ./.github/actions/vercel-candidate-build
        with:
          controller-path: ${{ github.workspace }}
          source-path: ${{ github.workspace }}/source
          runtime-root: ${{ steps.runtime.outputs.runtime-root }}
          isolation-root: ${{ steps.runtime.outputs.isolation-root }}
          runtime-marker: ${{ steps.runtime.outputs.runtime-marker }}
          tools-path: ${{ steps.runtime.outputs.tools-path }}
          build-environment-path: ${{ steps.runtime.outputs.build-environment-path }}
          candidate-source-path: ${{ steps.runtime.outputs.candidate-source-path }}
          candidate-home-path: ${{ steps.runtime.outputs.candidate-home-path }}
          pull-staging-path: ${{ steps.runtime.outputs.pull-staging-path }}
          candidate-identity-marker: ${{ steps.runtime.outputs.candidate-identity-marker }}
          build-log-path: ${{ steps.runtime.outputs.build-log-path }}
          provenance-path: ${{ steps.runtime.outputs.provenance-path }}
          upload-source-path: ${{ steps.runtime.outputs.upload-source-path }}
          node-bin: ${{ steps.runtime.outputs.node-bin }}
          pnpm-bin: ${{ steps.runtime.outputs.pnpm-bin }}
          vercel-cli: ${{ steps.runtime.outputs.vercel-cli }}
          deploy-sha: ${{ needs.wait-for-ci.outputs.deploy_sha }}
          next-deployment-id: ${{ steps.intent.outputs.candidate_id }}
          logical-target: governance
          expected-root-directory: apps/governance.mento.org
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_GOVERNANCE }}
      - name: Restore trusted governance controller after build
        if: steps.preflight.outputs.action == 'create'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            fetch-depth: 1,
            path: trusted-after-build,
            persist-credentials: false,
            ref: "${{ github.workflow_sha }}",
          }
      - name: Upload governance candidate without public custom domains
        if: steps.preflight.outputs.action == 'create'
        env:
          {
            SOURCE_PATH: "${{ steps.runtime.outputs.upload-source-path }}",
            TRUSTED_NODE_PATH: "${{ steps.runtime.outputs.node-bin }}",
            TRUSTED_VERCEL_CLI_PATH: "${{ steps.runtime.outputs.vercel-cli }}",
            VERCEL_ORG_ID: "${{ vars.VERCEL_ORG_ID }}",
            VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN_PRODUCTION }}",
          }
        run: ${{ steps.runtime.outputs.node-bin }} "$TRUSTED_POST_BUILD_PATH/scripts/vercel-production-shadow.mjs" deploy --candidate-metadata "$RUNNER_TEMP/governance-candidate-metadata.json" --expected "$RUNNER_TEMP/governance-deployment-expectation.json"
      - name: Freshly smoke and finalize governance candidate
        id: finalize
        env:
          {
            VERCEL_ORG_ID: "${{ vars.VERCEL_ORG_ID }}",
            VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN_PRODUCTION }}",
          }
        run: |
          node scripts/vercel-main-provider-cli.mjs candidate-smoke --intent "$RUNNER_TEMP/intent.json" --output "$RUNNER_TEMP/smoke.json"
          node scripts/vercel-main-provider-cli.mjs candidate-finalize --intent "$RUNNER_TEMP/intent.json" --smoke "$RUNNER_TEMP/smoke.json" --preflight "$RUNNER_TEMP/preflight.json" --output "$RUNNER_TEMP/receipt.json"
      - name: Publish governance terminal outputs
        id: terminal
        if: ${{ always() }}
        run: echo "evidence=${{ steps.finalize.outputs.receipt }}" >> "$GITHUB_OUTPUT"
      - name: Upload governance browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          {
            name: "vercel-main-governance-${{ github.run_id }}-${{ github.run_attempt }}",
            path: trusted-after-build/apps/app.mento.org/test-results/,
            if-no-files-found: ignore,
            retention-days: 7,
          }
      - name: Remove authenticated governance runtime
        if: ${{ always() }}
        uses: ./.github/actions/vercel-protected-runtime
        with: { operation: cleanup, logical-target: governance }

