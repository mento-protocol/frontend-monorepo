          node scripts/vercel-main-deployment.mjs active-terminal-state-proof --execution "$RUNNER_TEMP/execution.json" --stage-barrier "$RUNNER_TEMP/stage-barrier.json" --state-proof "$RUNNER_TEMP/null.json" --output "$RUNNER_TEMP/shadow-terminal-state-proof.json"
          node scripts/vercel-main-release-cli.mjs terminal-artifacts --active-evidence-output "$RUNNER_TEMP/active-evidence.json" --execution "$RUNNER_TEMP/execution.json" --final-census "$RUNNER_TEMP/shadow-terminal-state-proof.json" --final-mappings "$RUNNER_TEMP/shadow-mappings.json" --freshness "$RUNNER_TEMP/null.json" --journal-history "$RUNNER_TEMP/empty-history.json" --legacy-v2 "$RUNNER_TEMP/shadow-legacy.json" --outcome shadow-prepared --proofs-output "$RUNNER_TEMP/terminal-proofs.json" --public-smokes "$RUNNER_TEMP/shadow-public-smokes.json" --stage-results "$RUNNER_TEMP/null.json" --state-proof "$RUNNER_TEMP/shadow-terminal-state-proof.json"
