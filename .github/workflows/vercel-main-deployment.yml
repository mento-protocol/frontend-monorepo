        run: |
          node scripts/vercel-deployment-state.mjs planning-snapshot --spec "$RUNNER_TEMP/main-spec.json" --output "$RUNNER_TEMP/current-planning.json"
          node scripts/vercel-deployment-state.mjs snapshot --spec "$RUNNER_TEMP/legacy-spec.json" --output "$RUNNER_TEMP/current-legacy.json"
          node scripts/vercel-main-provider-cli.mjs canonical-mappings --planning-snapshot "$RUNNER_TEMP/current-planning.json" --legacy-snapshot "$RUNNER_TEMP/current-legacy.json" --output "$RUNNER_TEMP/current-mappings.json"
          node scripts/vercel-main-release-cli.mjs forward-journal --execution "$RUNNER_TEMP/execution.json" --current-mappings "$RUNNER_TEMP/current-mappings.json" --candidate-receipts "$RUNNER_TEMP/all-candidate-receipts.json" --output "$RUNNER_TEMP/prepared-journal.json"
