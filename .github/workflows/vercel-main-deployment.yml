          MENTO_NEXT_DEPLOYMENT_ID: ${{ steps.app-intent.outputs.candidate_id }}
          SOURCE_PATH: ${{ steps.app-runtime.outputs.upload-source-path }}
          VERCEL_ISOLATION_ROOT: ${{ steps.app-runtime.outputs.isolation-root }}
