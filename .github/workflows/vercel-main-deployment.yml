            TRUSTED_NODE_PATH: "${{ steps.runtime.outputs.node-bin }}",
            TRUSTED_VERCEL_CLI_PATH: "${{ steps.runtime.outputs.vercel-cli }}",
            VERCEL_ORG_ID: "${{ vars.VERCEL_ORG_ID }}",
