          install -m 0600 "$RUNNER_TEMP/inherited-initialized-journal.json" "$RUNNER_TEMP/inherited-journals/$ARTIFACT_NAME/main-journal.json"
          node scripts/vercel-main-deployment.mjs active-journal-history --artifacts "$RUNNER_TEMP/inherited-journals" --output "$RUNNER_TEMP/inherited-initialized-history.json"
          node scripts/vercel-main-deployment.mjs active-journal-receipt --journal "$RUNNER_TEMP/inherited-initialized-journal.json" --artifact-name "$ARTIFACT_NAME" --artifact-id "$ARTIFACT_ID" --output "$RUNNER_TEMP/inherited-initialized-receipt.json"
          install -m 0600 "$RUNNER_TEMP/inherited-initialized-history.json" "$RUNNER_TEMP/inherited-journals/current-history.json"
          install -m 0600 "$RUNNER_TEMP/inherited-initialized-journal.json" "$RUNNER_TEMP/inherited-journals/current-journal.json"
